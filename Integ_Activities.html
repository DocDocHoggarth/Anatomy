ted);text-transform:uppercase;letter-spacing:.06em}\n.task{font-size:15.5px;max-width:66ch;margin:0 0 20px}\n\n.scrub{border:1px solid var(--line);border-top:4px solid var(--cardinal);background:#fff;\n  padding:16px 20px;margin-bottom:22px}\n.scrub .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}\n.temp{font-size:26px;font-weight:700;color:var(--ink)}\n.temp small{font-size:11.5px;font-weight:400;color:var(--muted);text-transform:uppercase;\n  letter-spacing:.06em;display:block}\n.zone{font-size:13px;color:#fff;padding:5px 14px;font-weight:700}\ninput[type=range]{width:100%;margin:16px 0 8px;accent-color:var(--cardinal)}\n.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}\n.jumps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}\n.jumps button{font:inherit;font-size:13px;background:#fff;border:1px solid var(--line);\n  padding:6px 12px;cursor:pointer;color:var(--ink2)}\n.jumps button:hover{border-color:var(--cardinal);color:var(--cardinal)}\n\n.stage{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:start}\nfigure{margin:0;background:#fff;border:1px solid var(--line)}\n.figscroll{overflow-x:auto}\nfigure svg{display:block;width:100%;height:auto}\n.figscroll svg{min-width:520px}\nfigcaption{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--ink2);line-height:1.45}\nfigcaption .num{color:var(--cardinal);font-weight:700}\nfigcaption .src{display:block;margin-top:4px;font-size:11px;color:var(--muted)}\n.svgtxt{font-family:Calibri,Carlito,\"Segoe UI\",Arial,sans-serif}\ndetails.figdesc{border-top:1px solid var(--line);background:#FCFCFC}\ndetails.figdesc summary{cursor:pointer;padding:9px 14px;font-size:12px;color:var(--blue-dk);\n  list-style:none}\ndetails.figdesc summary::-webkit-details-marker{display:none}\ndetails.figdesc summary::before{content:\"▸ \";}\ndetails.figdesc[open] summary::before{content:\"▾ \";}\ndetails.figdesc .body{padding:0 14px 14px;font-size:13px;color:var(--ink2);max-width:70ch}\ndetails.figdesc .body p{margin:0 0 9px}\n\n.readout{display:grid;gap:8px;margin-bottom:18px}\n.rline{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;\n  border-bottom:1px solid var(--line);padding-bottom:8px}\n.rline .lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}\n.rline .val{font-size:15px;font-weight:700}\n.panel{border-top:4px solid var(--cardinal);padding-top:14px}\n.panel h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}\n.panel p{margin:0 0 10px;max-width:54ch}\n.panel ul{margin:0 0 10px;padding-left:19px;max-width:54ch}\n.panel li{margin-bottom:5px}\n.flag{border-left:4px solid var(--cardinal);background:var(--card-pale);padding:12px 14px;margin-top:16px}\n.flag b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;\n  color:var(--cardinal);margin-bottom:4px}\n.flag p{margin:0}\na.src{display:inline-block;margin-top:9px;font-size:12px;color:var(--blue-dk);\n  text-decoration:none;border-bottom:1px solid var(--blue)}\n\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}\n.fcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue-dk)}\n.fcard h3{font-size:17px;color:var(--ink);padding:13px 16px 0}\n.fcard .mech{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);\n  padding:2px 16px 0}\n.fcard p{margin:9px 0 0;padding:0 16px;font-size:14.5px}\n.fcard .pt{margin:12px 0 0;padding:11px 16px 14px;background:#FAFAFA;border-top:1px solid var(--line);\n  font-size:14px}\n.fcard .pt b{color:var(--cardinal);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}\n\n.q{border-top:1px solid var(--line);padding:20px 0}\n.q .stem{margin:0 0 13px;max-width:64ch}\n.opts{display:flex;flex-direction:column;gap:7px;max-width:58ch}\n.opt{font:inherit;font-size:15px;text-align:left;background:#fff;border:1px solid var(--line);\n  padding:10px 13px;cursor:pointer}\n.opt:hover:not([disabled]){border-color:var(--blue-dk)}\n.opt.good{background:var(--green-bg);border-color:var(--green)}\n.opt.bad{background:var(--card-pale);border-color:var(--cardinal)}\n.why{margin:12px 0 0;padding:12px 14px;background:#fff;border-left:4px solid var(--blue-dk);\n  font-size:15px;max-width:64ch}\n.tally{font-size:15px;color:var(--muted);margin-top:18px}\n\n.beyond{border-top:4px solid var(--blue-dk);padding-top:16px;margin-top:20px}\n.beyond h2{font-size:20px;color:var(--blue-dk);margin-bottom:4px}\n.beyond .intro{font-size:14.5px;max-width:70ch;margin:0 0 16px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:11px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:14.5px;max-width:62ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}\nul.srcs a{font-size:13.5px}\nnav.pager{border-top:1px solid var(--line);padding:18px 0 56px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n@media (max-width:900px){.stage{grid-template-columns:1fr;gap:24px}\n  ul.srcs li{grid-template-columns:1fr;gap:6px}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>&#183; Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 &#183; Foundational Movement Science III</span>\n</div></div>\n<div class=\"modbar\"><div class=\"wrap\">\n  <span><b>Module 5</b> &#183; What the skin does</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>What the skin does</h1>\n  <p class=\"lede\">The anatomy modules covered structure. This one covers function — and function is where the skin stops being a covering and starts being an organ you have to account for in an exercise prescription.</p>\n</div>\n\n<main class=\"wrap\">\n\n<!-- ================= THERMOREGULATION ================= -->\n<section>\n  <div class=\"head\"><h2>Thermoregulation</h2><span>Interactive</span></div>\n  <p class=\"task\">Move the slider from a cold room to heat stress and watch the three effectors respond. All three are sympathetic. Notice which one switches on first, and how much of the response happens before the person feels hot.</p>\n\n  <div class=\"scrub\">\n    <div class=\"top\">\n      <span class=\"temp\"><small>Ambient temperature</small><span id=\"tempread\">20 °C / 68 °F</span></span>\n      <span class=\"zone\" id=\"zoneread\">Thermoneutral</span>\n    </div>\n    <input type=\"range\" id=\"slider\" min=\"0\" max=\"100\" value=\"40\" step=\"1\"\n           aria-label=\"Ambient temperature from cold to heat stress\">\n    <div class=\"scale\"><span>Cold</span><span>Thermoneutral</span><span>Heat stress / exercise</span></div>\n    <div class=\"jumps\">\n      <button data-v=\"6\">Cold room, 7 °C</button>\n      <button data-v=\"40\">Thermoneutral, 20 °C</button>\n      <button data-v=\"72\">Warm, 30 °C</button>\n      <button data-v=\"96\">Exercise in heat, 38 °C</button>\n    </div>\n  </div>\n\n  <div class=\"stage\">\n    <div>\n      <figure>\n        <div class=\"figscroll\">\n          <svg id=\"thermo\" viewBox=\"0 0 600 430\" class=\"svgtxt\" role=\"img\"\n               aria-labelledby=\"thermocap\" aria-describedby=\"thermodesc\">\n            <g id=\"tStatic\"></g><g id=\"tDyn\"></g><g id=\"tLabels\"></g>\n          </svg>\n        </div>\n        <figcaption id=\"thermocap\"><span class=\"num\">Figure 1.</span> The three cutaneous responses to ambient temperature: cutaneous blood flow, eccrine sweating and piloerection. All are driven by sympathetic fibres; the sweat glands are the one sympathetic target served by cholinergic rather than adrenergic transmission.\n          <span class=\"src\">Schematic; not to scale. Prepared for DPTD 733 after Yousef H et al., <i>Physiology, Thermal Regulation</i>, StatPearls.</span></figcaption>\n        <details class=\"figdesc\"><summary>Text description of Figure 1</summary>\n          <div class=\"body\" id=\"thermodesc\"></div></details>\n      </figure>\n    </div>\n\n    <div class=\"panel\">\n      <div class=\"readout\">\n        <div class=\"rline\"><span class=\"lab\">Cutaneous blood flow</span><span class=\"val\" id=\"rBlood\"></span></div>\n        <div class=\"rline\"><span class=\"lab\">Eccrine sweating</span><span class=\"val\" id=\"rSweat\"></span></div>\n        <div class=\"rline\"><span class=\"lab\">Arrector pili</span><span class=\"val\" id=\"rPilo\"></span></div>\n        <div class=\"rline\"><span class=\"lab\">Net heat exchange</span><span class=\"val\" id=\"rHeat\"></span></div>\n      </div>\n      <div id=\"tPanel\"></div>\n    </div>\n  </div>\n</section>\n\n<!-- ================= BARRIER AND HYDRATION ================= -->\n<section>\n  <div class=\"head\"><h2>Barrier and hydration</h2><span>Reference figure</span></div>\n  <p class=\"task\">The stratum corneum is often described as brick-and-mortar: corneocytes are the bricks, intercellular lipids from the stratum granulosum are the mortar. Water is held in by the mortar and by the natural moisturizing factor inside the bricks. Take either away and transepidermal water loss climbs.</p>\n\n  <figure>\n    <div class=\"figscroll\">\n      <svg viewBox=\"0 0 660 300\" class=\"svgtxt\" role=\"img\"\n           aria-labelledby=\"barriercap\" aria-describedby=\"barrierdesc\">\n        <text x=\"30\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#1B5E20\">Intact barrier</text>\n        <text x=\"360\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#C8102E\">Depleted barrier</text>\n\n        <!-- intact -->\n        <rect x=\"30\" y=\"40\" width=\"280\" height=\"120\" fill=\"#F1DFC6\"/>\n        <g id=\"bricksA\"></g>\n        <rect x=\"30\" y=\"160\" width=\"280\" height=\"18\" fill=\"#EFCBD3\" stroke=\"#B07C8C\"/>\n        <rect x=\"30\" y=\"178\" width=\"280\" height=\"52\" fill=\"#E7AFBD\" stroke=\"#B07C8C\"/>\n        <text x=\"36\" y=\"173\" font-size=\"10.5\" fill=\"#7A4A5C\">Stratum granulosum — lipid source</text>\n        <text x=\"36\" y=\"200\" font-size=\"10.5\" fill=\"#7A4A5C\">Living epidermis</text>\n        <g stroke=\"#4599C7\" stroke-width=\"2\" fill=\"none\">\n          <path d=\"M80 40 L80 22\"/><path d=\"M170 40 L170 22\"/>\n        </g>\n        <polygon points=\"76,24 84,24 80,12\" fill=\"#4599C7\"/>\n        <polygon points=\"166,24 174,24 170,12\" fill=\"#4599C7\"/>\n        <text x=\"196\" y=\"20\" font-size=\"11\" fill=\"#256C93\">Low water loss</text>\n\n        <!-- depleted -->\n        <rect x=\"360\" y=\"40\" width=\"280\" height=\"120\" fill=\"#F1DFC6\"/>\n        <g id=\"bricksB\"></g>\n        <path d=\"M470 40 L462 100 L476 130 L468 160\" stroke=\"#C8102E\" stroke-width=\"3\" fill=\"none\"/>\n        <rect x=\"360\" y=\"160\" width=\"280\" height=\"18\" fill=\"#EFCBD3\" stroke=\"#B07C8C\"/>\n        <rect x=\"360\" y=\"178\" width=\"280\" height=\"52\" fill=\"#E7AFBD\" stroke=\"#B07C8C\"/>\n        <text x=\"366\" y=\"173\" font-size=\"10.5\" fill=\"#7A4A5C\">Lipid production reduced</text>\n        <g stroke=\"#C8102E\" stroke-width=\"2.4\" fill=\"none\">\n          <path d=\"M400 40 L400 18\"/><path d=\"M440 40 L440 14\"/><path d=\"M470 40 L470 10\"/>\n          <path d=\"M510 40 L510 14\"/><path d=\"M560 40 L560 18\"/>\n        </g>\n        <polygon points=\"396,20 404,20 400,8\" fill=\"#C8102E\"/>\n        <polygon points=\"436,16 444,16 440,4\" fill=\"#C8102E\"/>\n        <polygon points=\"466,12 474,12 470,2\" fill=\"#C8102E\"/>\n        <polygon points=\"506,16 514,16 510,4\" fill=\"#C8102E\"/>\n        <polygon points=\"556,20 564,20 560,8\" fill=\"#C8102E\"/>\n        <text x=\"586\" y=\"20\" font-size=\"11\" fill=\"#C8102E\" text-anchor=\"end\">High water loss · fissuring</text>\n\n        <!-- key -->\n        <g font-size=\"11.5\" fill=\"#333\">\n          <rect x=\"30\" y=\"252\" width=\"18\" height=\"11\" fill=\"#F6E2C4\" stroke=\"#B08D5E\"/>\n          <text x=\"56\" y=\"262\">Corneocyte (&#8220;brick&#8221;) holding natural moisturizing factor</text>\n          <rect x=\"330\" y=\"252\" width=\"18\" height=\"11\" fill=\"#D9BE93\"/>\n          <text x=\"356\" y=\"262\">Intercellular lipid (&#8220;mortar&#8221;)</text>\n          <path d=\"M34 282 L48 282\" stroke=\"#4599C7\" stroke-width=\"2.4\"/>\n          <text x=\"56\" y=\"286\">Transepidermal water loss</text>\n          <path d=\"M330 282 L348 282\" stroke=\"#C8102E\" stroke-width=\"3\"/>\n          <text x=\"356\" y=\"286\">Fissure through the corneum</text>\n        </g>\n      </svg>\n    </div>\n    <figcaption id=\"barriercap\"><span class=\"num\">Figure 2.</span> The brick-and-mortar model of the stratum corneum, intact and depleted. On the right, reduced lipid mortar allows water to escape freely; the corneum dries, loses flexibility and splits, and the split is a route in for bacteria.\n      <span class=\"src\">Schematic. Prepared for DPTD 733.</span></figcaption>\n    <details class=\"figdesc\"><summary>Text description of Figure 2</summary>\n      <div class=\"body\">\n        <p>Two side-by-side cross-sections of the outer epidermis. Each shows the stratum corneum as a stack of flattened rectangular corneocytes — the \"bricks\" — separated by a darker band of intercellular lipid, the \"mortar.\" Beneath each sits a thin stratum granulosum, labelled as the source of those lipids, and then the living epidermis.</p>\n        <p>On the left, labelled \"intact barrier,\" the lipid layers between bricks are thick and continuous. Two thin blue arrows rise from the surface, labelled \"low water loss.\"</p>\n        <p>On the right, labelled \"depleted barrier,\" the lipid layers between the bricks are thin and broken, and the granulosum is labelled \"lipid production reduced.\" Five heavy red arrows of varying length rise from the surface, labelled \"high water loss, fissuring.\" A jagged red line runs from the surface down through the full thickness of the corneum, representing a fissure — a direct route through the barrier.</p>\n        <p>The comparison makes one point: the corneocytes are essentially the same on both sides. What differs is the mortar between them, and that is what the barrier actually depends on.</p>\n      </div></details>\n  </figure>\n</section>\n\n<!-- ================= THE OTHER JOBS ================= -->\n<section>\n  <div class=\"head\"><h2>The other jobs</h2><span>Reference</span></div>\n  <p class=\"task\">Five more functions from your handout, each with the mechanism and the reason a physical therapist should care.</p>\n\n  <div class=\"cards\">\n    <div class=\"fcard\">\n      <h3>Barrier and immune defence</h3>\n      <p class=\"mech\">Stratum corneum · Langerhans cells</p>\n      <p>Keratin and intercellular lipid form the physical and chemical barrier. Langerhans cells in the spinosum present antigen and start the immune response when something crosses it.</p>\n      <p class=\"pt\"><b>Why it matters</b>Every time you break the barrier — sharp debridement, tape removal, a shear injury during a transfer — you have opened the body's first defence. Contact dermatitis under a dressing or brace liner is the immune half of this system reacting.</p>\n    </div>\n\n    <div class=\"fcard\">\n      <h3>UV protection</h3>\n      <p class=\"mech\">Melanocytes · stratum basale</p>\n      <p>Melanin absorbs ultraviolet radiation. Sun exposure increases production, which darkens the skin and raises protection.</p>\n      <p class=\"pt\"><b>Why it matters</b>The same pigment makes erythema harder to see. Assess early pressure damage in darker skin by temperature, tissue firmness and reported pain rather than colour alone.</p>\n    </div>\n\n    <div class=\"fcard\">\n      <h3>Vitamin D synthesis</h3>\n      <p class=\"mech\">UVB exposure · epidermis</p>\n      <p>UVB drives cutaneous synthesis of vitamin D, which supports calcium and phosphorus absorption in the gut and therefore bone.</p>\n      <p class=\"pt\"><b>Why it matters</b>Housebound and institutionalised patients have this pathway largely switched off, and older adults synthesise less from the same exposure. It links directly to bone density and fall-related fracture risk on your caseload.</p>\n    </div>\n\n    <div class=\"fcard\">\n      <h3>Excretion and absorption</h3>\n      <p class=\"mech\">Eccrine sweat · stratum corneum</p>\n      <p>Sweat excretes small amounts of urea, ammonia and salts. The corneum absorbs selectively — enough for topical medication to work, restrictive enough to keep most of the environment out.</p>\n      <p class=\"pt\"><b>Why it matters</b>Topical agents and the coupling medium under an ultrasound head both have to cross this barrier. Absorption also rises where the corneum is thin or broken, which changes the calculation over a wound or on the face.</p>\n    </div>\n\n    <div class=\"fcard\">\n      <h3>Repair and growth</h3>\n      <p class=\"mech\">Stratum basale · cell turnover</p>\n      <p>The epidermis regenerates continuously. Basal cells divide, migrate outward, mature, and are shed — roughly two weeks to the corneum and two weeks more before shedding.</p>\n      <p class=\"pt\"><b>Why it matters</b>Turnover is why superficial damage resolves on its own and why it takes about a month, not a week. Anything that slows mitosis — poor perfusion, malnutrition, corticosteroids, age — slows that clock and everything downstream of it.</p>\n    </div>\n\n    <div class=\"fcard\">\n      <h3>Sensation</h3>\n      <p class=\"mech\">Covered in Module 3</p>\n      <p>The skin is the largest sensory organ, carrying nociceptors, thermoreceptors and four classes of mechanoreceptor at characteristic depths.</p>\n      <p class=\"pt\"><b>Why it matters</b>Cutaneous feedback contributes to gait, postural adjustment and safety. Module 3 covers receptor depth and the bedside test that reaches each one.</p>\n    </div>\n  </div>\n</section>\n\n<!-- ================= CHECK ================= -->\n<section>\n  <div class=\"head\"><h2>Check yourself</h2><span>Six questions</span></div>\n  <p class=\"task\">One best answer each. Rationales appear as you go.</p>\n  <div id=\"quiz\"></div>\n  <p class=\"tally\" id=\"tally\"></p>\n</section>\n\n<section class=\"beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">Your handout lists these functions. The exercise-prescription consequences attached to them, and the mechanisms behind the thermoregulation figure, go past it.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">Heat production and loss, the heat illness spectrum, and core temperature during exercise<em>Behind Figure 1 and the heat stress panel</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK499843/\" target=\"_blank\" rel=\"noopener\">Physiology, Thermal Regulation &#8599;</a></li>\n    <li><span class=\"claim\">Barrier lipids, natural moisturizing factor and transepidermal water loss<em>Behind Figure 2</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK537325/\" target=\"_blank\" rel=\"noopener\">Histology, Skin &#8599;</a></li>\n    <li><span class=\"claim\">Vitamin D: synthesis, requirements, and who is at risk of insufficiency<em>Behind the vitamin D card</em></span><a href=\"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">NIH ODS fact sheet &#8599;</a></li>\n    <li><span class=\"claim\">Anhidrosis, plantar fissuring and the diabetic foot<em>Behind the autonomic neuropathy note</em></span><a href=\"https://iwgdfguidelines.org/guidelines-2023/\" target=\"_blank\" rel=\"noopener\">IWGDF Guidelines 2023 &#8599;</a></li>\n    <li><span class=\"claim\">Assessing erythema and early pressure damage in darker skin<em>Behind the UV protection card</em></span><a href=\"https://learn.npiap.com/products/npiap-staging-for-dark-skin-poster\" target=\"_blank\" rel=\"noopener\">NPIAP dark skin tone poster &#8599;</a></li>\n    <li><span class=\"claim\">Epidermal turnover, cell types and the strata in full<em>Behind the repair and growth card</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470464/\" target=\"_blank\" rel=\"noopener\">Anatomy, Skin: Epidermis &#8599;</a></li>\n  </ul>\n</section>\n\n</main>\n\n<nav class=\"wrap pager\">\n  <a href=\"appendages.html\">← Nails, hair and glands</a>\n  <a href=\"healing.html\">Next: Wound healing timeline →</a>\n</nav>\n\n<script>\nconst NS='http://www.w3.org/2000/svg';\nconst FONT='Calibri, Carlito, \"Segoe UI\", Arial, sans-serif';\nfunction el(t,a){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;}\nfunction add(p,t,a){const n=el(t,a);p.appendChild(n);return n;}\nfunction txt(p,x,y,s,a){const n=add(p,'text',Object.assign({x:x,y:y,'font-family':FONT},a||{}));\n  n.textContent=s;return n;}\n\n/* ---------- brick-and-mortar figure (static) ---------- */\n(function bricks(){\n  const A=document.getElementById('bricksA'), B=document.getElementById('bricksB');\n  const draw=(g,x0,mortar,gap)=>{\n    for(let r=0;r<5;r++){\n      const y=44+r*23;\n      add(g,'rect',{x:x0,y:y+18,width:280,height:mortar,fill:'#D9BE93',\n        opacity:gap&&r%2?0.35:1});\n      for(let c=0;c<6;c++){\n        const w=44, x=x0+2+c*46+(r%2?14:0);\n        if(x+w>x0+280) continue;\n        add(g,'rect',{x:x,y:y,width:w,height:18,fill:'#F6E2C4',stroke:'#B08D5E','stroke-width':1});\n      }\n    }\n  };\n  draw(A,30,5,false);\n  draw(B,360,2,true);\n})();\n\n/* ---------- thermoregulation figure ---------- */\nconst SX0=60, SX1=400, SURF=110;\nconst EPI=[SURF,SURF+26], DERM=[SURF+26,SURF+200], HYP=[SURF+200,SURF+264];\n\n(function tStatic(){\n  const g=document.getElementById('tStatic');\n  add(g,'rect',{x:SX0,y:EPI[0],width:SX1-SX0,height:12,fill:'#F3E4CE',stroke:'#B07C8C'});\n  add(g,'rect',{x:SX0,y:EPI[0]+12,width:SX1-SX0,height:14,fill:'#E7AFBD',stroke:'#B07C8C'});\n  add(g,'rect',{x:SX0,y:DERM[0],width:SX1-SX0,height:DERM[1]-DERM[0],fill:'#F6D3DA',stroke:'#B07C8C'});\n  add(g,'rect',{x:SX0,y:HYP[0],width:SX1-SX0,height:HYP[1]-HYP[0],fill:'#F8E8C2',stroke:'#B07C8C'});\n  add(g,'path',{d:'M '+SX0+' '+DERM[0]+' H '+SX1,stroke:'#8E0C21','stroke-width':2,fill:'none'});\n  const col=[[92,300],[130,318],[300,300],[338,318],[196,330],[262,330]];\n  col.forEach(c=>{add(g,'circle',{cx:c[0],cy:c[1],r:11,fill:'#FDF6E2',stroke:'#E0C689','stroke-width':1.1});});\n  const gg=document.getElementById('tLabels');\n  [['Epidermis',EPI[0],DERM[0]],['Dermis',DERM[0],DERM[1]],['Hypodermis',HYP[0],HYP[1]]].forEach(z=>{\n    add(gg,'path',{d:'M '+(SX0-5)+' '+z[1]+' H '+(SX0-14)+' V '+z[2]+' H '+(SX0-5),\n      fill:'none',stroke:'#8A8A8A','stroke-width':1.2});\n    txt(gg,SX0-21,(z[1]+z[2])/2,z[0],{'font-size':11.5,fill:'#333','text-anchor':'middle',\n      transform:'rotate(-90 '+(SX0-21)+' '+((z[1]+z[2])/2)+')'});\n  });\n  txt(gg,SX0,SURF-72,'Skin surface',{'font-size':11.5,fill:'#666'});\n  txt(gg,436,150,'Hair and arrector pili',{'font-size':12,fill:'#333'});\n  txt(gg,436,214,'Dermal vascular plexus',{'font-size':12,fill:'#333'});\n  txt(gg,436,300,'Eccrine sweat gland',{'font-size':12,fill:'#333'});\n  add(gg,'path',{d:'M 168 190 L 424 146',fill:'none',stroke:'#8A8A8A','stroke-width':1});\n  add(gg,'path',{d:'M 300 250 L 424 210',fill:'none',stroke:'#8A8A8A','stroke-width':1});\n  add(gg,'path',{d:'M 330 292 L 424 296',fill:'none',stroke:'#8A8A8A','stroke-width':1});\n})();\n\nconst HAIRX=160, GLANDX=316;\nfunction drawDyn(v){\n  const g=document.getElementById('tDyn'); g.innerHTML='';\n  const vaso=v/100;                                     // 0 constricted .. 1 dilated\n  const sweat=Math.max(0,Math.min(1,(v-58)/38));\n  const pilo=Math.max(0,Math.min(1,(30-v)/26));\n\n  // vessels: width and colour vary\n  const w=2.2+vaso*7.5;\n  const col=vaso>.55?'#EF3340':vaso>.3?'#C8102E':'#8E0C21';\n  const plex=(y,ww,c)=>{\n    let d='M '+(SX0+8)+' '+y;\n    for(let x=SX0+8;x<SX1-8;x+=56) d+=' q 14 -7 28 0 q 14 7 28 0';\n    add(g,'path',{d:d,fill:'none',stroke:c,'stroke-width':ww,'stroke-linecap':'round'});\n  };\n  plex(DERM[0]+34,w,col);\n  plex(HYP[0]-14,w*1.1,col);\n  add(g,'path',{d:'M 356 '+(DERM[0]+34)+' C 380 '+(DERM[0]+90)+', 336 '+(HYP[0]-70)+', 356 '+(HYP[0]-14),\n    fill:'none',stroke:col,'stroke-width':w*.8});\n  // capillary loops toward surface, more prominent when dilated\n  [110,210,270].forEach(x=>{\n    add(g,'path',{d:'M '+(x-6)+' '+(DERM[0]+34)+' L '+(x-6)+' '+(DERM[0]+12)+' a 6 7 0 0 1 12 0 L '+(x+6)+' '+(DERM[0]+34),\n      fill:'none',stroke:col,'stroke-width':1.2+vaso*2.6});\n  });\n\n  // hair follicle + shaft angle\n  const ang=8+pilo*74;                                   // degrees from horizontal\n  const rad=ang*Math.PI/180, len=68;\n  const tipx=HAIRX+Math.cos(rad)*len*(pilo>.5?0.35:1.0), tipy=SURF-Math.sin(rad)*len;\n  add(g,'path',{d:'M '+(HAIRX-9)+' '+SURF+' L '+(HAIRX-10)+' '+(DERM[0]+118)+\n    ' a 12 13 0 0 0 24 0 L '+(HAIRX+9)+' '+SURF+' Z',fill:'#F6DDE4',stroke:'#B5788C','stroke-width':1.2});\n  add(g,'path',{d:'M '+HAIRX+' '+(DERM[0]+120)+' L '+HAIRX+' '+SURF+' L '+tipx.toFixed(1)+' '+tipy.toFixed(1),\n    fill:'none',stroke:'#6B4A38','stroke-width':3.4,'stroke-linecap':'round'});\n  // arrector pili: thicker and shorter when contracted\n  const apw=3.5+pilo*5;\n  add(g,'path',{d:'M '+(HAIRX-10)+' '+(DERM[0]+54)+' L '+(HAIRX-56+pilo*14)+' '+(DERM[0]+8),\n    stroke:'#C4869A','stroke-width':apw,'stroke-linecap':'round',opacity:.9});\n\n  // eccrine gland + duct + droplets\n  add(g,'ellipse',{cx:GLANDX,cy:HYP[0]-34,rx:17,ry:13,fill:'#DCEAF6',stroke:'#4599C7','stroke-width':1.4});\n  for(let k=0;k<3;k++) add(g,'path',{d:'M '+(GLANDX-12)+' '+(HYP[0]-42+k*7)+' q 12 4 24 0',\n    fill:'none',stroke:'#4599C7','stroke-width':1.2,opacity:.8});\n  let duct='M '+GLANDX+' '+(HYP[0]-47);\n  const n=6, st=(HYP[0]-47-SURF)/n;\n  for(let k=0;k<n;k++) duct+=' q '+(9*(k%2?1:-1))+' '+(-st/2).toFixed(1)+' 0 '+(-st).toFixed(1);\n  add(g,'path',{d:duct,fill:'none',stroke:'#4599C7','stroke-width':2+sweat*1.6});\n  const drops=Math.round(sweat*5);\n  for(let k=0;k<drops;k++){\n    const dx=GLANDX-30+k*15, dy=SURF-14-((k*11)%22);\n    add(g,'path',{d:'M '+dx+' '+dy+' c -5 6 -5 11 0 11 c 5 0 5 -5 0 -11 Z',\n      fill:'#4599C7',opacity:.55+0.09*k});\n  }\n\n  // heat exchange arrows above the surface\n  const loss=Math.max(vaso,sweat);\n  const nA=Math.round(1+loss*5);\n  for(let k=0;k<nA;k++){\n    const x=SX0+34+k*((SX1-SX0-70)/Math.max(1,nA-1||1));\n    const h=16+loss*30;\n    add(g,'path',{d:'M '+x+' '+(SURF-8)+' V '+(SURF-8-h),fill:'none',\n      stroke:loss>.5?'#EF3340':'#C8102E','stroke-width':1.4+loss*1.8,opacity:.5+loss*.5});\n    add(g,'polygon',{points:(x-4)+','+(SURF-6-h)+' '+(x+4)+','+(SURF-6-h)+' '+x+','+(SURF-16-h),\n      fill:loss>.5?'#EF3340':'#C8102E',opacity:.5+loss*.5});\n  }\n  txt(g,SX1+10,SURF-30,loss>.5?'Heat lost to the environment':'Heat conserved',\n    {'font-size':12,fill:loss>.5?'#EF3340':'#8E0C21','font-weight':'700'});\n}\n\nconst ZONES=[\n {max:22,name:'Cold',hex:'#256C93',\n  panel:{\n   h:'Cold environment',\n   doing:['Sympathetic vasoconstriction shunts blood away from the skin, shrinking the surface available for heat loss',\n     'Eccrine sweating is switched off',\n     'Arrector pili contract and the hair stands erect — piloerection',\n     'Shivering and non-shivering thermogenesis raise heat production centrally'],\n   flag:['Piloerection is nearly useless in humans','In a furred mammal, erect hair traps an insulating air layer. Humans kept the reflex and lost the fur, so what you actually get is goosebumps. It remains a clean, visible readout of sympathetic outflow — which is why it also appears with fear, pain and strong emotion, not just cold.']}},\n {max:62,name:'Thermoneutral',hex:'#1B5E20',\n  panel:{\n   h:'Thermoneutral',\n   doing:['Cutaneous blood flow sits at a moderate baseline','Eccrine glands are largely quiet','Arrector pili are relaxed and hair lies flat',\n     'Heat production and heat loss are balanced without active effort'],\n   flag:['The reserve is the point','A thermoneutral patient has both directions of response available. A patient with autonomic neuropathy or a spinal cord injury may look identical at rest and have almost no reserve in either direction — which only becomes obvious once you start loading them.']}},\n {max:100,name:'Heat stress or exercise',hex:'#C8102E',\n  panel:{\n   h:'Heat stress or exercise',\n   doing:['Cutaneous vasodilation redirects a large share of cardiac output to the skin to carry core heat to the surface',\n     'Eccrine glands secrete heavily; cooling happens as that sweat evaporates, not as it forms',\n     'Arrector pili relax and hair lies flat',\n     'In humid air, evaporation is limited and the same volume of sweat removes far less heat'],\n   flag:['Skin blood flow competes with muscle','Exercising in heat asks the circulation to supply working muscle and to dump heat at the skin at the same time. That competition is why heart rate drifts upward at a fixed workload, and why a patient with limited cardiac reserve decompensates in a warm clinic before a healthy one notices anything.']}}\n];\n\nfunction zoneFor(v){ return ZONES.find(z=>v<=z.max); }\n\nfunction update(v){\n  const tempC=Math.round(5+v*0.36), tempF=Math.round(tempC*9/5+32);\n  const vaso=v/100, sweat=Math.max(0,Math.min(1,(v-58)/38)), pilo=Math.max(0,Math.min(1,(30-v)/26));\n  const Z=zoneFor(v);\n  document.getElementById('tempread').textContent=tempC+' °C / '+tempF+' °F';\n  const zr=document.getElementById('zoneread');\n  zr.textContent=Z.name; zr.style.background=Z.hex;\n  drawDyn(v);\n\n  const word=(x,lo,mid,hi)=>x<.34?lo:x<.67?mid:hi;\n  document.getElementById('rBlood').textContent=word(vaso,'Vasoconstricted','Baseline','Vasodilated');\n  document.getElementById('rBlood').style.color=vaso<.34?'#256C93':vaso<.67?'#333':'#C8102E';\n  document.getElementById('rSweat').textContent=sweat<.05?'Off':sweat<.5?'Beginning':'Active';\n  document.getElementById('rSweat').style.color=sweat<.05?'#666':'#256C93';\n  document.getElementById('rPilo').textContent=pilo<.05?'Relaxed — hair flat':pilo<.5?'Partial':'Contracted — piloerection';\n  document.getElementById('rPilo').style.color=pilo<.05?'#666':'#256C93';\n  const loss=Math.max(vaso,sweat);\n  document.getElementById('rHeat').textContent=loss<.34?'Conserving heat':loss<.67?'Balanced':'Losing heat';\n  document.getElementById('rHeat').style.color=loss<.34?'#256C93':loss<.67?'#333':'#C8102E';\n\n  const P=Z.panel;\n  document.getElementById('tPanel').innerHTML=\n    '<h3>What is happening</h3><ul>'+P.doing.map(d=>'<li>'+d+'</li>').join('')+'</ul>'+\n    '<div class=\"flag\" style=\"border-left-color:'+Z.hex+'\"><b style=\"color:'+Z.hex+'\">'+P.flag[0]+'</b><p>'+P.flag[1]+'</p>'+\n    '<a class=\"src\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK499843/\" target=\"_blank\" rel=\"noopener\">Physiology, Thermal Regulation — StatPearls &#8599;</a></div>';\n\n  document.getElementById('thermodesc').innerHTML=\n    '<p>A cross-section of skin showing the epidermis as a thin band at the top, a deep dermis beneath it separated by a heavy basement membrane line, and a hypodermis of round fat cells at the bottom. Three structures are drawn: a hair follicle with its shaft and arrector pili muscle on the left, a wavy dermal vascular plexus running horizontally through the dermis and hypodermis, and an eccrine sweat gland on the right with a coiled body deep in the dermis and a spiral duct rising to a surface pore.</p>'+\n    '<p>At the current setting — '+tempC+' degrees Celsius, '+Z.name.toLowerCase()+' — the figure shows the following. '+\n    'The vessels of the dermal plexus are drawn '+(vaso<.34?'narrow and dark red, indicating vasoconstriction and reduced skin blood flow':vaso<.67?'at moderate width, indicating baseline skin blood flow':'wide and bright red, indicating vasodilation and greatly increased skin blood flow')+'. '+\n    (sweat<.05?'No sweat droplets are shown at the surface and the duct is narrow: sweating is off.'\n      :sweat<.5?'A small number of sweat droplets are shown above the surface pore: sweating is beginning.'\n      :'Several sweat droplets are shown above the surface pore and the duct is drawn wide: sweating is active.')+' '+\n    (pilo<.05?'The hair shaft lies almost flat against the surface and the arrector pili muscle is drawn thin and relaxed.'\n      :pilo<.5?'The hair shaft is partly raised and the arrector pili muscle is partly contracted.'\n      :'The hair shaft stands nearly upright and the arrector pili muscle is drawn short and thick, contracted — piloerection.')+'</p>'+\n    '<p>Above the skin surface, '+(loss<.34?'a single short arrow points upward, labelled \"heat conserved\"':loss<.67?'a few medium arrows point upward':'several long arrows point upward, labelled \"heat lost to the environment\"')+\n    ', representing net heat exchange with the environment.</p>';\n}\n\nconst slider=document.getElementById('slider');\nslider.addEventListener('input',()=>update(+slider.value));\ndocument.querySelectorAll('.jumps button').forEach(b=>{\n  b.onclick=()=>{slider.value=b.getAttribute('data-v');update(+slider.value);};\n});\nupdate(40);\n\n/* ---------- quiz ---------- */\nconst Q=[\n{stem:'A patient with a T4 complete spinal cord injury is exercising in a warm gym. Which cutaneous response is most likely to be impaired below the level of the lesion?',\n opts:['Melanin production in response to light','Sympathetic control of sweating and cutaneous vasomotor tone',\n       'Vitamin D synthesis in the epidermis','Keratinocyte turnover in the stratum basale'],a:1,\n why:'All three thermoregulatory effectors — vasomotor tone, eccrine sweating and piloerection — are sympathetic. A lesion at T4 disrupts descending sympathetic control below that level, so a large area of skin cannot vasodilate or sweat on demand. Heat builds with no route out. Cool the environment, shorten bouts, and monitor rather than relying on the patient to report feeling hot.'},\n\n{stem:'Your clinic is warm and humid. A patient is sweating heavily but her temperature keeps climbing. Why is the sweat not working?',\n opts:['Humid air blocks the sweat pores','Cooling comes from evaporation, and humid air slows evaporation',\n       'Apocrine glands take over from eccrine glands in humidity','Sweat produced in humidity contains less water'],a:1,\n why:'Sweat removes heat when it evaporates, not when it is produced. In humid air the vapour gradient is small, evaporation slows, and sweat drips off carrying little heat with it. The patient loses fluid and gets no cooling for it — which is why humidity, not just temperature, belongs in your risk assessment.'},\n\n{stem:'A patient with long-standing diabetes has dry, cracked plantar skin and reports his feet never sweat. Which two functions have failed together?',\n opts:['Vitamin D synthesis and melanin production',\n       'Eccrine thermoregulation and the barrier that depends on surface moisture',\n       'Langerhans immune surveillance and keratinocyte turnover',\n       'Apocrine secretion and sebaceous lubrication'],a:1,\n why:'Autonomic neuropathy takes out the eccrine glands. Thick skin has no sebaceous glands to fall back on, so plantar surface moisture disappears, the corneum dries and splits, and the fissure is an entry point for infection. One autonomic failure produces both a thermoregulatory and a barrier problem.'},\n\n{stem:'Why does a patient with severe xerosis have skin that fissures rather than simply looking dry?',\n opts:['Corneocytes are lost, leaving the dermis exposed',\n       'Depleted intercellular lipids raise transepidermal water loss; the dried corneum loses flexibility and splits under load',\n       'Melanin production falls, weakening the barrier',\n       'The basement membrane detaches from the dermis'],a:1,\n why:'The barrier is the lipid mortar as much as the corneocyte bricks. Lose the mortar and water escapes; the corneum dries, stiffens, and cracks under normal mechanical load. Emollients work by replacing what the stratum granulosum is failing to supply.'},\n\n{stem:'A frail, housebound 82-year-old has a low serum vitamin D. What is the cutaneous contribution to that finding?',\n opts:['The skin absorbs dietary vitamin D and absorption falls with age',\n       'UVB exposure drives cutaneous synthesis, and both exposure and synthetic capacity are reduced',\n       'The hypodermis stores vitamin D and adipose is lost with age',\n       'Melanocytes convert vitamin D to its active form'],a:1,\n why:'Cutaneous synthesis requires UVB. A housebound patient gets little, and older skin synthesises less from the same exposure. Vitamin D supports calcium and phosphorus absorption, so this sits directly upstream of bone density and fall-related fracture risk on your caseload.'},\n\n{stem:'A superficial abrasion on the forearm has resolved without a mark after about four weeks. Which process accounts for that timeline?',\n opts:['Scar remodelling in the reticular dermis',\n       'Epidermal cell turnover: basal cells divide, migrate outward over roughly two weeks and are shed over roughly two more',\n       'Myofibroblast contraction pulling the edges together',\n       'Angiogenesis restoring the papillary capillary loops'],a:1,\n why:'Damage confined to the epidermis is resolved by normal turnover, not by scar formation. Basal cells replace what was lost on the regular schedule — about two weeks to reach the corneum and two more before shedding. Anything that slows mitosis, including poor perfusion, malnutrition, corticosteroids and age, stretches that timeline.'}\n];\n(function(){\n  const c=document.getElementById('quiz'); const ans=[]; let done=0,score=0;\n  function paint(){\n    c.innerHTML='';\n    Q.forEach((q,i)=>{\n      const d=document.createElement('div'); d.className='q';\n      d.innerHTML='<p class=\"stem\"><b>'+(i+1)+'.</b> '+q.stem+'</p><div class=\"opts\"></div>';\n      const box=d.querySelector('.opts');\n      q.opts.forEach((o,j)=>{\n        const b=document.createElement('button'); b.className='opt'; b.textContent=o;\n        if(ans[i]!==undefined){ b.disabled=true;\n          if(j===q.a) b.classList.add('good'); else if(j===ans[i]) b.classList.add('bad'); }\n        b.onclick=()=>{ if(ans[i]!==undefined) return; ans[i]=j; done++; if(j===q.a) score++; paint(); };\n        box.appendChild(b);\n      });\n      if(ans[i]!==undefined){\n        const w=document.createElement('p'); w.className='why'; w.innerHTML=q.why; d.appendChild(w);\n      }\n      c.appendChild(d);\n    });\n    document.getElementById('tally').textContent=done\n      ? score+' of '+done+' answered correctly'+(done===Q.length?'.':' so far.') : '';\n  }\n  paint();\n})();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "healing": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Time course of wound healing — DPTD 733</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --red032:#EF3340; --card-pale:#FBEAED;\n  --blue:#4599C7; --blue-dk:#256C93; --green:#1B5E20; --green-bg:#E8F1E9;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666; --line:#D9D9D9; --bg:#F5F5F5;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--ink2);\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}\nh1,h2,h3{font-weight:700;margin:0}\na{color:var(--blue-dk)}\n:focus-visible{outline:3px solid var(--blue-dk);outline-offset:2px}\n.wrap{max-width:1160px;margin:0 auto;padding:0 24px}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.modbar{background:#fff;border-bottom:1px solid var(--line)}\n.modbar .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;\n  padding:11px 24px;font-size:14px;color:var(--muted)}\n.modbar b{color:var(--cardinal)}\nh1{font-size:30px;color:var(--cardinal);margin:30px 0 6px}\n.lede{max-width:70ch;margin:0 0 22px}\n\n.scrub{border:1px solid var(--line);border-top:4px solid var(--cardinal);background:#fff;\n  padding:16px 20px;margin-bottom:22px}\n.scrub .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}\n.clock{font-size:26px;font-weight:700;color:var(--ink)}\n.clock small{font-size:12px;font-weight:400;color:var(--muted);text-transform:uppercase;\n  letter-spacing:.06em;display:block}\n.phasenow{font-size:13px;color:#fff;padding:5px 14px;font-weight:700;letter-spacing:.02em}\ninput[type=range]{width:100%;margin:16px 0 8px;accent-color:var(--cardinal)}\n.jumps{display:flex;gap:6px;flex-wrap:wrap}\n.jumps button{font:inherit;font-size:13px;background:#fff;border:1px solid var(--line);\n  padding:6px 12px;cursor:pointer;color:var(--ink2)}\n.jumps button:hover{border-color:var(--cardinal);color:var(--cardinal)}\n\n.stage{display:grid;grid-template-columns:1.12fr .88fr;gap:34px;align-items:start;padding-bottom:16px}\nfigure{margin:0;background:#fff;border:1px solid var(--line)}\n.figscroll{overflow-x:auto}\nfigure svg{display:block;width:100%;min-width:620px;height:auto}\nfigcaption{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--ink2);line-height:1.45}\nfigcaption .num{color:var(--cardinal);font-weight:700}\nfigcaption .src{display:block;margin-top:4px;font-size:11px;color:var(--muted)}\n\n.panel{border-top:4px solid var(--cardinal);padding-top:14px}\n.panel .kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 3px}\n.panel h2{font-size:26px;margin:0 0 3px;color:var(--cardinal)}\n.panel .span{font-size:13.5px;color:var(--muted);margin:0 0 16px}\n.panel h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 6px}\n.panel ul{margin:0;padding-left:19px}\n.panel li{margin-bottom:6px;max-width:52ch}\n.panel p{margin:0 0 10px;max-width:52ch}\n.flag{border-left:4px solid var(--cardinal);background:var(--card-pale);padding:12px 14px;margin-top:18px}\n.flag b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;\n  color:var(--cardinal);margin-bottom:4px}\n.flag p{margin:0}\na.src{display:inline-block;margin-top:9px;font-size:12px;color:var(--blue-dk);\n  text-decoration:none;border-bottom:1px solid var(--blue)}\n\n.pearls{padding:38px 0 0;margin-top:24px;border-top:1px solid var(--line)}\n.pearls h2{font-size:22px;color:var(--cardinal);margin:0 0 6px}\n.pearls .sub{color:var(--ink2);font-size:15px;margin:0 0 20px;max-width:68ch}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}\n.card{background:#fff;border:1px solid var(--line);padding:0}\n.card h3{font-size:15px;color:#fff;padding:9px 16px;letter-spacing:.02em}\n.card.good h3{background:var(--green)}\n.card.bad h3{background:var(--cardinal)}\n.card ul{margin:0;padding:14px 18px 16px 34px}\n.card li{margin-bottom:7px;font-size:15px}\n.pearls .after{font-size:15px;max-width:70ch;margin:20px 0 0}\n\n.beyond{border-top:4px solid var(--blue-dk);padding-top:16px;margin-top:44px}\n.beyond h2{font-size:20px;color:var(--blue-dk);margin-bottom:4px}\n.beyond .intro{font-size:14.5px;max-width:70ch;margin:0 0 16px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:11px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:14.5px;max-width:62ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}\nul.srcs a{font-size:13.5px}\nnav.pager{border-top:1px solid var(--line);padding:18px 0 56px;margin-top:36px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n@media (max-width:900px){.stage{grid-template-columns:1fr;gap:24px}.two{grid-template-columns:1fr}\n  ul.srcs li{grid-template-columns:1fr;gap:6px}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\ndetails.figdesc{border-top:1px solid var(--line);background:#FCFCFC}\ndetails.figdesc summary{cursor:pointer;padding:9px 14px;font-size:12px;color:var(--blue-dk);list-style:none}\ndetails.figdesc summary::-webkit-details-marker{display:none}\ndetails.figdesc summary::before{content:\"\\25B8  \"}\ndetails.figdesc[open] summary::before{content:\"\\25BE  \"}\ndetails.figdesc .body{padding:0 14px 14px;font-size:13px;color:var(--ink2);max-width:72ch}\ndetails.figdesc .body p{margin:0 0 9px}\ndetails.figdesc .body p:last-child{margin:0}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>· Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 · Foundational Movement Science III</span>\n</div></div>\n<div class=\"modbar\"><div class=\"wrap\">\n  <span><b>Module 6</b> · Wound healing timeline</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>Four phases, and they overlap</h1>\n  <p class=\"lede\">Drag the slider from the moment of injury out to a year. Figure 1 tracks which phases are running, which cells are in the wound, and how much tensile strength the tissue has recovered. The phases are usually taught as a sequence; on the timeline you can see how much of the time two of them are running at once.</p>\n\n  <div class=\"scrub\">\n    <div class=\"top\">\n      <span class=\"clock\"><small>Time since injury</small><span id=\"clock\">30 minutes</span></span>\n      <span class=\"phasenow\" id=\"phasenow\">Hemostasis</span>\n    </div>\n    <input type=\"range\" id=\"slider\" min=\"0\" max=\"300\" value=\"0\" step=\"1\" aria-label=\"Time since injury\">\n    <div class=\"jumps\">\n      <button data-t=\"0.02\">Minutes</button><button data-t=\"1\">Day 1</button>\n      <button data-t=\"3\">Day 3</button><button data-t=\"7\">Week 1</button>\n      <button data-t=\"14\">Week 2</button><button data-t=\"42\">6 weeks</button>\n      <button data-t=\"180\">6 months</button><button data-t=\"365\">1 year</button>\n    </div>\n  </div>\n</div>\n\n<main class=\"wrap stage\">\n  <div>\n    <figure>\n      <div class=\"figscroll\">\n        <svg id=\"chart\" viewBox=\"0 0 720 512\" role=\"img\" aria-describedby=\"figdesc1\"\n             aria-label=\"Charts of healing phases, cell populations and tensile strength over time since injury\">\n          <g id=\"static\"></g><g id=\"marker\"></g>\n        </svg>\n      </div>\n      <figcaption><span class=\"num\">Figure 1.</span> Time course of cutaneous wound healing. <b>(A)</b> Duration and overlap of the four phases. <b>(B)</b> Relative activity of the principal cell populations in the wound bed. <b>(C)</b> Recovery of tensile strength toward its approximate 80% ceiling. Time is plotted on a logarithmic scale.\n        <span class=\"src\">Schematic. Curves show typical relative activity, not measured values; real timelines shift with wound type, perfusion, nutrition, infection, diabetes, smoking, corticosteroid use and age. Prepared for DPTD 733.</span>\n      </figcaption>\n<details class=\"figdesc\"><summary>Text description of Figure 1</summary><div class=\"body\" id=\"figdesc1\"><p>Three stacked charts share a single horizontal axis showing time since injury on a logarithmic scale, running from one hour on the left through one day, one week, one month and out to one year on the right. Faint vertical gridlines mark each of those times across all three charts, and a vertical black marker line, with a triangle at the top, shows the point currently selected on the slider.</p><p>Chart A, labelled Phases of healing, shows four horizontal bars, one per phase, each starting and ending at its own point on the time axis so their overlap is visible. Hemostasis is a very short dark red bar in the first few hours. Inflammation is a bright red bar beginning within hours and running to about day six, so it overlaps the end of hemostasis. Proliferation is a blue bar from about day three to day twenty-four, overlapping the end of inflammation. Maturation is a green bar starting around day eighteen and continuing past the right edge of the chart, overlapping the end of proliferation. At no point does one bar simply stop and the next begin.</p><p>Chart B, labelled Relative cell activity in the wound bed, shows five bell-shaped curves rising and falling in sequence. From left to right they peak in this order: platelets, in dark red, within the first hours; neutrophils, in bright red, at about day one and a half; macrophages, in grey, at about day four; fibroblasts, in blue, at about day ten; and myofibroblasts, in green, at about day fourteen. Each curve overlaps its neighbours substantially, so several cell populations are active at once at almost every point on the timeline. A legend beneath the chart matches each colour to its cell.</p><p>Chart C, labelled Tensile strength of the repaired tissue, plots a single dark red S-shaped curve rising from near zero, with the area beneath it shaded pale red. Percentage gridlines mark 0, 25, 50, 75 and 100. The curve stays very low through the first week, rises steeply between about two weeks and three months, then flattens as it approaches a red dashed horizontal line drawn at 80 percent and labelled approximately 80 percent ceiling. The curve never reaches 100 percent. A white circle on the curve marks the currently selected time, with a boxed readout giving the percentage of original strength recovered at that point.</p></div></details>\n    </figure>\n  </div>\n  <div class=\"panel\" id=\"panel\"></div>\n</main>\n\n<section class=\"wrap pearls\">\n  <h2>Reading a wound at the bedside</h2>\n  <p class=\"sub\">Inflammation is supposed to look alarming for a few days. The question is never whether a wound is red — it is which direction the wound is moving.</p>\n  <div class=\"two\">\n    <div class=\"card good\"><h3>Healing as expected</h3>\n      <ul>\n        <li><b>Drainage decreasing</b> week over week</li>\n        <li><b>Colour settling</b> — early redness and swelling gradually calming; new tissue pink or pale</li>\n        <li><b>Scab intact</b> and staying put until the tissue underneath is ready</li>\n        <li><b>Pain and swelling falling</b> over time</li>\n        <li><b>Edges advancing</b> and the wound measurably smaller</li>\n      </ul></div>\n    <div class=\"card bad\"><h3>Escalating — get it looked at</h3>\n      <ul>\n        <li><b>Increasing</b> redness, warmth or swelling after the first few days</li>\n        <li><b>Pain rising</b> rather than falling</li>\n        <li><b>Purulent drainage</b>, or drainage increasing in volume</li>\n        <li><b>Odour</b>, or a wound that has stalled with no edge advance</li>\n        <li><b>Systemic signs</b> — fever, malaise, rising glucose in a diabetic patient</li>\n      </ul></div>\n  </div>\n  <p class=\"after\">A chronic wound is usually a wound stuck in inflammation. It never gets the macrophage signal to move on, so fibroblasts are never properly recruited and proliferation never really starts. That is why debridement helps: removing necrotic tissue and biofilm takes away the stimulus holding the wound in that phase.</p>\n</section>\n\n<section class=\"wrap beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">The four phases and the signs-of-healing list come from your handout. The loading guidance, the cell curves and the notes on what stalls a wound go further than it does.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">The four phases in depth, including the 80% tensile strength ceiling<em>The backbone of this whole timeline</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470443/\" target=\"_blank\" rel=\"noopener\">Wound Healing Phases &#8599;</a></li>\n    <li><span class=\"claim\">Why the phases overlap rather than run in sequence<em>Behind panel A</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK535406/\" target=\"_blank\" rel=\"noopener\">Physiology, Wound Healing &#8599;</a></li>\n    <li><span class=\"claim\">What impairs healing: corticosteroids, NSAIDs, diabetes, smoking, nutrition, age<em>Behind the inflammation phase note</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK482254/\" target=\"_blank\" rel=\"noopener\">Impaired Wound Healing &#8599;</a></li>\n    <li><span class=\"claim\">Why chronic wounds stall in inflammation, and why debridement helps<em>Behind the closing paragraph on chronic wounds</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK576385/\" target=\"_blank\" rel=\"noopener\">Complex Wound Management &#8599;</a></li>\n    <li><span class=\"claim\">Granulation tissue, healthy against unhealthy, and hypertrophic and keloid scar<em>Behind the proliferation and maturation notes</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK554402/\" target=\"_blank\" rel=\"noopener\">Physiology, Granulation Tissue &#8599;</a></li>\n    <li><span class=\"claim\">Moist wound healing and dressing selection<em>Behind the instruction to keep the wound bed moist</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470199/\" target=\"_blank\" rel=\"noopener\">Wound Dressings &#8599;</a></li>\n    <li><span class=\"claim\">Pressure injury prevention, staging and risk assessment<em>Behind the references to pressure injury throughout</em></span><a href=\"https://npiap.com/\" target=\"_blank\" rel=\"noopener\">NPIAP resources &#8599;</a></li>\n  </ul>\n</section>\n\n<nav class=\"wrap pager\">\n  <a href=\"physiology.html\">← What the skin does</a>\n  <a href=\"clinical.html\">Next: Clinical reasoning check →</a>\n</nav>\n\n<script>\nconst NS='http://www.w3.org/2000/svg';\nconst FONT='Calibri, Carlito, \"Segoe UI\", Arial, sans-serif';\nconst XMIN=Math.log10(0.02), XMAX=Math.log10(500);\nconst L=78, R=694;\nconst AY=38, AH=84;        // panel A bands\nconst BY=170, BH=112;      // panel B plot\nconst CY=350, CH=108;      // panel C plot\nconst AXIS=CY+CH;\n\nconst px=x=>L+(x-XMIN)/(XMAX-XMIN)*(R-L);\nconst tToV=t=>Math.round((Math.log10(t)-XMIN)/(XMAX-XMIN)*300);\nconst vToT=v=>Math.pow(10,XMIN+v/300*(XMAX-XMIN));\n\nconst PHASES=[\n {id:'hemo',name:'Hemostasis',from:0.02,to:0.3,hex:'#8E0C21'},\n {id:'infl',name:'Inflammation',from:0.1,to:6,hex:'#EF3340'},\n {id:'prol',name:'Proliferation',from:2.5,to:24,hex:'#4599C7'},\n {id:'matu',name:'Maturation',from:18,to:500,hex:'#1B5E20'}];\nconst CELLS=[\n {n:'Platelets',mu:-1.25,sd:.42,hex:'#8E0C21'},\n {n:'Neutrophils',mu:0.16,sd:.42,hex:'#EF3340'},\n {n:'Macrophages',mu:0.62,sd:.52,hex:'#666666'},\n {n:'Fibroblasts',mu:1.02,sd:.58,hex:'#256C93'},\n {n:'Myofibroblasts',mu:1.22,sd:.50,hex:'#1B5E20'}];\nconst TICKS=[[0.04,'1 h'],[0.25,'6 h'],[1,'1 d'],[3,'3 d'],[7,'1 wk'],[14,'2 wk'],\n             [30,'1 mo'],[90,'3 mo'],[365,'1 yr']];\n\nconst gauss=(x,mu,sd)=>Math.exp(-((x-mu)*(x-mu))/(2*sd*sd));\nconst strength=x=>78/(1+Math.exp(-(x-1.55)/0.42));\n\nfunction el(t,a){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;}\nfunction add(p,t,a){const n=el(t,a);p.appendChild(n);return n;}\nfunction txt(p,x,y,s,a){const n=add(p,'text',Object.assign({x:x,y:y,'font-family':FONT},a||{}));\n  n.textContent=s;return n;}\n\n(function build(){\n  const g=document.getElementById('static');\n\n  // vertical gridlines through all three panels\n  TICKS.forEach(t=>{\n    const x=px(Math.log10(t[0]));\n    add(g,'path',{d:'M '+x+' '+AY+' V '+AXIS,stroke:'#ECECEC','stroke-width':1});\n  });\n\n  // ---- panel A: phase bands ----\n  txt(g,L-8,AY-12,'A',{'font-size':14,'font-weight':'700',fill:'#C8102E','text-anchor':'end'});\n  txt(g,L,AY-12,'Phases of healing',{'font-size':12.5,fill:'#333333'});\n  PHASES.forEach((p,i)=>{\n    const y=AY+i*21, x1=px(Math.log10(p.from)), x2=px(Math.log10(p.to));\n    add(g,'rect',{x:x1,y:y,width:x2-x1,height:16,fill:p.hex,opacity:.24});\n    add(g,'rect',{x:x1,y:y,width:3,height:16,fill:p.hex});\n    txt(g,L-8,y+12,p.name,{'font-size':11.5,fill:p.hex,'text-anchor':'end','font-weight':'700'});\n  });\n\n  // ---- panel B: cell curves ----\n  txt(g,L-8,BY-16,'B',{'font-size':14,'font-weight':'700',fill:'#C8102E','text-anchor':'end'});\n  txt(g,L,BY-16,'Relative cell activity in the wound bed',{'font-size':12.5,fill:'#333333'});\n  [0,.5,1].forEach(f=>add(g,'path',{d:'M '+L+' '+(BY+BH-f*BH)+' H '+R,\n    stroke:f===0?'#B5B5B5':'#ECECEC','stroke-width':1}));\n  txt(g,L-10,BY+BH/2,'Activity',{'font-size':11,fill:'#666666','text-anchor':'middle',\n    transform:'rotate(-90 '+(L-10)+' '+(BY+BH/2)+')'});\n  CELLS.forEach(c=>{\n    let d='';\n    for(let s=0;s<=220;s++){\n      const x=XMIN+(XMAX-XMIN)*s/220, y=BY+BH-gauss(x,c.mu,c.sd)*BH*.92;\n      d+=(s?' L ':'M ')+px(x).toFixed(1)+' '+y.toFixed(1);\n    }\n    add(g,'path',{d:d,fill:'none',stroke:c.hex,'stroke-width':2.2});\n  });\n\n  // ---- legend ----\n  const lw=(R-L)/CELLS.length;\n  CELLS.forEach((c,i)=>{\n    const x=L+i*lw, y=BY+BH+26;\n    add(g,'rect',{x:x,y:y-8,width:16,height:4,fill:c.hex});\n    txt(g,x+22,y-4,c.n,{'font-size':11.5,fill:'#333333'});\n  });\n\n  // ---- panel C: tensile strength ----\n  txt(g,L-8,CY-16,'C',{'font-size':14,'font-weight':'700',fill:'#C8102E','text-anchor':'end'});\n  txt(g,L,CY-16,'Tensile strength of the repaired tissue',{'font-size':12.5,fill:'#333333'});\n  [0,25,50,75,100].forEach(v=>{\n    const y=CY+CH-v/100*CH;\n    add(g,'path',{d:'M '+L+' '+y+' H '+R,stroke:v===0?'#B5B5B5':'#ECECEC','stroke-width':1});\n    txt(g,L-8,y+4,v+'%',{'font-size':10.5,fill:'#666666','text-anchor':'end'});\n  });\n  const ceil=CY+CH-.80*CH;\n  add(g,'path',{d:'M '+L+' '+ceil+' H '+R,stroke:'#C8102E','stroke-width':1.4,'stroke-dasharray':'6 4'});\n  txt(g,R-2,ceil-6,'~80% ceiling',{'font-size':11,fill:'#C8102E','text-anchor':'end','font-weight':'700'});\n  let d='', area='';\n  for(let s=0;s<=220;s++){\n    const x=XMIN+(XMAX-XMIN)*s/220, y=CY+CH-strength(x)/100*CH;\n    d+=(s?' L ':'M ')+px(x).toFixed(1)+' '+y.toFixed(1);\n  }\n  area='M '+L+' '+(CY+CH)+' L '+d.slice(2)+' L '+R+' '+(CY+CH)+' Z';\n  add(g,'path',{d:area,fill:'#C8102E',opacity:.10});\n  add(g,'path',{d:d,fill:'none',stroke:'#8E0C21','stroke-width':2.6});\n\n  // ---- x axis ----\n  add(g,'path',{d:'M '+L+' '+AXIS+' H '+R,stroke:'#333333','stroke-width':1.4});\n  TICKS.forEach(t=>{\n    const x=px(Math.log10(t[0]));\n    add(g,'path',{d:'M '+x+' '+AXIS+' V '+(AXIS+6),stroke:'#333333','stroke-width':1.2});\n    txt(g,x,AXIS+20,t[1],{'font-size':11.5,fill:'#333333','text-anchor':'middle'});\n  });\n  txt(g,(L+R)/2,AXIS+42,'Time since injury (logarithmic scale)',\n    {'font-size':12,fill:'#666666','text-anchor':'middle'});\n})();\n\nfunction drawMarker(x){\n  const m=document.getElementById('marker'); m.innerHTML='';\n  const X=px(x);\n  add(m,'path',{d:'M '+X+' '+(AY-6)+' V '+AXIS,stroke:'#1A1A1A','stroke-width':1.4,opacity:.8});\n  add(m,'polygon',{points:(X-5)+','+(AY-12)+' '+(X+5)+','+(AY-12)+' '+X+','+(AY-4),fill:'#1A1A1A'});\n  const sv=strength(x), Y=CY+CH-sv/100*CH;\n  add(m,'circle',{cx:X,cy:Y,r:5.5,fill:'#fff',stroke:'#8E0C21','stroke-width':2.6});\n  const right=X>R-190;\n  const bx=right?X-176:X+10;\n  add(m,'rect',{x:bx,y:Y-27,width:166,height:20,fill:'#fff',stroke:'#8E0C21','stroke-width':1});\n  txt(m,bx+8,Y-13,Math.round(sv)+'% of original strength',\n    {'font-size':11.5,fill:'#8E0C21','font-weight':'700'});\n}\n\nconst PSRC={\n hemo:['Physiology, Wound Healing — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK535406/'],\n infl:['Impaired wound healing: steroids, NSAIDs, comorbidity — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK482254/'],\n prol:['Granulation tissue and moist wound healing — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK554402/'],\n matu:['Wound healing phases and remodeling — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK470443/']};\n\nconst CONTENT={\n hemo:{span:'Minutes to hours',\n  doing:['Vasoconstriction narrows the vessels and cuts blood flow to the wound',\n   'Platelets adhere to exposed collagen, degranulate, and recruit more platelets into a plug',\n   'The clotting cascade weaves fibrin across the plug and stabilises it into a firm clot',\n   'The clot dries to a scab — a temporary barrier and the provisional scaffold every later cell migrates on'],\n  see:'Bleeding slows and stops. A clot forms and begins to dry.',\n  do:'<p>Direct pressure, then protect the clot. There is no rehabilitation to be done here, but there is damage to avoid: disturbing the clot restarts the whole sequence.</p><p>Know who will linger in this phase — patients on anticoagulants or antiplatelets, patients with thrombocytopenia or liver disease. Longer hemostasis pushes everything downstream.</p>',\n  flag:['Provisional matrix','The fibrin clot is not just a plug. It is the road surface that neutrophils, macrophages, fibroblasts and keratinocytes all travel on. Everything later is built on top of it.']},\n infl:{span:'Hours to roughly day 4–6',\n  doing:['After the initial vasoconstriction, vessels dilate and become permeable — mast cells drive much of this',\n   'Neutrophils arrive first and phagocytose bacteria and debris',\n   'Macrophages follow, clear what the neutrophils left, and release the cytokines and growth factors that recruit fibroblasts and start angiogenesis',\n   'The macrophage is the pivot: it decides when the wound moves on'],\n  see:'Redness, heat, swelling and pain. Some drainage, which should be decreasing rather than increasing. This is expected, not infection.',\n  do:'<p>Protect and control. Manage edema, keep the wound clean and appropriately moist, and use gentle pain-free range of motion to preserve mobility without disturbing the wound bed.</p><p>Your main clinical job is discrimination: expected inflammation peaks and recedes; infection escalates. Track the direction, not the presence, of redness and pain.</p>',\n  flag:['Suppressing this phase is not free','NSAIDs and corticosteroids blunt inflammation, and inflammation is what recruits the repair crew. A patient on chronic steroids, or hammering ibuprofen after an injury, may be trading short-term comfort for a slower, weaker repair. Worth knowing before you interpret a stalled wound.']},\n prol:{span:'Around day 3 to day 21',\n  doing:['Fibroblasts lay down type III collagen and ground substance, forming granulation tissue',\n   'Angiogenesis builds new capillaries to supply it — the reason granulation looks pink-red and beefy',\n   'Keratinocytes migrate across the wound from the edges and from surviving follicle and gland linings',\n   'Myofibroblasts pull the wound edges inward, shrinking the defect'],\n  see:'Granulation filling the bed, the scab lifting, edges advancing, the wound measurably smaller week to week.',\n  do:'<p>This is where you start earning your keep. Keep the wound bed moist so keratinocytes can migrate — they cannot cross desiccated tissue. Begin controlled, progressive loading: light tension is the signal collagen uses to decide which way to lie.</p><p>At the same time, work against contracture. Myofibroblast contraction is useful in an open wound and a real problem across a joint or in a burn, so position, splint and stretch deliberately rather than waiting to see what happens.</p>',\n  flag:['New tissue is fragile','Granulation tissue and fresh epithelium tear under shear that mature skin would shrug off. Progress load, but progress it in small steps, and check the wound after you change anything.']},\n matu:{span:'Roughly 3 weeks to 1–2 years',\n  doing:['Type III collagen is progressively replaced by stronger type I collagen',\n   'Fibres realign along lines of mechanical tension',\n   'Capillary density falls, and the scar pales and softens',\n   'Tensile strength climbs steadily — and then plateaus'],\n  see:'Scar moving from red and raised toward pale and flat. Itching is common. Hypertrophic or keloid scarring, where it happens, declares itself in this window.',\n  do:'<p>Scar mobilization, sustained stretch, progressive loading, and silicone or compression where indicated. Collagen aligns to the tension you give it, so the loading you prescribe here shapes the final tissue.</p><p>Most patients are discharged long before remodeling finishes. What you teach them about continuing scar management for months matters more than any single session.</p>',\n  flag:['The 80% ceiling','Repaired skin does not reach the tensile strength of the tissue it replaced. Roughly 80% is the peak, and it takes a year or more to get there. Build that into return-to-activity conversations rather than letting the patient discover it.']}};\n\nfunction phaseAt(t){ return t<0.3?'hemo':t<6?'infl':t<21?'prol':'matu'; }\nfunction fmt(t){\n  if(t<1/24) return Math.round(t*24*60)+' minutes';\n  if(t<1) return Math.round(t*24)+' hours';\n  if(t<14) return t<2?'1 day':Math.round(t)+' days';\n  if(t<60) return Math.round(t/7)+' weeks';\n  if(t<365) return Math.round(t/30)+' months';\n  return (t/365).toFixed(1).replace('.0','')+' years';\n}\nfunction update(v){\n  const t=vToT(v), x=Math.log10(t), id=phaseAt(t);\n  const Ph=PHASES.find(p=>p.id===id), C=CONTENT[id];\n  document.getElementById('clock').textContent=fmt(t);\n  const pn=document.getElementById('phasenow');\n  pn.textContent=Ph.name; pn.style.background=Ph.hex;\n  drawMarker(x);\n  const also=PHASES.filter(p=>p.id!==id&&t>=p.from&&t<=p.to).map(p=>p.name);\n  document.getElementById('panel').innerHTML=\n    '<p class=\"kicker\" style=\"color:'+Ph.hex+'\">'+C.span+'</p>'+\n    '<h2 style=\"color:'+Ph.hex+'\">'+Ph.name+'</h2>'+\n    '<p class=\"span\">'+(also.length?'Overlapping with '+also.join(' and ')+' at this point.':'Running alone at this point.')+'</p>'+\n    '<h3>What the tissue is doing</h3><ul>'+C.doing.map(d=>'<li>'+d+'</li>').join('')+'</ul>'+\n    '<h3>What you would see</h3><p>'+C.see+'</p><h3>What you do</h3>'+C.do+\n    '<div class=\"flag\" style=\"border-left-color:'+Ph.hex+'\"><b style=\"color:'+Ph.hex+'\">'+C.flag[0]+'</b><p>'+C.flag[1]+'</p>'+\n    '<a class=\"src\" href=\"'+PSRC[id][1]+'\" target=\"_blank\" rel=\"noopener\">'+PSRC[id][0]+' &#8599;</a></div>';\n}\nconst slider=document.getElementById('slider');\nslider.addEventListener('input',()=>update(+slider.value));\ndocument.querySelectorAll('.jumps button').forEach(b=>{\n  b.onclick=()=>{slider.value=tToV(+b.getAttribute('data-t'));update(+slider.value);};\n});\nupdate(0);\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "clinical": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Clinical reasoning check — Integumentary System</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --red032:#EF3340;\n  --slide:#F5F5F5; --slide2:#E9E9E9; --bg:#F5F5F5;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666;\n  --hema:#256C93; --blue:#4599C7; --blue-dk:#256C93;\n  --eosin:#C8102E; --eosin-soft:#E47082; --eosin-pale:#FBEAED;\n  --keratin:#D9A441; --adipose:#F8E8C2; --line:#D9D9D9;\n  --ok:#1B5E20; --ok-bg:#E8F1E9; --no:#C8102E; --no-bg:#FBEAED;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--slide);color:var(--ink);\n  font-family:Karla,\"Helvetica Neue\",Arial,sans-serif;font-size:17px;line-height:1.6}\nh1,h2,h3{font-family:\"Instrument Serif\",Georgia,serif;font-weight:400}\na{color:var(--hema)}\n:focus-visible{outline:2px solid var(--hema);outline-offset:3px;border-radius:2px}\n.wrap{max-width:800px;margin:0 auto;padding:0 24px}\n.topbar{border-bottom:1px solid var(--line)}\n.topbar .wrap{display:flex;justify-content:space-between;align-items:baseline;\n  padding:14px 24px;font-size:14px;color:var(--ink2);max-width:1000px}\n.topbar b{color:var(--ink)}\nh1{font-size:clamp(2rem,4.6vw,2.9rem);margin:34px 0 6px}\n.lede{color:var(--ink2);max-width:58ch;margin:0 0 30px}\n\n.progress{display:flex;gap:3px;margin-bottom:6px}\n.pip{height:4px;flex:1;background:var(--line)}\n.pip.done{background:var(--ink2)}\n.pip.good{background:var(--ok)}\n.pip.bad{background:var(--no)}\n.pcount{font-size:13px;color:var(--ink2);margin:0 0 26px}\n\n.card{background:#fff;border:1px solid var(--line);padding:26px 28px;margin-bottom:20px}\n.stem{font-size:1.08rem;margin:0 0 20px}\n.stem .case{display:block;color:var(--ink2);font-size:15.5px;margin-bottom:10px}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opt{font:inherit;font-size:15.5px;text-align:left;background:#fff;border:1px solid var(--line);\n  padding:12px 15px;cursor:pointer;border-radius:2px;display:grid;\n  grid-template-columns:26px 1fr;gap:10px;align-items:start;line-height:1.45}\n.opt:hover:not([disabled]){border-color:var(--hema);background:#FCFAFD}\n.opt .k{font-size:13px;color:var(--ink2);padding-top:1px}\n.opt.good{background:var(--ok-bg);border-color:var(--ok)}\n.opt.good .k{color:var(--ok)}\n.opt.bad{background:var(--no-bg);border-color:var(--no)}\n.opt.bad .k{color:var(--no)}\n.opt[disabled]{cursor:default}\n\n.why{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}\n.why .verdict{font-size:15px;font-weight:700;margin:0 0 8px}\n.why .verdict.y{color:var(--ok)}\n.why .verdict.n{color:var(--no)}\n.why p{margin:0 0 10px;font-size:15.5px}\n.why p:last-child{margin:0}\n.trap{background:var(--eosin-pale);border-left:3px solid var(--eosin);padding:11px 14px;\n  font-size:15px;margin-top:12px}\n.trap b{display:block;font-size:12.5px;color:var(--eosin);margin-bottom:2px}\n\n.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\nbutton.act,a.act{font:inherit;font-size:15px;background:var(--ink);color:#fff;border:0;\n  padding:11px 20px;cursor:pointer;border-radius:2px;display:inline-block;text-decoration:none}\nbutton.act:hover,a.act:hover{background:var(--hema);color:#fff}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}\nbutton.ghost:hover{background:var(--eosin-pale)}\n\n/* results */\n.score{font-family:\"Instrument Serif\",Georgia,serif;font-size:4rem;line-height:1;margin:0}\n.score small{font-size:1.4rem;color:var(--ink2)}\n.verdicttext{max-width:56ch;color:var(--ink2);margin:10px 0 26px}\n.review{border-top:1px solid var(--line)}\n.rev{border-bottom:1px solid var(--line);padding:14px 0}\n.rev summary{cursor:pointer;font-size:15.5px;display:grid;grid-template-columns:22px 1fr;gap:10px}\n.rev summary::marker{content:''}\n.mark{font-size:14px;font-weight:700}\n.mark.y{color:var(--ok)}.mark.n{color:var(--no)}\n.rev .body{padding:12px 0 4px 32px;font-size:15px;color:var(--ink2)}\n.rev .body b{color:var(--ink)}\n\nnav.pager{border-top:1px solid var(--line);padding:20px 0 60px;margin-top:40px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n[hidden]{display:none!important}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\n.beyond{border-top:2px solid var(--hema);padding-top:18px;margin-top:48px}\n.beyond h2{font-size:1.5rem;margin:0 0 4px}\n.beyond .intro{font-size:15px;color:var(--ink2);max-width:66ch;margin:0 0 18px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:13px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:15.5px;max-width:60ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:2px}\nul.srcs a{font-size:14px}\na.src{display:inline-block;margin-top:8px;font-size:13px;color:var(--hema);\n  text-decoration:none;border-bottom:1px solid var(--line)}\na.src:hover{border-bottom-color:var(--hema)}\n@media (max-width:640px){ul.srcs li{grid-template-columns:1fr;gap:6px}}\n\n/* ================= NCC DPT brand ================= */\nbody,h1,h2,h3,.clock,.score,.depth,.num,.mark,.qbox .prompt,.stem,.rowname,.zname{\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\nh1,h2,h3{font-weight:700;letter-spacing:0}\nh1{color:var(--cardinal);font-size:30px}\nh2{color:var(--cardinal)}\n.beyond h2{color:var(--blue-dk)}\n.beyond{border-top:4px solid var(--blue-dk)}\n.depth{color:var(--cardinal);font-weight:700}\n.score{font-weight:700;color:var(--cardinal)}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap;max-width:1140px}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.topbar{background:#fff;border-bottom:1px solid var(--line)}\n.topbar b{color:var(--cardinal)}\n.topbar a{color:var(--blue-dk)}\n.head{border-bottom:3px solid var(--cardinal)}\n.head span{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}\nbutton.act,a.act{background:var(--cardinal);font-weight:700;border-radius:0}\nbutton.act:hover,a.act:hover{background:var(--cardinal-dk);color:#fff}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}\nbutton.ghost:hover{background:var(--eosin-pale);color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{background:var(--cardinal);color:#fff;font-weight:700}\n.tile,.opt,.chip{border-radius:0}\n.note b.h,.note b{color:var(--cardinal)}\na.src{color:var(--blue-dk);border-bottom-color:var(--blue)}\n.panel h2,.card h3{letter-spacing:0}\n/* ---- figures ---- */\nfigure{margin:26px 0 0;background:#fff;border:1px solid var(--line)}\n.figscroll{overflow-x:auto}\nfigure svg{display:block;width:100%;height:auto}\nfigcaption{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;\n  color:var(--ink2);line-height:1.45}\nfigcaption .num{color:var(--cardinal);font-weight:700}\nfigcaption .src{display:block;margin-top:4px;font-size:11px;color:var(--muted)}\n.svgtxt{font-family:Calibri,Carlito,\"Segoe UI\",Arial,sans-serif}\n.figlead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);\n  margin:34px 0 0;font-weight:700}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>&#183; Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 &#183; Foundational Movement Science III</span>\n</div></div>\n<div class=\"topbar\"><div class=\"wrap\">\n  <span><b>Module 7</b> · Clinical reasoning check</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>Fifteen patients</h1>\n  <p class=\"lede\">These are not definition questions. Each one gives you a situation and asks what the anatomy means for what you do next. Answer honestly rather than carefully — the point is to find the gaps.</p>\n\n  <div class=\"progress\" id=\"pips\"></div>\n  <p class=\"pcount\" id=\"pcount\"></p>\n\n  <div id=\"stageArea\"></div>\n</div>\n\n\n<section class=\"wrap beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">Every question here has a source link in its rationale. This is the same list gathered in one place.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">Skin tears in aged skin<em>Question 1</em></span><a href=\"https://www.skintears.org/resources\" target=\"_blank\" rel=\"noopener\">ISTAP resources and downloads &#8599;</a></li>\n    <li><span class=\"claim\">Chronic wounds stalled in inflammation, and debridement<em>Question 2</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK576385/\" target=\"_blank\" rel=\"noopener\">Complex Wound Management (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Myofibroblasts, wound contraction and contracture<em>Questions 3 and 15</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK554402/\" target=\"_blank\" rel=\"noopener\">Physiology, Granulation Tissue (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Expected inflammation against infection<em>Question 4</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK535406/\" target=\"_blank\" rel=\"noopener\">Physiology, Wound Healing (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">The diabetic foot: anhidrosis, fissures, screening and offloading<em>Questions 6 and 12</em></span><a href=\"https://iwgdfguidelines.org/guidelines-2023/\" target=\"_blank\" rel=\"noopener\">IWGDF Guidelines (2023 update) &#8599;</a></li>\n    <li><span class=\"claim\">Burn depth, appendage survival and re-epithelialization<em>Question 7</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK430741/\" target=\"_blank\" rel=\"noopener\">Burn Evaluation and Management (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Pressure injury assessment in darker skin<em>Question 8</em></span><a href=\"https://learn.npiap.com/products/npiap-staging-for-dark-skin-poster\" target=\"_blank\" rel=\"noopener\">NPIAP dark skin tone staging poster &#8599;</a></li>\n    <li><span class=\"claim\">Undermining, tunnelling and pressure injury staging<em>Question 10</em></span><a href=\"https://npiap.com/\" target=\"_blank\" rel=\"noopener\">NPIAP resources &#8599;</a></li>\n    <li><span class=\"claim\">The 80% tensile strength ceiling<em>Question 11</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470443/\" target=\"_blank\" rel=\"noopener\">Wound Healing Phases (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Nail anatomy, growth rate and Beau's lines<em>Question 12</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK534769/\" target=\"_blank\" rel=\"noopener\">Anatomy, Nails (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">TENS: mechanism, parameters and contraindications<em>Question 13</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK537188/\" target=\"_blank\" rel=\"noopener\">TENS (StatPearls) &#8599;</a></li>\n    <li><
