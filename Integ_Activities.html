oggle('armed', picked!==null);\n    z.onclick=()=>{\n      if(checked||picked===null) return;\n      placed[picked]=z.dataset.z; picked=null; drawSort();\n    };\n  });\n}\ndocument.getElementById('checkSort').onclick=()=>{\n  const unplaced=FEATURES.filter((f,i)=>placed[i]===null).length;\n  if(unplaced){ document.getElementById('sortResult').textContent=\n    `${unplaced} still in the bank — place them all first.`; return; }\n  checked=true; picked=null; drawSort();\n  const n=FEATURES.filter((f,i)=>placed[i]===f.z).length;\n  document.getElementById('sortResult').textContent=`${n} of ${FEATURES.length} correct.`;\n  const note=document.getElementById('sortNote'); note.hidden=false;\n  note.innerHTML=`<b>Why these groupings matter</b>\n    <p>The <b>basale</b> collects everything to do with origin and anchorage: mitosis, pigment, touch transduction, and the hemidesmosomes holding epidermis to dermis. Lose this layer across a wide area and the wound cannot re-epithelialize from within.</p>\n    <p>The <b>spinosum</b> is about cohesion and immunity — desmosomes resisting shear, Langerhans cells watching for antigen. The <b>granulosum</b> is about barrier manufacture. The <b>corneum</b> is the finished product.</p>\n    <p>Notice that nothing living happens above the granulosum. Every layer superficial to it is product, not process.</p><a class=\"src\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK470464/\" target=\"_blank\" rel=\"noopener\">Anatomy, Skin: Epidermis — StatPearls &#8599;</a>`;\n};\ndocument.getElementById('resetSort').onclick=resetSort;\ndocument.addEventListener('click',()=>{ if(picked!==null && !checked){ picked=null; drawSort(); } });\n\n/* init */\ndo { order=shuffle(CORRECT); } while(order.join()===CORRECT.join());\ndrawOrder(); resetSort();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "sensation": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Receptors and depth — Integumentary System</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --red032:#EF3340;\n  --slide:#F5F5F5; --slide2:#E9E9E9; --bg:#F5F5F5;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666;\n  --hema:#256C93; --blue:#4599C7; --blue-dk:#256C93;\n  --eosin:#C8102E; --eosin-soft:#E47082; --eosin-pale:#FBEAED;\n  --keratin:#D9A441; --adipose:#F8E8C2; --line:#D9D9D9;\n  --ok:#1B5E20; --ok-bg:#E8F1E9; --no:#C8102E; --no-bg:#FBEAED;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--slide);color:var(--ink);\n  font-family:Karla,\"Helvetica Neue\",Arial,sans-serif;font-size:17px;line-height:1.6}\nh1,h2,h3{font-family:\"Instrument Serif\",Georgia,serif;font-weight:400}\na{color:var(--hema)}\n:focus-visible{outline:2px solid var(--hema);outline-offset:3px;border-radius:2px}\n.wrap{max-width:960px;margin:0 auto;padding:0 24px}\n.topbar{border-bottom:1px solid var(--line)}\n.topbar .wrap{display:flex;justify-content:space-between;align-items:baseline;\n  padding:14px 24px;font-size:14px;color:var(--ink2)}\n.topbar b{color:var(--ink)}\nh1{font-size:clamp(2rem,4.6vw,3rem);margin:34px 0 6px}\n.lede{color:var(--ink2);max-width:60ch;margin:0 0 40px}\nsection{padding-bottom:56px}\n.head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--ink);\n  padding-bottom:8px;margin-bottom:8px}\n.head h2{font-size:1.7rem;margin:0}\n.head span{font-size:13px;color:var(--eosin)}\n.task{color:var(--ink2);font-size:15.5px;max-width:62ch;margin:0 0 22px}\n\n.bank{display:flex;flex-wrap:wrap;gap:8px;padding:16px;border:1px dashed var(--line);\n  background:#fff;min-height:66px;margin-bottom:24px}\n.bank:empty::after{content:\"All placed.\";color:var(--ink2);font-size:14px}\n.tile{font:inherit;font-size:14.5px;background:#fff;border:1px solid var(--ink);color:var(--ink);\n  padding:7px 12px;cursor:pointer;border-radius:2px}\n.tile:hover{background:var(--eosin-pale)}\n.tile.picked{background:var(--ink);color:#fff}\n.tile.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}\n.tile.bad{background:var(--no-bg);border-color:var(--no);color:var(--no)}\n\n.stack{border:1px solid #C8A6B6}\n.band{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px 18px;cursor:pointer;\n  align-items:start;border-bottom:1px solid rgba(0,0,0,.08)}\n.band:last-child{border-bottom:0}\n.band .bname{font-size:15px;line-height:1.35}\n.band .bname em{display:block;font-style:italic;font-size:12.5px;color:#5c3a52;opacity:.85;margin-top:2px}\n.band .drops{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}\n.band .drops:empty::after{content:\"drop here\";color:#7a5a6d;opacity:.55;font-size:13px}\n.band.armed{box-shadow:inset 0 0 0 2px var(--eosin)}\n.d1{background:linear-gradient(#F6E3C4,#E2AFC6)}\n.d2{background:#F6CBD6}\n.d3{background:#EFA9BC}\n.d4{background:#F5E2AE}\n\n.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}\nbutton.act{font:inherit;font-size:15px;background:var(--ink);color:#fff;border:0;\n  padding:10px 18px;cursor:pointer;border-radius:2px}\nbutton.act:hover{background:var(--hema)}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}\nbutton.ghost:hover{background:var(--eosin-pale)}\n.result{font-size:15px;color:var(--ink2)}\n\n.note{background:var(--eosin-pale);border-left:3px solid var(--eosin);padding:14px 16px;\n  margin-top:22px;font-size:15.5px;max-width:66ch}\n.note b.h{display:block;font-size:13px;color:var(--eosin);margin-bottom:4px}\n.note p{margin:0 0 10px}.note p:last-child{margin:0}\n\n/* scenarios */\n.q{border-top:1px solid var(--line);padding:22px 0}\n.q .stem{margin:0 0 14px;max-width:64ch}\n.q .stem b{font-weight:700}\n.opts{display:flex;flex-direction:column;gap:7px;max-width:56ch}\n.opt{font:inherit;font-size:15px;text-align:left;background:#fff;border:1px solid var(--line);\n  padding:10px 13px;cursor:pointer;border-radius:2px}\n.opt:hover{border-color:var(--hema)}\n.opt.good{background:var(--ok-bg);border-color:var(--ok)}\n.opt.bad{background:var(--no-bg);border-color:var(--no)}\n.opt[disabled]{cursor:default}\n.why{margin:12px 0 0;padding:12px 14px;background:#fff;border-left:3px solid var(--hema);\n  font-size:15px;max-width:62ch}\n.tally{font-size:15px;color:var(--ink2);margin-top:20px}\n\ntable{border-collapse:collapse;width:100%;font-size:14.5px;margin-top:8px;background:#fff}\nth,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-weight:700;font-size:13px;color:var(--ink2)}\ndetails{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}\nsummary{cursor:pointer;font-size:15px;color:var(--hema)}\n[hidden]{display:none!important}\nnav.pager{border-top:1px solid var(--line);padding:20px 0 60px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n@media (max-width:700px){.band{grid-template-columns:1fr;gap:8px}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\n.beyond{border-top:2px solid var(--hema);padding-top:18px;margin-top:48px}\n.beyond h2{font-size:1.5rem;margin:0 0 4px}\n.beyond .intro{font-size:15px;color:var(--ink2);max-width:66ch;margin:0 0 18px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:13px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:15.5px;max-width:60ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:2px}\nul.srcs a{font-size:14px}\na.src{display:inline-block;margin-top:8px;font-size:13px;color:var(--hema);\n  text-decoration:none;border-bottom:1px solid var(--line)}\na.src:hover{border-bottom-color:var(--hema)}\n@media (max-width:640px){ul.srcs li{grid-template-columns:1fr;gap:6px}}\n\n/* ================= NCC DPT brand ================= */\nbody,h1,h2,h3,.clock,.score,.depth,.num,.mark,.qbox .prompt,.stem,.rowname,.zname{\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\nh1,h2,h3{font-weight:700;letter-spacing:0}\nh1{color:var(--cardinal);font-size:30px}\nh2{color:var(--cardinal)}\n.beyond h2{color:var(--blue-dk)}\n.beyond{border-top:4px solid var(--blue-dk)}\n.depth{color:var(--cardinal);font-weight:700}\n.score{font-weight:700;color:var(--cardinal)}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap;max-width:1140px}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.topbar{background:#fff;border-bottom:1px solid var(--line)}\n.topbar b{color:var(--cardinal)}\n.topbar a{color:var(--blue-dk)}\n.head{border-bottom:3px solid var(--cardinal)}\n.head span{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}\nbutton.act,a.act{background:var(--cardinal);font-weight:700;border-radius:0}\nbutton.act:hover,a.act:hover{background:var(--cardinal-dk);color:#fff}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}\nbutton.ghost:hover{background:var(--eosin-pale);color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{background:var(--cardinal);color:#fff;font-weight:700}\n.tile,.opt,.chip{border-radius:0}\n.note b.h,.note b{color:var(--cardinal)}\na.src{color:var(--blue-dk);border-bottom-color:var(--blue)}\n.panel h2,.card h3{letter-spacing:0}\n/* ---- figures ---- */\nfigure{margin:26px 0 0;background:#fff;border:1px solid var(--line)}\n.figscroll{overflow-x:auto}\n.figscroll svg{min-width:560px}\n\nfigure svg{display:block;width:100%;height:auto}\nfigcaption{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;\n  color:var(--ink2);line-height:1.45}\nfigcaption .num{color:var(--cardinal);font-weight:700}\nfigcaption .src{display:block;margin-top:4px;font-size:11px;color:var(--muted)}\n.svgtxt{font-family:Calibri,Carlito,\"Segoe UI\",Arial,sans-serif}\n.figlead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);\n  margin:34px 0 0;font-weight:700}\n\ndetails.figdesc{border-top:1px solid var(--line);background:#FCFCFC}\ndetails.figdesc summary{cursor:pointer;padding:9px 14px;font-size:12px;color:var(--blue-dk);list-style:none}\ndetails.figdesc summary::-webkit-details-marker{display:none}\ndetails.figdesc summary::before{content:\"\\25B8  \"}\ndetails.figdesc[open] summary::before{content:\"\\25BE  \"}\ndetails.figdesc .body{padding:0 14px 14px;font-size:13px;color:var(--ink2);max-width:72ch}\ndetails.figdesc .body p{margin:0 0 9px}\ndetails.figdesc .body p:last-child{margin:0}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>&#183; Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 &#183; Foundational Movement Science III</span>\n</div></div>\n<div class=\"topbar\"><div class=\"wrap\">\n  <span><b>Module 3</b> · Receptors and depth</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>Depth decides the test</h1>\n  <p class=\"lede\">Every sensory test you run reaches a particular depth and asks a particular receptor a question. Get the anatomy straight and the choice of test stops being memorized.</p>\n</div>\n\n<main class=\"wrap\">\n\n<section>\n  <div class=\"head\"><h2>Place each receptor</h2><span>Part one</span></div>\n  <p class=\"task\">Tap a receptor, then tap the layer it lives in. Tap a placed receptor to send it back to the bank.</p>\n\n  <div class=\"bank\" id=\"bank\"></div>\n\n  <div class=\"stack\" id=\"stack\">\n    <div class=\"band d1\" data-z=\"epi\"><div class=\"bname\">Epidermis<em>including the base of the stratum basale</em></div><div class=\"drops\" data-drops=\"epi\"></div></div>\n    <div class=\"band d2\" data-z=\"pap\"><div class=\"bname\">Papillary dermis<em>inside the dermal papillae</em></div><div class=\"drops\" data-drops=\"pap\"></div></div>\n    <div class=\"band d3\" data-z=\"ret\"><div class=\"bname\">Reticular dermis</div><div class=\"drops\" data-drops=\"ret\"></div></div>\n    <div class=\"band d4\" data-z=\"hyp\"><div class=\"bname\">Deep dermis and hypodermis</div><div class=\"drops\" data-drops=\"hyp\"></div></div>\n  </div>\n\n  <div class=\"actions\">\n    <button class=\"act\" id=\"check\">Check placement</button>\n    <button class=\"act ghost\" id=\"reset\">Start over</button>\n    <span class=\"result\" id=\"res\"></span>\n  </div>\n  <div class=\"note\" id=\"note\" hidden></div>\n</section>\n\n<section>\n  <div class=\"head\"><h2>Which receptor are you testing?</h2><span>Part two</span></div>\n  <p class=\"task\">Six scenarios from a normal objective exam. One best answer each.</p>\n  <div id=\"quiz\"></div>\n  <p class=\"tally\" id=\"tally\"></p>\n\n  <details>\n    <summary>Show the summary table</summary>\n    <table>\n      <thead><tr><th>Receptor</th><th>Depth</th><th>Adaptation</th><th>Encodes</th><th>Bedside test</th></tr></thead>\n      <tbody>\n        <tr><td>Free nerve endings</td><td>Epidermis and dermis</td><td>Slow</td><td>Pain, temperature</td><td>Sharp/dull, hot/cold</td></tr>\n        <tr><td>Merkel cells</td><td>Base of epidermis</td><td>Slow</td><td>Sustained pressure, fine touch, texture, edges</td><td>Monofilament, two-point discrimination</td></tr>\n        <tr><td>Meissner's corpuscles</td><td>Dermal papillae</td><td>Rapid</td><td>Light touch, low-frequency flutter, slip</td><td>Moving light touch, cotton wisp</td></tr>\n        <tr><td>Ruffini endings</td><td>Reticular dermis</td><td>Slow</td><td>Skin stretch, sustained pressure, stretch direction</td><td>Contributes to joint position sense</td></tr>\n        <tr><td>Pacinian corpuscles</td><td>Deep dermis and hypodermis</td><td>Rapid</td><td>Deep pressure, high-frequency vibration</td><td>128 Hz tuning fork</td></tr>\n      </tbody>\n    </table>\n  </details>\n</section>\n\n</main>\n\n\n\n<section class=\"wrap\">\n  <p class=\"figlead\">Reference figure</p>\n  <figure>\n    <div class=\"figscroll\">\n    <svg viewBox=\"0 0 690 330\" class=\"svgtxt\" role=\"img\" aria-describedby=\"figdesc1\"\n         aria-label=\"Diagram of cutaneous receptors at their true depths with modality and adaptation\">\n      <rect x=\"60\" y=\"30\" width=\"270\" height=\"18\" fill=\"#F3E4CE\" stroke=\"#B07C8C\"/>\n      <rect x=\"60\" y=\"48\" width=\"270\" height=\"52\" fill=\"#E7AFBD\" stroke=\"#B07C8C\"/>\n      <rect x=\"60\" y=\"100\" width=\"270\" height=\"52\" fill=\"#F6D3DA\" stroke=\"#B07C8C\"/>\n      <rect x=\"60\" y=\"152\" width=\"270\" height=\"86\" fill=\"#EFB4C0\" stroke=\"#B07C8C\"/>\n      <rect x=\"60\" y=\"238\" width=\"270\" height=\"62\" fill=\"#F8E8C2\" stroke=\"#B07C8C\"/>\n      <path d=\"M60 100 H330\" stroke=\"#8E0C21\" stroke-width=\"2\" fill=\"none\"/>\n      <g stroke=\"#DE93A5\" stroke-width=\"1.3\" fill=\"none\" opacity=\".85\">\n        <path d=\"M74 170 q14 -6 30 0\"/><path d=\"M150 196 q14 6 30 0\"/><path d=\"M240 168 q14 -6 30 0\"/>\n        <path d=\"M96 216 q14 6 30 0\"/><path d=\"M264 214 q14 -6 30 0\"/><path d=\"M176 228 q14 -6 30 0\"/>\n      </g>\n      <g fill=\"#FDF6E2\" stroke=\"#E0C689\" stroke-width=\"1.1\">\n        <circle cx=\"86\" cy=\"262\" r=\"11\"/><circle cx=\"112\" cy=\"284\" r=\"11\"/><circle cx=\"138\" cy=\"262\" r=\"11\"/>\n        <circle cx=\"164\" cy=\"284\" r=\"11\"/><circle cx=\"190\" cy=\"262\" r=\"11\"/><circle cx=\"290\" cy=\"284\" r=\"11\"/>\n        <circle cx=\"300\" cy=\"258\" r=\"11\"/>\n      </g>\n      <!-- receptors -->\n      <g transform=\"translate(104,64)\" stroke=\"#256C93\" stroke-width=\"2\" fill=\"none\">\n        <path d=\"M0 22 L0 -14\"/><path d=\"M0 -2 L-8 -10 M0 2 L8 -6 M0 -6 L7 -14\"/></g>\n      <g transform=\"translate(178,92)\"><circle r=\"5\" fill=\"#256C93\"/>\n        <path d=\"M0 5 L0 15\" stroke=\"#256C93\" stroke-width=\"2\"/>\n        <path d=\"M-5 15 L5 15\" stroke=\"#256C93\" stroke-width=\"2\"/></g>\n      <g transform=\"translate(252,124)\"><ellipse rx=\"6\" ry=\"10\" fill=\"#DCEAF6\" stroke=\"#256C93\" stroke-width=\"1.7\"/>\n        <path d=\"M-3.5 -6 q7 3.5 0 7 q-7 3.5 0 7\" fill=\"none\" stroke=\"#256C93\" stroke-width=\"1.4\"/></g>\n      <g transform=\"translate(140,190)\"><ellipse rx=\"13\" ry=\"5\" fill=\"#DCEAF6\" stroke=\"#256C93\" stroke-width=\"1.6\"/>\n        <path d=\"M-16 0 H16\" stroke=\"#256C93\" stroke-width=\"1.6\"/></g>\n      <g transform=\"translate(236,268)\" fill=\"none\" stroke=\"#256C93\" stroke-width=\"1.5\">\n        <ellipse rx=\"15\" ry=\"10\" fill=\"#E4EFF8\"/><ellipse rx=\"10\" ry=\"6.4\"/>\n        <ellipse rx=\"4.6\" ry=\"2.8\" fill=\"#256C93\"/></g>\n      <!-- zone brackets -->\n      <g font-size=\"11.5\" fill=\"#333\">\n        <path d=\"M55 30 H46 V100 H55\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.2\"/>\n        <text x=\"39\" y=\"65\" text-anchor=\"middle\" transform=\"rotate(-90 39 65)\">Epidermis</text>\n        <path d=\"M55 100 H46 V152 H55\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.2\"/>\n        <text x=\"39\" y=\"126\" text-anchor=\"middle\" transform=\"rotate(-90 39 126)\">Papillary</text>\n        <path d=\"M55 152 H46 V238 H55\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.2\"/>\n        <text x=\"39\" y=\"195\" text-anchor=\"middle\" transform=\"rotate(-90 39 195)\">Reticular</text>\n        <path d=\"M55 238 H46 V300 H55\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.2\"/>\n        <text x=\"39\" y=\"269\" text-anchor=\"middle\" transform=\"rotate(-90 39 269)\">Hypodermis</text>\n      </g>\n      <!-- labels -->\n      <g font-size=\"12.5\" fill=\"#333\">\n        <path d=\"M 112 58 L 352 44 L 364 44\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"112\" cy=\"58\" r=\"2.3\" fill=\"#8A8A8A\"/>\n        <text x=\"370\" y=\"48\" font-weight=\"700\">Free nerve endings</text>\n        <text x=\"370\" y=\"63\" font-size=\"11\" fill=\"#666\">Slowly adapting · pain, temperature</text>\n        <path d=\"M 186 94 L 352 92 L 364 92\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"186\" cy=\"94\" r=\"2.3\" fill=\"#8A8A8A\"/>\n        <text x=\"370\" y=\"96\" font-weight=\"700\">Merkel cells</text>\n        <text x=\"370\" y=\"111\" font-size=\"11\" fill=\"#666\">Slowly adapting · sustained pressure, texture, edges</text>\n        <path d=\"M 260 124 L 352 140 L 364 140\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"260\" cy=\"124\" r=\"2.3\" fill=\"#8A8A8A\"/>\n        <text x=\"370\" y=\"144\" font-weight=\"700\">Meissner&#8217;s corpuscles</text>\n        <text x=\"370\" y=\"159\" font-size=\"11\" fill=\"#666\">Rapidly adapting · light touch, flutter, slip</text>\n        <path d=\"M 155 190 L 352 192 L 364 192\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"155\" cy=\"190\" r=\"2.3\" fill=\"#8A8A8A\"/>\n        <text x=\"370\" y=\"196\" font-weight=\"700\">Ruffini endings</text>\n        <text x=\"370\" y=\"211\" font-size=\"11\" fill=\"#666\">Slowly adapting · skin stretch and its direction</text>\n        <path d=\"M 252 268 L 352 254 L 364 254\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"252\" cy=\"268\" r=\"2.3\" fill=\"#8A8A8A\"/>\n        <text x=\"370\" y=\"258\" font-weight=\"700\">Pacinian corpuscles</text>\n        <text x=\"370\" y=\"273\" font-size=\"11\" fill=\"#666\">Rapidly adapting · deep pressure, high-frequency vibration</text>\n      </g>\n    </svg>\n    </div>\n    <figcaption><span class=\"num\">Figure 1.</span> Cutaneous receptors at their characteristic depths. Receptive fields widen and stimuli coarsen with depth: the two receptor types reaching into the epidermis carry the most localized signals, while the deepest and largest capsule responds to vibration and to changes in pressure rather than steady contact.\n      <span class=\"src\">Schematic; not to scale. Prepared for DPTD 733 after Iheanacho F, Vellipuram AR, <i>Physiology, Mechanoreceptors</i>, StatPearls.</span></figcaption>\n<details class=\"figdesc\"><summary>Text description of Figure 1</summary><div class=\"body\" id=\"figdesc1\"><p>A vertical cross-section of skin, surface at the top, divided into four labelled depth zones by brackets on the left: epidermis, papillary dermis, reticular dermis, and hypodermis. A heavy dark red line marks the boundary between epidermis and papillary dermis. The reticular dermis contains short curved strokes representing collagen bundles; the hypodermis contains round fat cells.</p><p>Five receptors are drawn at their true depths and labelled on the right with their adaptation rate and the stimulus each encodes.</p><p>Highest are the free nerve endings, drawn as a bare blue nerve fibre with small branches, reaching up into the epidermis itself. They are labelled slowly adapting, carrying pain and temperature.</p><p>Just below, at the base of the epidermis, is a Merkel cell: a small solid blue disc with a short nerve fibre beneath it. It is labelled slowly adapting, carrying sustained pressure, texture and edges.</p><p>In the papillary dermis, inside the layer of dermal papillae, sits a Meissner's corpuscle, drawn as a tall narrow oval capsule with a coiled fibre inside. It is labelled rapidly adapting, carrying light touch, flutter and slip.</p><p>Deeper, in the reticular dermis, is a Ruffini ending, drawn as a wide flat horizontal spindle with a nerve fibre running through its long axis. It is labelled slowly adapting, carrying skin stretch and its direction.</p><p>Deepest of all, in the hypodermis, is a Pacinian corpuscle: a large oval drawn as three concentric rings, like an onion in cross-section. It is labelled rapidly adapting, carrying deep pressure and high-frequency vibration.</p><p>The arrangement shows a consistent pattern. The receptors nearest the surface are the smallest and carry the most localized signals; the deeper a receptor sits, the larger it is and the coarser the stimulus it responds to.</p></div></details>\n  </figure>\n</section>\n\n<section class=\"wrap beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">The receptor list is in your handout. The bedside tests attached to each receptor are not &#8212; those come from standard neurological and diabetic foot screening.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">Receptor types, adaptation rates and receptive fields<em>The anatomy behind the whole first exercise</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK541068/\" target=\"_blank\" rel=\"noopener\">Physiology, Mechanoreceptors (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Vibration sense, and why it often fails before monofilament testing does<em>Behind question 1</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK542288/\" target=\"_blank\" rel=\"noopener\">Physiology, Vibratory Sense (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Monofilament screening and the diabetic foot examination<em>Behind question 2 and the loss-of-protective-sensation framing</em></span><a href=\"https://iwgdfguidelines.org/guidelines-2023/\" target=\"_blank\" rel=\"noopener\">IWGDF Guidelines (2023 update) &#8599;</a></li>\n    <li><span class=\"claim\">How TENS works, its parameters and its contraindications<em>Referenced in the clinical reasoning module</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK537188/\" target=\"_blank\" rel=\"noopener\">TENS (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Burn depth and the survival of nociceptors<em>Behind question 6</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK430741/\" target=\"_blank\" rel=\"noopener\">Burn Evaluation and Management (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Thermoreceptors and nociceptors alongside the mechanoreceptors<em>Rounds out the summary table</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK539861/\" target=\"_blank\" rel=\"noopener\">Physiology, Sensory Receptors (StatPearls) &#8599;</a></li>\n  </ul>\n</section>\n\n<nav class=\"wrap pager\">\n  <a href=\"strata-order.html\">← Build the epidermis</a>\n  <a href=\"appendages.html\">Next: Nails, hair and glands →</a>\n</nav>\n\n<script>\n/* ---------- part 1 ---------- */\nconst RECEPTORS=[\n  {t:'Free nerve endings',z:'epi'},\n  {t:'Merkel cells',z:'epi'},\n  {t:\"Meissner's corpuscles\",z:'pap'},\n  {t:'Ruffini endings',z:'ret'},\n  {t:'Pacinian corpuscles',z:'hyp'}\n];\nlet placed={},picked=null,checked=false;\n\nfunction reset(){\n  RECEPTORS.forEach((r,i)=>placed[i]=null);\n  picked=null;checked=false;\n  document.getElementById('res').textContent='';\n  document.getElementById('note').hidden=true;\n  draw();\n}\nfunction draw(){\n  const bank=document.getElementById('bank');bank.innerHTML='';\n  document.querySelectorAll('[data-drops]').forEach(d=>d.innerHTML='');\n  RECEPTORS.forEach((r,i)=>{\n    const b=document.createElement('button');\n    b.className='tile';b.textContent=r.t;\n    if(checked&&placed[i]!==null) b.classList.add(placed[i]===r.z?'good':'bad');\n    if(picked===i) b.classList.add('picked');\n    b.onclick=e=>{\n      e.stopPropagation(); if(checked) return;\n      if(placed[i]!==null){placed[i]=null;picked=null;}\n      else picked = picked===i?null:i;\n      draw();\n    };\n    (placed[i]===null?bank:document.querySelector(`[data-drops=\"${placed[i]}\"]`)).appendChild(b);\n  });\n  document.querySelectorAll('.band').forEach(z=>{\n    z.classList.toggle('armed',picked!==null);\n    z.onclick=()=>{ if(checked||picked===null) return; placed[picked]=z.dataset.z;picked=null;draw(); };\n  });\n}\ndocument.getElementById('check').onclick=()=>{\n  if(RECEPTORS.some((r,i)=>placed[i]===null)){\n    document.getElementById('res').textContent='Place all five first.';return;\n  }\n  checked=true;picked=null;draw();\n  const n=RECEPTORS.filter((r,i)=>placed[i]===r.z).length;\n  document.getElementById('res').textContent=`${n} of 5 correct.`;\n  const note=document.getElementById('note');note.hidden=false;\n  note.innerHTML=`<b class=\"h\">Reading the stack</b>\n    <p>Depth tracks the size of the stimulus. The two receptors that reach into the epidermis — free nerve endings and Merkel cells — handle the smallest, most localized signals: a pinprick, a temperature change, the edge of a shape. Meissner's sit just below in the papillae, close enough for light touch and slip.</p>\n    <p>Go deeper and the receptive fields get bigger and the stimuli coarser. Ruffini endings read stretch across a region of skin; Pacinian corpuscles, deepest and largest, respond to vibration and to the onset and offset of pressure rather than to steady contact.</p>\n    <p>That is why a fingertip can read braille and a heel cannot, and why vibration sense is often the first thing to go when a long peripheral nerve begins to fail.</p><a class=\"src\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK541068/\" target=\"_blank\" rel=\"noopener\">Physiology, Mechanoreceptors — StatPearls &#8599;</a>`;\n};\ndocument.getElementById('reset').onclick=reset;\ndocument.addEventListener('click',()=>{if(picked!==null&&!checked){picked=null;draw();}});\n\n/* ---------- part 2 ---------- */\nconst Q=[\n {stem:'You place a 128 Hz tuning fork on the medial malleolus of a patient with type 2 diabetes. He reports feeling nothing. Which receptor population has this test just interrogated?',\n  opts:[\"Meissner's corpuscles\",\"Pacinian corpuscles\",'Merkel cells','Ruffini endings'],a:1,\n  why:'Pacinian corpuscles are rapidly adapting and tuned to high-frequency vibration, sitting in the deep dermis and hypodermis. Loss of vibration sense is frequently the earliest measurable sensory deficit in diabetic peripheral neuropathy, appearing before monofilament testing turns abnormal.'},\n\n {stem:'A 10 g monofilament is pressed against the plantar surface until it buckles, and held. Which receptor is most directly responsible for detecting that sustained, punctate pressure?',\n  opts:['Merkel cells','Pacinian corpuscles','Free nerve endings',\"Meissner's corpuscles\"],a:0,\n  why:'Merkel cells are slowly adapting and respond to sustained pressure and fine spatial detail, so a held punctate stimulus is squarely their signal. In practice the monofilament is used as a screen for protective sensation overall, but the receptor it asks first is Merkel.'},\n\n {stem:'You stroke a cotton wisp across the dorsum of the hand. The patient feels a static touch but cannot tell that it is moving. Which receptor type is most implicated?',\n  opts:['Ruffini endings',\"Meissner's corpuscles\",'Pacinian corpuscles','Merkel cells'],a:1,\n  why:\"Meissner's corpuscles are rapidly adapting and encode moving light touch and flutter. A rapidly adapting receptor signals change, so if a patient registers contact but not motion, the rapidly adapting channel is the one to suspect.\"},\n\n {stem:'A patient with a healing forearm burn reports burning pain and cannot distinguish warm from cold water. Which endings are involved?',\n  opts:['Merkel cells','Free nerve endings',\"Meissner's corpuscles\",'Ruffini endings'],a:1,\n  why:'Free nerve endings are unencapsulated and carry both nociception and thermal sensation. They are the only sensory endings that reach up into the epidermis, which puts them directly in harm\\'s way in a superficial burn.'},\n\n {stem:'Which receptor contributes to knee position sense by reading how the skin stretches over the joint as it extends?',\n  opts:['Ruffini endings','Pacinian corpuscles','Merkel cells','Free nerve endings'],a:0,\n  why:'Ruffini endings are slowly adapting and sensitive to skin stretch and its direction. Cutaneous stretch is a genuine contributor to proprioception alongside muscle spindles and joint receptors, which is part of why taping and compression can change movement quality without providing real mechanical restraint.'},\n\n {stem:'A superficial partial-thickness burn is intensely painful, while a full-thickness burn in the same patient is not. What explains the difference?',\n  opts:['Full-thickness burns damage fewer nerve fibres overall',\n        'Pain fibres are concentrated in the hypodermis and are spared superficially',\n        'The superficial burn leaves free nerve endings exposed and intact; the full-thickness burn destroys them',\n        'Inflammation is greater in full-thickness burns and blocks nociception'],a:2,\n  why:'A superficial partial-thickness burn strips the barrier above intact nociceptors and leaves them exposed, which is why it hurts so much. A full-thickness burn destroys the dermis and the endings within it, so the wound is insensate. Absent pain in a burn is a sign of depth, not of a mild injury.'}\n];\nlet ans=[],done=0,score=0;\nfunction drawQuiz(){\n  const c=document.getElementById('quiz');c.innerHTML='';\n  Q.forEach((q,i)=>{\n    const d=document.createElement('div');d.className='q';\n    d.innerHTML=`<p class=\"stem\"><b>${i+1}.</b> ${q.stem}</p><div class=\"opts\"></div>`;\n    const box=d.querySelector('.opts');\n    q.opts.forEach((o,j)=>{\n      const b=document.createElement('button');b.className='opt';b.textContent=o;\n      if(ans[i]!==undefined){\n        b.disabled=true;\n        if(j===q.a) b.classList.add('good');\n        else if(j===ans[i]) b.classList.add('bad');\n      }\n      b.onclick=()=>{ if(ans[i]!==undefined) return;\n        ans[i]=j; done++; if(j===q.a) score++; drawQuiz(); };\n      box.appendChild(b);\n    });\n    if(ans[i]!==undefined){\n      const w=document.createElement('p');w.className='why';w.innerHTML=q.why;d.appendChild(w);\n    }\n    c.appendChild(d);\n  });\n  document.getElementById('tally').textContent = done\n    ? `${score} of ${done} answered correctly${done===Q.length?'.':' so far.'}` : '';\n}\nreset(); drawQuiz();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "appendages": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Nails, hair and glands — Integumentary System</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --red032:#EF3340;\n  --slide:#F5F5F5; --slide2:#E9E9E9; --bg:#F5F5F5;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666;\n  --hema:#256C93; --blue:#4599C7; --blue-dk:#256C93;\n  --eosin:#C8102E; --eosin-soft:#E47082; --eosin-pale:#FBEAED;\n  --keratin:#D9A441; --adipose:#F8E8C2; --line:#D9D9D9;\n  --ok:#1B5E20; --ok-bg:#E8F1E9; --no:#C8102E; --no-bg:#FBEAED;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--slide);color:var(--ink);\n  font-family:Karla,\"Helvetica Neue\",Arial,sans-serif;font-size:17px;line-height:1.6}\nh1,h2,h3{font-family:\"Instrument Serif\",Georgia,serif;font-weight:400}\na{color:var(--hema)}\n:focus-visible{outline:2px solid var(--hema);outline-offset:3px;border-radius:2px}\n.wrap{max-width:980px;margin:0 auto;padding:0 24px}\n.topbar{border-bottom:1px solid var(--line)}\n.topbar .wrap{display:flex;justify-content:space-between;align-items:baseline;\n  padding:14px 24px;font-size:14px;color:var(--ink2)}\n.topbar b{color:var(--ink)}\nh1{font-size:clamp(2rem,4.6vw,3rem);margin:34px 0 6px}\n.lede{color:var(--ink2);max-width:62ch;margin:0 0 30px}\n\n.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);flex-wrap:wrap}\n.tabs button{font:inherit;font-size:15px;background:none;border:0;padding:11px 18px;\n  cursor:pointer;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-2px}\n.tabs button[aria-selected=\"true\"]{color:var(--ink);border-bottom-color:var(--eosin);font-weight:700}\n.tabs button:hover{color:var(--ink)}\n.pane{padding:30px 0 60px}\n.pane[hidden]{display:none}\n.task{color:var(--ink2);font-size:15.5px;max-width:64ch;margin:0 0 24px}\n\n.split{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:start}\nsvg{width:100%;height:auto;background:#fff;border:1px solid var(--line);display:block}\n.caption{font-size:12.5px;color:var(--ink2);margin:8px 2px 0}\n\n.bank{display:flex;flex-wrap:wrap;gap:8px;padding:15px;border:1px dashed var(--line);\n  background:#fff;min-height:62px;margin-bottom:22px}\n.bank:empty::after{content:\"All placed.\";color:var(--ink2);font-size:14px}\n.tile{font:inherit;font-size:14px;background:#fff;border:1px solid var(--ink);color:var(--ink);\n  padding:7px 11px;cursor:pointer;border-radius:2px;text-align:left}\n.tile:hover{background:var(--eosin-pale)}\n.tile.picked{background:var(--ink);color:#fff}\n.tile.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}\n.tile.bad{background:var(--no-bg);border-color:var(--no);color:var(--no)}\n\n.slots{border:1px solid var(--line);background:#fff}\n.slot{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;\n  padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}\n.slot:last-child{border-bottom:0}\n.slot.armed{background:var(--eosin-pale)}\n.num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);\n  display:grid;place-items:center;font-size:13px}\n.slot .drops{min-height:32px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.slot .drops:empty::after{content:\"tap to place\";color:#B49BAF;font-size:13px}\n\n.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}\n.col{background:#fff;padding:14px;cursor:pointer;border-right:1px solid var(--line)}\n.col:last-child{border-right:0}\n.col.armed{background:var(--eosin-pale)}\n.col h3{margin:0 0 2px;font-size:1.25rem}\n.col .sub{font-size:12.5px;color:var(--ink2);margin:0 0 12px}\n.col .drops{display:flex;flex-direction:column;gap:6px;min-height:60px}\n.col .drops:empty::after{content:\"tap to place\";color:#B49BAF;font-size:13px}\n\n.rows{border:1px solid var(--line);background:#fff}\n.rowz{display:grid;grid-template-columns:250px 1fr;gap:14px;padding:12px 15px;\n  border-bottom:1px solid var(--line);cursor:pointer;align-items:center}\n.rowz:last-child{border-bottom:0}\n.rowz.armed{background:var(--eosin-pale)}\n.rowz .lbl{font-size:15px}\n.rowz .lbl em{display:block;font-style:italic;font-size:12.5px;color:var(--ink2)}\n.rowz .drops{min-height:32px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.rowz .drops:empty::after{content:\"tap to place\";color:#B49BAF;font-size:13px}\n\n.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}\nbutton.act{font:inherit;font-size:15px;background:var(--ink);color:#fff;border:0;\n  padding:10px 18px;cursor:pointer;border-radius:2px}\nbutton.act:hover{background:var(--hema)}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}\nbutton.ghost:hover{background:var(--eosin-pale)}\n.result{font-size:15px;color:var(--ink2)}\n.note{background:var(--eosin-pale);border-left:3px solid var(--eosin);padding:14px 16px;\n  margin-top:22px;font-size:15.5px;max-width:66ch}\n.note b.h{display:block;font-size:13px;color:var(--eosin);margin-bottom:4px}\n.note p{margin:0 0 10px}.note p:last-child{margin:0}\n\n/* hair cycle strip */\n.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 30px}\n.phase{background:#fff;border:1px solid var(--line);padding:14px}\n.phase h3{margin:0 0 2px;font-size:1.2rem}\n.phase .len{font-size:12.5px;color:var(--eosin);margin:0 0 8px}\n.phase p{margin:0;font-size:14px;color:var(--ink2)}\n.bar{height:8px;background:#EFD6E2;margin-bottom:12px;position:relative}\n.bar i{position:absolute;inset:0 auto 0 0;background:var(--eosin)}\n\n.q{border-top:1px solid var(--line);padding:20px 0}\n.q .stem{margin:0 0 13px;max-width:64ch}\n.opts{display:flex;flex-direction:column;gap:7px;max-width:56ch}\n.opt{font:inherit;font-size:15px;text-align:left;background:#fff;border:1px solid var(--line);\n  padding:10px 13px;cursor:pointer;border-radius:2px}\n.opt:hover{border-color:var(--hema)}\n.opt.good{background:var(--ok-bg);border-color:var(--ok)}\n.opt.bad{background:var(--no-bg);border-color:var(--no)}\n.why{margin:12px 0 0;padding:12px 14px;background:#fff;border-left:3px solid var(--hema);\n  font-size:15px;max-width:62ch}\n\nnav.pager{border-top:1px solid var(--line);padding:20px 0 60px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n[hidden]{display:none!important}\n@media (max-width:820px){\n  .split{grid-template-columns:1fr;gap:22px}\n  .cols{grid-template-columns:1fr}\n  .col{border-right:0;border-bottom:1px solid var(--line)}\n  .cycle{grid-template-columns:1fr 1fr}\n  .rowz{grid-template-columns:1fr;gap:6px}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\n.beyond{border-top:2px solid var(--hema);padding-top:18px;margin-top:48px}\n.beyond h2{font-size:1.5rem;margin:0 0 4px}\n.beyond .intro{font-size:15px;color:var(--ink2);max-width:66ch;margin:0 0 18px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:13px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:15.5px;max-width:60ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:2px}\nul.srcs a{font-size:14px}\na.src{display:inline-block;margin-top:8px;font-size:13px;color:var(--hema);\n  text-decoration:none;border-bottom:1px solid var(--line)}\na.src:hover{border-bottom-color:var(--hema)}\n@media (max-width:640px){ul.srcs li{grid-template-columns:1fr;gap:6px}}\n\n/* ================= NCC DPT brand ================= */\nbody,h1,h2,h3,.clock,.score,.depth,.num,.mark,.qbox .prompt,.stem,.rowname,.zname{\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\nh1,h2,h3{font-weight:700;letter-spacing:0}\nh1{color:var(--cardinal);font-size:30px}\nh2{color:var(--cardinal)}\n.beyond h2{color:var(--blue-dk)}\n.beyond{border-top:4px solid var(--blue-dk)}\n.depth{color:var(--cardinal);font-weight:700}\n.score{font-weight:700;color:var(--cardinal)}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap;max-width:1140px}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.topbar{background:#fff;border-bottom:1px solid var(--line)}\n.topbar b{color:var(--cardinal)}\n.topbar a{color:var(--blue-dk)}\n.head{border-bottom:3px solid var(--cardinal)}\n.head span{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}\nbutton.act,a.act{background:var(--cardinal);font-weight:700;border-radius:0}\nbutton.act:hover,a.act:hover{background:var(--cardinal-dk);color:#fff}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}\nbutton.ghost:hover{background:var(--eosin-pale);color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{background:var(--cardinal);color:#fff;font-weight:700}\n.tile,.opt,.chip{border-radius:0}\n.note b.h,.note b{color:var(--cardinal)}\na.src{color:var(--blue-dk);border-bottom-color:var(--blue)}\n.panel h2,.card h3{letter-spacing:0}\n/* ---- figures ---- */\nfigure{margin:26px 0 0;background:#fff;border:1px solid var(--line)}\n.figscroll{overflow-x:auto}\n.figscroll svg{min-width:560px}\n\nfigure svg{display:block;width:100%;height:auto}\nfigcaption{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;\n  color:var(--ink2);line-height:1.45}\nfigcaption .num{color:var(--cardinal);font-weight:700}\nfigcaption .src{display:block;margin-top:4px;font-size:11px;color:var(--muted)}\n.svgtxt{font-family:Calibri,Carlito,\"Segoe UI\",Arial,sans-serif}\n.figlead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);\n  margin:34px 0 0;font-weight:700}\n\ndetails.figdesc{border-top:1px solid var(--line);background:#FCFCFC}\ndetails.figdesc summary{cursor:pointer;padding:9px 14px;font-size:12px;color:var(--blue-dk);list-style:none}\ndetails.figdesc summary::-webkit-details-marker{display:none}\ndetails.figdesc summary::before{content:\"\\25B8  \"}\ndetails.figdesc[open] summary::before{content:\"\\25BE  \"}\ndetails.figdesc .body{padding:0 14px 14px;font-size:13px;color:var(--ink2);max-width:72ch}\ndetails.figdesc .body p{margin:0 0 9px}\ndetails.figdesc .body p:last-child{margin:0}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>&#183; Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 &#183; Foundational Movement Science III</span>\n</div></div>\n<div class=\"topbar\"><div class=\"wrap\">\n  <span><b>Module 4</b> · Nails, hair and glands</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>The parts you can see</h1>\n  <p class=\"lede\">Nails, hair and glands are the only pieces of the integument a patient shows you without undressing. They are also the fastest read you get on circulation, nutrition and autonomic function.</p>\n\n  <div class=\"tabs\" role=\"tablist\">\n    <button role=\"tab\" aria-selected=\"true\" data-tab=\"nails\">Nail unit</button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"glands\">Glands</button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"hair\">Hair</button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"signs\">Reading the signs</button>\n  </div>\n</div>\n\n<main class=\"wrap\">\n\n<!-- ============ NAILS ============ -->\n<div class=\"pane\" id=\"pane-nails\" role=\"tabpanel\">\n  <p class=\"task\">Sagittal section through a fingertip. Tap a term, then tap the number it belongs to.</p>\n  <div class=\"split\">\n    <div>\n      <figure style=\"margin-top:0\"><div class=\"figscroll\">\n      <svg viewBox=\"0 0 560 260\" class=\"svgtxt\" role=\"img\" aria-describedby=\"figdesc1\" aria-label=\"Sagittal section of a fingertip showing seven numbered nail structures\">\n        <!-- finger -->\n        <path d=\"M 26 62 H 360 Q 470 62 496 128 Q 470 194 360 194 H 26 Z\" fill=\"#FBE3D6\" stroke=\"#D9A88F\" stroke-width=\"1.5\"/>\n        <!-- distal phalanx -->\n        <path d=\"M 92 108 H 330 Q 402 108 418 133 Q 402 162 330 162 H 92 Q 78 135 92 108 Z\"\n              fill=\"#F5EEDD\" stroke=\"#CBBFA3\" stroke-width=\"1.3\"/>\n        <circle cx=\"140\" cy=\"126\" r=\"2\" fill=\"#D8CCAE\"/><circle cx=\"200\" cy=\"146\" r=\"2\" fill=\"#D8CCAE\"/>\n        <circle cx=\"270\" cy=\"122\" r=\"2\" fill=\"#D8CCAE\"/><circle cx=\"340\" cy=\"142\" r=\"2\" fill=\"#D8CCAE\"/>\n        <!-- nail bed -->\n        <path d=\"M 150 86 H 430 L 426 100 H 150 Z\" fill=\"#F3A8BC\" stroke=\"#D07E96\" stroke-width=\"1\"/>\n        <!-- matrix -->\n        <path d=\"M 124 82 h 44 v 18 h -44 q -8 -9 0 -18 z\" fill=\"#C2496B\" opacity=\".85\"/>\n        <!-- nail plate -->\n        <path d=\"M 146 68 H 442 L 472 80 L 424 86 H 146 Z\" fill=\"#EDE6F2\" stroke=\"#B9A9C4\" stroke-width=\"1.3\"/>\n        <!-- lunula -->\n        <path d=\"M 172 69 q 20 9 38 0 v 15 q -20 6 -38 0 z\" fill=\"#FCFAFD\" stroke=\"#CFC2D8\" stroke-width=\".9\"/>\n        <!-- proximal nail fold + cuticle -->\n        <path d=\"M 108 58 Q 146 54 176 68 L 150 78 Q 122 72 108 58 Z\" fill=\"#F7CBB8\" stroke=\"#D9A88F\" stroke-width=\"1.2\"/>\n        <path d=\"M 150 70 L 178 68\" stroke=\"#B98A72\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n        <!-- hyponychium -->\n        <path d=\"M 416 86 L 438 84 L 432 102 L 414 100 Z\" fill=\"#D97D95\" stroke=\"#B85E78\" stroke-width=\"1\"/>\n\n        <!-- leaders + numbers -->\n        <g stroke=\"#7A5A6D\" stroke-width=\"1\" fill=\"none\">\n          <path d=\"M 132 62 L 112 34\"/><path d=\"M 164 71 L 188 34\"/>\n          <path d=\"M 190 76 L 246 38\"/><path d=\"M 300 76 L 330 34\"/>\n          <path d=\"M 144 92 L 118 216\"/><path d=\"M 290 94 L 286 216\"/>\n          <path d=\"M 426 94 L 462 210\"/>\n        </g>\n        <g>\n          <circle cx=\"132\" cy=\"62\" r=\"3\" fill=\"#241528\"/><circle cx=\"164\" cy=\"71\" r=\"3\" fill=\"#241528\"/>\n          <circle cx=\"190\" cy=\"76\" r=\"3\" fill=\"#241528\"/><circle cx=\"300\" cy=\"76\" r=\"3\" fill=\"#241528\"/>\n          <circle cx=\"144\" cy=\"92\" r=\"3\" fill=\"#241528\"/><circle cx=\"290\" cy=\"94\" r=\"3\" fill=\"#241528\"/>\n          <circle cx=\"426\" cy=\"94\" r=\"3\" fill=\"#241528\"/>\n        </g>\n        <g font-family=\"Karla, sans-serif\" font-size=\"13\" text-anchor=\"middle\">\n          <circle cx=\"112\" cy=\"26\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"112\" y=\"31\">6</text>\n          <circle cx=\"188\" cy=\"26\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"188\" y=\"31\">3</text>\n          <circle cx=\"248\" cy=\"30\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"248\" y=\"35\">5</text>\n          <circle cx=\"332\" cy=\"26\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"332\" y=\"31\">1</text>\n          <circle cx=\"116\" cy=\"226\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"116\" y=\"231\">4</text>\n          <circle cx=\"286\" cy=\"226\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"286\" y=\"231\">2</text>\n          <circle cx=\"464\" cy=\"220\" r=\"13\" fill=\"#fff\" stroke=\"#241528\" stroke-width=\"1.5\"/><text x=\"464\" y=\"225\">7</text>\n        </g>\n      </svg>\n      </div>\n      <figcaption><span class=\"num\">Figure 1.</span> Sagittal section through a fingertip. Distal is to the right. The nail plate is produced by the matrix beneath the proximal nail fold; the lunula is the part of that matrix visible through the plate.<span class=\"src\">Schematic; not to scale. Prepared for DPTD 733.</span></figcaption>\n<details class=\"figdesc\"><summary>Text description of Figure 1</summary><div class=\"body\" id=\"figdesc1\"><p>A sagittal section through a fingertip, drawn in profile with the distal tip pointing to the right. The finger is shown as a rounded skin-coloured outline containing the pale distal phalanx bone. Seven structures are marked with numbered callouts connected by leader lines.</p><p>Callout 1 points to the nail plate, the pale hard layer lying along the top of the finger and projecting past its tip as a free edge.</p><p>Callout 2 points to the nail bed, the pink vascular layer directly beneath the plate, running most of the length of the nail.</p><p>Callout 3 points to the cuticle, or eponychium, the thin band of tissue where the proximal fold meets and seals against the top of the plate.</p><p>Callout 4 points to the nail matrix, a dark red block tucked beneath the proximal nail fold at the base of the nail — the germinal zone that manufactures the plate.</p><p>Callout 5 points to the lunula, a pale crescent visible through the plate just distal to the fold. It is the part of the matrix you can see.</p><p>Callout 6 points to the proximal nail fold, the flap of skin overlying the base of the plate.</p><p>Callout 7 points to the hyponychium, the wedge of tissue under the free edge at the distal end, which seals the space beneath the plate.</p><p>The relationship worth reading from the figure is that the matrix and the lunula are the same tissue seen two ways, and that the cuticle at the base and the hyponychium at the tip are two seals guarding the same subungual space.</p></div></details>\n      </figure>\n    </div>\n\n    <div>\n      <div class=\"bank\" data-bank=\"nail\"></div>\n      <div class=\"slots\" data-zones=\"nail\">\n        <div class=\"slot\" data-zone=\"1\"><span class=\"num\">1</span><span class=\"drops\"></span></div>\n        <div class=\"slot\" data-zone=\"2\"><span class=\"num\">2</span><span class=\"drops\"></span></div>\n        <div class=\"slot\" data-zone=\"3\"><span class=\"num\">3</span><span class=\"drops\"></span></div>\n        <div class=\"slot\" data-zone=\"4\"><span class=\"num\">4</span><span class=\"drops\"></span></div>\n        <div class=\"slot\" data-zone=\"5\"><span class=\"num\">5</span><span class=\"drops\"></span></div>\n        <div class=\"slot\" data-zone=\"6\"><span class=\"num\">6</span><span class=\"drops\"></span></div>\n        <div class=\"slot\" data-zone=\"7\"><span class=\"num\">7</span><span class=\"drops\"></span></div>\n      </div>\n      <div class=\"actions\">\n        <button class=\"act\" data-check=\"nail\">Check labels</button>\n        <button class=\"act ghost\" data-reset=\"nail\">Start over</button>\n        <span class=\"result\" data-result=\"nail\"></span>\n      </div>\n    </div>\n  </div>\n  <div class=\"note\" data-note=\"nail\" hidden></div>\n</div>\n\n<!-- ============ GLANDS ============ -->\n<div class=\"pane\" id=\"pane-glands\" role=\"tabpanel\" hidden>\n  <p class=\"task\">Tap a feature, then tap the gland it describes. All three are exocrine glands of the dermis, and two of the three are innervated by sympathetic fibres.</p>\n  <div class=\"bank\" data-bank=\"gland\"></div>\n  <div class=\"cols\" data-zones=\"gland\">\n    <div class=\"col\" data-zone=\"ecc\"><h3>Eccrine</h3><p class=\"sub\">sweat gland</p><div class=\"drops\"></div></div>\n    <div class=\"col\" data-zone=\"apo\"><h3>Apocrine</h3><p class=\"sub\">sweat gland</p><div class=\"drops\"></div></div>\n    <div class=\"col\" data-zone=\"seb\"><h3>Sebaceous</h3><p class=\"sub\">oil gland</p><div class=\"drops\"></div></div>\n  </div>\n  <div class=\"actions\">\n    <button class=\"act\" data-check=\"gland\">Check my answers</button>\n    <button class=\"act ghost\" data-reset=\"gland\">Start over</button>\n    <span class=\"result\" data-result=\"gland\"></span>\n  </div>\n  <div class=\"note\" data-note=\"gland\" hidden></div>\n</div>\n\n<!-- ============ HAIR ============ -->\n<div class=\"pane\" id=\"pane-hair\" role=\"tabpanel\" hidden>\n  <p class=\"task\">At any moment most of your scalp hair is in anagen and a small fraction is in telogen. Illness, surgery, severe stress or rapid weight loss can push an abnormal share of follicles into telogen at once — which is why hair sheds two to three months <i>after</i> the event, not during it.</p>\n  <div class=\"cycle\">\n    <div class=\"phase\"><div class=\"bar\"><i style=\"width:88%\"></i></div><h3>Anagen</h3><p class=\"len\">Growing · years</p><p>Active mitosis in the hair matrix. Length is determined by how long a follicle stays here.</p></div>\n    <div class=\"phase\"><div class=\"bar\"><i style=\"width:6%\"></i></div><h3>Catagen</h3><p class=\"len\">Transition · weeks</p><p>Growth stops and the follicle regresses away from its blood supply.</p></div>\n    <div class=\"phase\"><div class=\"bar\"><i style=\"width:22%\"></i></div><h3>Telogen</h3><p class=\"len\">Resting · months</p><p>The follicle is dormant, the hair still anchored but no longer growing.</p></div>\n    <div class=\"phase\"><div class=\"bar\"><i style=\"width:4%\"></i></div><h3>Exogen</h3><p class=\"len\">Shedding</p><p>The old shaft releases as a new anagen hair pushes up beneath it.</p></div>\n  </div>\n\n    <p class=\"figlead\">Reference figure</p>\n    <figure>\n      <div class=\"figscroll\">\n      <svg viewBox=\"0 0 660 390\" class=\"svgtxt\" role=\"img\" aria-describedby=\"figdesc2\"\n           aria-label=\"Diagram of the pilosebaceous unit with an inset of the hair shaft in cross-section\">\n        <rect x=\"60\" y=\"46\" width=\"300\" height=\"14\" fill=\"#F3E4CE\" stroke=\"#B07C8C\"/>\n        <rect x=\"60\" y=\"60\" width=\"300\" height=\"32\" fill=\"#E7AFBD\" stroke=\"#B07C8C\"/>\n        <rect x=\"60\" y=\"92\" width=\"300\" height=\"210\" fill=\"#F6D3DA\" stroke=\"#B07C8C\"/>\n        <rect x=\"60\" y=\"302\" width=\"300\" height=\"56\" fill=\"#F8E8C2\" stroke=\"#B07C8C\"/>\n        <path d=\"M60 92 H360\" stroke=\"#8E0C21\" stroke-width=\"2\" fill=\"none\"/>\n        <g stroke=\"#DE93A5\" stroke-width=\"1.3\" fill=\"none\" opacity=\".8\">\n          <path d=\"M74 250 q14 -6 30 0\"/><path d=\"M250 240 q14 6 30 0\"/><path d=\"M84 286 q14 6 30 0\"/>\n          <path d=\"M262 286 q14 -6 30 0\"/><path d=\"M230 200 q14 -6 30 0\"/>\n        </g>\n        <g fill=\"#FDF6E2\" stroke=\"#E0C689\" stroke-width=\"1.1\">\n          <circle cx=\"88\" cy=\"326\" r=\"11\"/><circle cx=\"116\" cy=\"344\" r=\"11\"/>\n          <circle cx=\"280\" cy=\"326\" r=\"11\"/><circle cx=\"308\" cy=\"344\" r=\"11\"/>\n        </g>\n        <!-- follicle -->\n        <path d=\"M156 46 L152 276 a22 24 0 0 0 44 0 L192 46 Z\" fill=\"#F6DDE4\" stroke=\"#B5788C\" stroke-width=\"1.4\"/>\n        <path d=\"M163 60 L160 268\" fill=\"none\" stroke=\"#D3A0B0\" stroke-width=\"1.2\"/>\n        <path d=\"M185 60 L188 268\" fill=\"none\" stroke=\"#D3A0B0\" stroke-width=\"1.2\"/>\n        <path d=\"M152 276 a22 24 0 0 0 44 0 a22 24 0 0 0 -44 0\" fill=\"#E7A8BA\" stroke=\"#B5788C\" stroke-width=\"1.3\"/>\n        <path d=\"M163 292 q11 -16 22 0\" fill=\"#C8102E\" opacity=\".5\"/>\n        <path d=\"M174 282 L174 36 L206 8\" fill=\"none\" stroke=\"#6B4A38\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n        <!-- sebaceous gland -->\n        <g fill=\"#FBEDC9\" stroke=\"#D9B25E\" stroke-width=\"1.2\">\n          <circle cx=\"216\" cy=\"124\" r=\"15\"/><circle cx=\"234\" cy=\"140\" r=\"12\"/><circle cx=\"212\" cy=\"150\" r=\"10\"/>\n        </g>\n        <path d=\"M203 132 L192 126\" stroke=\"#D9B25E\" stroke-width=\"4\"/>\n        <!-- arrector pili -->\n        <path d=\"M154 186 L108 118\" stroke=\"#C4869A\" stroke-width=\"7\" stroke-linecap=\"round\" opacity=\".85\"/>\n        <!-- inset: shaft cross-section -->\n        <circle cx=\"560\" cy=\"300\" r=\"46\" fill=\"#F6E7DC\" stroke=\"#6B4A38\" stroke-width=\"1.6\"/>\n        <circle cx=\"560\" cy=\"300\" r=\"30\" fill=\"#E2C4AE\" stroke=\"#6B4A38\" stroke-width=\"1.4\"/>\n        <circle cx=\"560\" cy=\"300\" r=\"13\" fill=\"#B99075\" stroke=\"#6B4A38\" stroke-width=\"1.4\"/>\n        <g font-size=\"11\" fill=\"#333\">\n          <path d=\"M560 287 L512 250 H500\" fill=\"none\" stroke=\"#8A8A8A\"/><text x=\"496\" y=\"248\" text-anchor=\"end\">Medulla</text>\n          <path d=\"M560 275 L612 244 H624\" fill=\"none\" stroke=\"#8A8A8A\"/><text x=\"628\" y=\"242\">Cortex</text>\n          <path d=\"M560 255 L618 300 H628\" fill=\"none\" stroke=\"#8A8A8A\"/><text x=\"632\" y=\"304\">Cuticle</text>\n        </g>\n        <text x=\"560\" y=\"368\" font-size=\"11.5\" fill=\"#666\" text-anchor=\"middle\">Hair shaft in cross-section</text>\n        <!-- labels -->\n        <g font-size=\"12.5\" fill=\"#333\">\n          <path d=\"M 200 16 L 300 26 L 312 26\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"200\" cy=\"16\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"318\" y=\"30\">Hair shaft</text>\n          <path d=\"M 360 53 L 392 60 L 404 60\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"360\" cy=\"53\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"410\" y=\"64\">Epidermis</text>\n          <path d=\"M 240 140 L 300 110 L 312 110\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"240\" cy=\"140\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"318\" y=\"114\">Sebaceous gland</text>\n          <path d=\"M 120 132 L 96 150 L 84 150\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"120\" cy=\"132\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"78\" y=\"154\" text-anchor=\"end\">Arrector</text>\n          <text x=\"78\" y=\"168\" text-anchor=\"end\">pili muscle</text>\n          <path d=\"M 190 200 L 300 164 L 312 164\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"190\" cy=\"200\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"318\" y=\"168\">Outer root sheath</text>\n          <path d=\"M 178 214 L 300 192 L 312 192\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"178\" cy=\"214\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"318\" y=\"196\">Inner root sheath</text>\n          <path d=\"M 196 286 L 300 236 L 312 236\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"196\" cy=\"286\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"318\" y=\"240\">Hair bulb (matrix)</text>\n          <path d=\"M 174 290 L 300 264 L 312 264\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"174\" cy=\"290\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"318\" y=\"268\">Dermal papilla</text>\n          <path d=\"M 360 200 L 392 140 L 404 140\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"360\" cy=\"200\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"410\" y=\"144\">Dermis</text>\n          <path d=\"M 360 330 L 392 320 L 404 320\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"360\" cy=\"330\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"410\" y=\"324\">Hypodermis</text>\n        </g>\n      </svg>\n      </div>\n      <figcaption><span class=\"num\">Figure 2.</span> The pilosebaceous unit: hair follicle, sebaceous gland and arrector pili muscle. The follicle is an invagination of the epidermis into the dermis, so its lining holds keratinocytes — which is why a partial-thickness wound can re-epithelialize from surviving follicles across the whole wound bed rather than only from its edges. Inset: the three layers of the hair shaft.\n        <span class=\"src\">Schematic; not to scale. Prepared for DPTD 733.</span></figcaption>\n<details class=\"figdesc\"><summary>Text description of Figure 2</summary><div class=\"body\" id=\"figdesc2\"><p>A cross-section of skin showing a single hair follicle in full, with the surface at the top. Thin bands at the top represent the stratum corneum and the living epidermis, separated from a deep pink dermis by a heavy dark red basement membrane line. A yellow hypodermis containing round fat cells lies at the bottom.</p><p>The follicle runs from the skin surface down through most of the dermis as a pale tube with two internal lines marking the outer and inner root sheaths. At its base it widens into a rounded hair bulb, and inside the bulb a red curved shape marks the dermal papilla, which carries the blood supply and nerve endings.</p><p>The hair shaft is drawn as a dark brown line running up the centre of the follicle, emerging at the surface and angling away above the skin.</p><p>A sebaceous gland is drawn as three overlapping pale yellow lobules in the upper dermis to the right of the follicle, connected to it by a short duct. Together with the follicle and the shaft it forms the pilosebaceous unit.</p><p>The arrector pili muscle is a thick pink band running diagonally upward and to the left from the mid-follicle to the papillary dermis just below the epidermis.</p><p>An inset at the lower right shows the hair shaft in cross-section as three concentric circles, labelled from the centre outward: medulla, cortex and cuticle.</p><p>Labels with leader lines identify the hair shaft, epidermis, sebaceous gland, arrector pili muscle, outer and inner root sheaths, hair bulb or matrix, dermal papilla, dermis and hypodermis.</p></div></details>\n    </figure>\n\n  <div id=\"hairQuiz\"></div>\n</div>\n\n<!-- ============ SIGNS ============ -->\n<div class=\"pane\" id=\"pane-signs\" role=\"tabpanel\" hidden>\n  <p class=\"task\">None of these findings is diagnostic on its own. They are prompts to look further, ask another question, or pick up the phone. Tap an interpretation, then tap the finding it goes with.</p>\n  <div class=\"bank\" data-bank=\"signs\"></div>\n  <div class=\"rows\" data-zones=\"signs\">\n    <div class=\"rowz\" data-zone=\"club\"><span class=\"lbl\">Nail clubbing<em>softened bed, increased nail curvature</em></span><span class=\"drops\"></span></div>\n    <div class=\"rowz\" data-zone=\"beau\"><span class=\"lbl\">Beau's lines<em>transverse ridges across the nail</em></span><span class=\"drops\"></span></div>\n    <div class=\"rowz\" data-zone=\"koil\"><span class=\"lbl\">Koilonychia<em>concave, spoon-shaped nails</em></span><span class=\"drops\"></span></div>\n    <div class=\"rowz\" data-zone=\"pit\"><span class=\"lbl\">Nail pitting<em>small surface depressions</em></span><span class=\"drops\"></span></div>\n    <div class=\"rowz\" data-zone=\"onyc\"><span class=\"lbl\">Onycholysis<em>nail separating from the bed, tip inward</em></span><span class=\"drops\"></span></div>\n    <div class=\"rowz\" data-zone=\"hair\"><span class=\"lbl\">Hair loss over the distal lower leg<em>with cool, shiny, thin skin</em></span><span class=\"drops\"></span></div>\n    <div class=\"rowz\" data-zone=\"anhid\"><span class=\"lbl\">Anhidrosis of the feet<em>dry, fissured plantar skin</em></span><span class=\"drops\"></span></div>\n  </div>\n  <div class=\"actions\">\n    <button class=\"act\" data-check=\"signs\">Check my answers</button>\n    <button class=\"act ghost\" data-reset=\"signs\">Start over</button>\n    <span class=\"result\" data-result=\"signs\"></span>\n  </div>\n  <div class=\"note\" data-note=\"signs\" hidden></div>\n</div>\n\n</main>\n\n\n<section class=\"wrap beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">The nail unit, the glands and the hair cycle are all in your handout. The clinical interpretations attached to them mostly are not.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">The nail unit in full, including the matrix and why damage there is permanent<em>Behind the nail labelling exercise and its closing note</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK534769/\" target=\"_blank\" rel=\"noopener\">Anatomy, Nails (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Histology of sweat glands, sebaceous glands and hair follicles<em>Behind the gland sorting exercise</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK482237/\" target=\"_blank\" rel=\"noopener\">Histology, Skin Appendages (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Telogen effluvium: why shedding follows the stressor by two to three months<em>Behind the first hair question</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK430848/\" target=\"_blank\" rel=\"noopener\">Telogen Effluvium (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Anhidrosis, plantar fissures and how a diabetic foot ulcer starts<em>Behind the gland exercise note and the anhidrosis finding</em></span><a href=\"https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-01-Practical-Guidelines.pdf\" target=\"_blank\" rel=\"noopener\">IWGDF Practical Guidelines (PDF) &#8599;</a></li>\n    <li><span class=\"claim\">Peripheral arterial disease, ABI and what it means for exercise prescription<em>Behind the distal hair loss finding</em></span><a href=\"https://iwgdfguidelines.org/guidelines-2023/\" target=\"_blank\" rel=\"noopener\">IWGDF Guidelines (2023 update) &#8599;</a></li>\n  </ul>\n</section>\n\n<nav class=\"wrap pager\">\n  <a href=\"sensation.html\">← Receptors and depth</a>\n  <a href=\"physiology.html\">Next: What the skin does →</a>\n</nav>\n\n<script>\n/* ---------- tabs ---------- */\nconst panes={nails:'pane-nails',glands:'pane-glands',hair:'pane-hair',signs:'pane-signs'};\ndocument.querySelectorAll('.tabs button').forEach(b=>{\n  b.onclick=()=>{\n    document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));\n    for(const k in panes) document.getElementById(panes[k]).hidden = (k!==b.dataset.tab);\n  };\n});\n\n/* ---------- generic sorter ---------- */\nconst clearFns=[];\nfunction makeSorter(key, items, noteHtml){\n  const bank=document.querySelector(`[data-bank=\"${key}\"]`);\n  const zoneWrap=document.querySelector(`[data-zones=\"${key}\"]`);\n  const zones=[...zoneWrap.querySelectorAll('[data-zone]')];\n  const resultEl=document.querySelector(`[data-result=\"${key}\"]`);\n  const noteEl=document.querySelector(`[data-note=\"${key}\"]`);\n  let placed={},picked=null,checked=false;\n\n  function shuffled(){return items.map((v,i)=>i).sort(()=>Math.random()-.5);}\n  let bankOrder=shuffled();\n\n  function draw(){\n    bank.innerHTML='';\n    zones.forEach(z=>z.querySelector('.drops').innerHTML='');\n    const render=i=>{\n      const it=items[i];\n      const b=document.createElement('button');\n      b.className='tile'; b.textContent=it.t;\n      if(checked&&placed[i]!=null) b.classList.add(placed[i]===it.z?'good':'bad');\n      if(picked===i) b.classList.add('picked');\n      b.onclick=e=>{\n        e.stopPropagation(); if(checked) return;\n        if(placed[i]!=null){placed[i]=null;picked=null;}\n        else picked = picked===i?null:i;\n        draw();\n      };\n      if(placed[i]==null) bank.appendChild(b);\n      else zoneWrap.querySelector(`[data-zone=\"${placed[i]}\"] .drops`).appendChild(b);\n    };\n    bankOrder.forEach(render);\n    zones.forEach(z=>{\n      z.classList.toggle('armed',picked!==null);\n      z.onclick=()=>{ if(checked||picked===null) return;\n        placed[picked]=z.dataset.zone; picked=null; draw(); };\n    });\n  }\n  function reset(){ placed={};picked=null;checked=false;bankOrder=shuffled();\n    resultEl.textContent='';noteEl.hidden=true;draw(); }\n  document.querySelector(`[data-check=\"${key}\"]`).onclick=()=>{\n    const missing=items.filter((it,i)=>placed[i]==null).length;\n    if(missing){ resultEl.textContent=`${missing} still unplaced.`; return; }\n    checked=true;picked=null;draw();\n    const n=items.filter((it,i)=>placed[i]===it.z).length;\n    resultEl.textContent=`${n} of ${items.length} correct.`;\n    noteEl.hidden=false; noteEl.innerHTML=noteHtml;\n  };\n  document.querySelector(`[data-reset=\"${key}\"]`).onclick=reset;\n  clearFns.push(()=>{ if(picked!==null&&!checked){picked=null;draw();} });\n  reset();\n}\ndocument.addEventListener('click',()=>clearFns.forEach(f=>f()));\n\n/* ---------- nail ---------- */\nmakeSorter('nail',[\n  {t:'Nail plate',z:'1'},\n  {t:'Nail bed',z:'2'},\n  {t:'Cuticle (eponychium)',z:'3'},\n  {t:'Nail matrix',z:'4'},\n  {t:'Lunula',z:'5'},\n  {t:'Proximal nail fold',z:'6'},\n  {t:'Hyponychium',z:'7'}\n], `<b class=\"h\">The two that get confused</b>\n  <p><b>Matrix</b> and <b>lunula</b> are the same tissue seen two ways. The matrix is the germinal zone under the proximal fold where the plate is actually manufactured; the lunula is the small crescent of that matrix you can see through the plate. Damage the matrix and the nail grows back deformed. Damage the bed and it does not.</p>\n  <p>The <b>hyponychium</b> at the free edge and the <b>cuticle</b> at the base are both seals. Both keep debris and bacteria out of the space under the plate, which is why aggressive cuticle trimming and onycholysis both raise infection risk.</p>\n  <p>The pink of a healthy plate is the vasculature of the <b>bed</b> showing through, which is what makes the nail a usable window on perfusion.</p><a class=\"src\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK534769/\" target=\"_blank\" rel=\"noopener\">Anatomy, Nails — StatPearls &#8599;</a>`);\n\n/* ---------- glands ---------- */\nmakeSorter('gland',[\n  {t:'Opens directly onto the skin surface through a pore',z:'ecc'},\n  {t:'Found almost everywhere, densest on palms, soles and forehead',z:'ecc'},\n  {t:'Watery secretion; the primary engine of thermoregulation',z:'ecc'},\n  {t:'Excretes small amounts of urea and ammonia',z:'ecc'},\n  {t:'Located mainly in the axilla and groin',z:'apo'},\n  {t:'Thick, protein-rich secretion that bacteria break down into odour',z:'apo'},\n  {t:'Becomes active at puberty',z:'apo'},\n  {t:'Produces sebum: triglycerides, cholesterol, proteins, inorganic salts',z:'seb'},\n  {t:'Forms the pilosebaceous unit with a hair follicle',z:'seb'},\n  {t:'Creates an acidic surface film that inhibits microorganisms',z:'seb'}\n], `<b class=\"h\">Why the distinction matters clinically</b>\n  <p>Eccrine glands are the cooling system, and they are under sympathetic cholinergic control. When autonomic neuropathy takes them out, the foot stops sweating — plantar skin dries, fissures, and gives bacteria a way in. That is the mechanism behind so many diabetic foot ulcers starting as a crack rather than a wound.</p>\n  <p>Sebaceous glands are absent from palms and soles, which is precisely why those surfaces depend so completely on eccrine sweat for surface moisture and have nothing to fall back on.</p>\n  <p>Apocrine glands matter least mechanically and most socially. Bromhidrosis is bacterial breakdown of apocrine secretion, not a hygiene failure.</p><a class=\"src\" href=\"https://iwgdfguidelines.org/guidelines-2023/\" target=\"_blank\" rel=\"noopener\">Diabetic foot and anhidrosis — IWGDF 2023 &#8599;</a>`);\n\n/* ---------- signs ---------- */\nmakeSorter('signs',[\n  {t:'Chronic hypoxia — consider lung, cardiovascular or liver disease',z:'club'},\n  {t:'A growth arrest line: severe systemic illness, zinc deficiency or prior chemotherapy',z:'beau'},\n  {t:'Iron-deficiency anaemia',z:'koil'},\n  {t:'Psoriasis or alopecia areata',z:'pit'},\n  {t:'Trauma, psoriasis or fungal infection',z:'onyc'},\n  {t:'Peripheral arterial disease — check pulses and ABI before exercise prescription',z:'hair'},\n  {t:'Autonomic involvement in peripheral neuropathy',z:'anhid'}\n], `<b class=\"h\">What to do with these</b>\n  <p>The two that should change your plan today are the last two. Hair loss with cool, shiny, thin distal skin points at arterial insufficiency, and that changes both your exercise prescription and your wound expectations — you do not aggressively load a limb that cannot perfuse the tissue you are stressing. Anhidrosis signals autonomic neuropathy, and it almost never travels alone: assume sensory loss too, and screen for it.</p>\n  <p>Beau's lines are a timeline. Nail grows roughly 3 mm a month, so the distance from the cuticle to the ridge estimates when the insult happened. That is occasionally the detail that makes a vague history concrete.</p>\n  <p>Clubbing is slow and easy to miss because patients do not mention it. Notice it, ask about breathlessness, and document.</p><a class=\"src\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK534769/\" target=\"_blank\" rel=\"noopener\">Anatomy, Nails — StatPearls &#8599;</a>`);\n\n/* ---------- hair quiz ---------- */\nconst HQ=[\n {stem:'A patient reports noticeable diffuse hair shedding. On history, she had major abdominal surgery and a prolonged ICU stay about ten weeks ago. Which phase explains the timing?',\n  opts:['Anagen — growth stopped during the illness',\n        'Catagen — the follicles regressed and shed immediately',\n        'Telogen — follicles pushed into rest during the illness are only now releasing their shafts',\n        'Exogen — the shafts were mechanically dislodged in bed'],a:2,\n  why:'A systemic stressor pushes an abnormally large share of follicles from anagen into telogen at once. Telogen lasts months, so shedding surfaces roughly two to three months after the event. It is usually self-limiting, and the reassurance is worth giving.<a class=\"src\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK430848/\" target=\"_blank\" rel=\"noopener\">Telogen Effluvium — StatPearls &#8599;</a>'},\n {stem:'Which structure within the hair follicle actually determines whether hair stands up in response to cold or a sympathetic surge?',\n  opts:['The hair matrix','The arrector pili muscle','The dermal papilla','The inner root sheath'],a:1,\n  why:'The arrector pili is smooth muscle running from the follicle to the papillary dermis, innervated by sympathetic fibres. Contraction tilts the shaft upright — piloerection. It is a useful reminder that skin has a motor output, not just sensory input.'},\n {stem:'From innermost to outermost, the three layers of the hair shaft are:',\n  opts:['Cuticle, cortex, medulla','Cortex, medulla, cuticle','Medulla, cortex, cuticle','Medulla, cuticle, cortex'],a:2,\n  why:'Medulla (the core, and not present in every hair), then cortex (the bulk of the shaft, carrying the pigment), then cuticle (overlapping cells forming the protective outer shell).'},\n {stem:'Where does a hair follicle originate, and why does that matter for wound healing?',\n  opts:['In the hypodermis; it supplies adipose to the wound bed',\n        'As an invagination of the epidermis into the dermis; its lining provides keratinocytes for re-epithelialization',\n        'In the papillary dermis; it supplies collagen to the wound bed',\n        'In the basement membrane; it anchors the graft'],a:1,\n  why:'Follicles are epidermal downgrowths, so their linings are stocked with keratinocytes. A partial-thickness wound re-epithelializes as islands spreading outward from surviving follicles and gland linings across the whole wound bed — far faster than edge-only advance. Destroy the appendages and you have removed that advantage.'}\n];\n(function(){\n  const c=document.getElementById('hairQuiz'); const ans=[];\n  function paint(){\n    c.innerHTML='';\n    HQ.forEach((q,i)=>{\n      const d=document.createElement('div'); d.className='q';\n      d.innerHTML=`<p class=\"stem\"><b>${i+1}.</b> ${q.stem}</p><div class=\"opts\"></div>`;\n      const box=d.querySelector('.opts');\n      q.opts.forEach((o,j)=>{\n        const b=document.createElement('button'); b.className='opt'; b.textContent=o;\n        if(ans[i]!==undefined){ b.disabled=true;\n          if(j===q.a) b.classList.add('good'); else if(j===ans[i]) b.classList.add('bad'); }\n        b.onclick=()=>{ if(ans[i]!==undefined) return; ans[i]=j; paint(); };\n        box.appendChild(b);\n      });\n      if(ans[i]!==undefined){\n        const w=document.createElement('p'); w.className='why'; w.innerHTML=q.why; d.appendChild(w);\n      }\n      c.appendChild(d);\n    });\n  }\n  paint();\n})();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "physiology": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>What the skin does — DPTD 733</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --red032:#EF3340; --card-pale:#FBEAED;\n  --blue:#4599C7; --blue-dk:#256C93; --blue-lt:#6DCFF6; --green:#1B5E20; --green-bg:#E8F1E9;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666; --line:#D9D9D9; --bg:#F5F5F5;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--ink2);\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}\nh1,h2,h3{font-weight:700;margin:0}\na{color:var(--blue-dk)}\n:focus-visible{outline:3px solid var(--blue-dk);outline-offset:2px}\n.wrap{max-width:1140px;margin:0 auto;padding:0 24px}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.modbar{background:#fff;border-bottom:1px solid var(--line)}\n.modbar .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;\n  padding:11px 24px;font-size:14px;color:var(--muted)}\n.modbar b{color:var(--cardinal)}\nh1{font-size:30px;color:var(--cardinal);margin:30px 0 6px}\n.lede{max-width:70ch;margin:0 0 26px}\nsection{padding-bottom:52px}\n.head{display:flex;gap:14px;align-items:baseline;border-bottom:3px solid var(--cardinal);\n  padding-bottom:8px;margin-bottom:10px}\n.head h2{font-size:22px;color:var(--cardinal)}\n.head span{font-size:11.5px;color:var(--mu
