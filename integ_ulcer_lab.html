.given-bar{max-width:560px;margin:0 auto}
.fan{display:block;width:100%;height:36px}
.fan path{fill:none;stroke:var(--rule);stroke-width:4;transition:stroke .4s}
.fan.lit path{stroke:var(--red)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.col{background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--rule);border-radius:6px;padding:10px 12px 12px}
.col h3{font-size:17px;margin-bottom:8px;color:var(--ink-soft)}
.col.solved h3{color:var(--ink)}
.col[data-strand="0"]{border-top-color:var(--strand-0)}
.col[data-strand="1"]{border-top-color:var(--strand-1)}
.col[data-strand="2"]{border-top-color:var(--strand-2)}
.col .cell{position:relative;padding-bottom:12px}
.col .cell:last-child{padding-bottom:0}
.col .cell:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:0;width:3px;height:12px;background:var(--rule);transform:translateX(-50%)}
.col .cell.conducting::after{background:var(--red)}
.bank.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid-lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}

/* explain + debrief */
.write-box{margin-top:6px;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:18px 20px;max-width:780px}
.explain{margin-top:30px}
.write-box h3{font-size:22px;margin-bottom:6px}
.write-box label{display:block;font-size:17px;margin-bottom:10px}
.write-box textarea{width:100%;min-height:130px;border:1px solid var(--ink-soft);border-radius:6px;padding:10px 12px;line-height:1.5;resize:vertical;background:#fff}
.write-box .err{color:var(--red-deep);font-size:14px;margin:6px 0 0}
.debrief{margin-top:30px}
.debrief > h3{font-size:26px;margin-bottom:14px}
.deb-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.deb-chain{list-style:none;margin:0;padding:0}
.deb-chain li{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:16px}
.deb-chain li:not(:last-child)::before{content:"";position:absolute;left:13px;top:24px;bottom:0;width:3px;background:var(--red)}
.deb-chain .dn{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-weight:600;display:grid;place-items:center;font-size:14px;position:relative;z-index:1}
.deb-chain strong{display:block;font-size:13px;color:var(--ink-soft);font-weight:600}
.deb-chain .dt{font-weight:600;margin:0}
.deb-chain .dnote{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.deb-strands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:6px 0 16px}
.deb-strand{border-top:5px solid var(--rule);background:var(--surface);padding:10px 12px}
.deb-strand h4{margin:0 0 8px;font-family:var(--display);font-size:17px}
.deb-strand .ds{margin:0 0 10px}
.deb-strand .ds strong{display:block;font-size:13px;color:var(--ink-soft)}
.deb-strand .ds p{margin:0;font-size:14.5px}
.deb-strand .ds .dnote{color:var(--ink-soft)}
.deb-given{background:var(--slate-wash);border-left:4px solid var(--slate);padding:10px 14px;margin:0 0 6px}
.deb-given strong{font-size:13px;color:var(--slate)}
.deb-given p{margin:0}
.deb-given .dnote{color:var(--ink-soft);font-size:15px}
.pt{background:var(--surface);border-left:4px solid var(--slate);border-radius:0 6px 6px 0;padding:12px 16px;max-width:52em}
.pt h4{font-family:var(--display);font-size:18px;margin:0 0 6px}
.pt p{margin:0 0 8px;color:var(--ink-soft);font-size:15px}
.pt p:last-child{margin-bottom:0}
.your-expl{margin-top:16px;border-left:4px solid var(--rule);padding:4px 0 4px 14px}
.your-expl strong{font-size:13px;color:var(--ink-soft)}
.your-expl p{margin:2px 0 0;white-space:pre-wrap}
.next-row{margin-top:24px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* selection toast (mobile) */
.toast{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;background:var(--ink);color:#fff;border-radius:8px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.toast button{background:none;border:1px solid #fff;color:#fff;border-radius:4px;padding:4px 10px}

/* summary */
.sum-head{display:flex;flex-wrap:wrap;gap:20px;align-items:end;justify-content:space-between;margin-bottom:20px}
.sum-head h2{font-size:36px}
.name-field label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.name-field input{border:1px solid var(--ink-soft);border-radius:4px;padding:8px 10px;width:260px;max-width:100%;background:#fff}
.sum-case{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--rule);padding:16px 20px;margin-bottom:16px;break-inside:avoid}
.sum-case.done{border-left-color:var(--red)}
.sum-case h3{font-size:22px}
.sum-meta{font-size:14px;color:var(--ink-soft);margin:2px 0 10px}
.sum-chain{margin:0 0 10px;padding-left:1.4em}
.sum-chain li{margin-bottom:2px}
.sum-chain li span{color:var(--ink-soft);font-size:14px}
.sum-q{font-weight:600;margin:10px 0 2px}
.sum-a{margin:0;white-space:pre-wrap}
.muted{color:var(--ink-soft)}
.print-note{font-size:14px;color:var(--ink-soft);margin:6px 0 0}
.print-only{display:none}

@media (max-width:900px){
  .intro-grid,.work,.deb-grid,.grid-lower{grid-template-columns:1fr}
  .side{position:static}
  .cols,.deb-strands{grid-template-columns:1fr}
  .case-head{grid-template-columns:1fr}
  .case-head h2,.sum-head h2{font-size:30px}
  .toast.show{display:flex}
}
@media (max-width:560px){
  main{padding:18px 14px 96px}
  .top h1{font-size:25px}
  .lede{font-size:18px}
  .vignette{font-size:16.5px;padding:14px 16px}
  .case-row{grid-template-columns:34px 1fr}
  .case-row .btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  body{background:#fff;font-size:12pt}
  .tabs,.btn,.no-print,.toast,.print-note{display:none!important}
  .top{border-bottom:0}
  .top-inner{padding:0 0 8px;max-width:none}
  :focus,:focus-visible{outline:none!important}
  main{padding:0;max-width:none}
  .print-only{display:block}
  .name-field input{border:0;border-bottom:1px solid #000;border-radius:0;padding-left:0}
  .sum-case{border:1px solid #999;border-left:4px solid #000}
}

/* solve reveal: spine conducts top to bottom */
.kicker{font-size:15px;color:var(--ink-soft);margin:0 0 2px}
.animating .rail i{transform:scaleY(0)!important}
.col .cell::after{transition:background .35s;transition-delay:var(--d,0s)}
.fan path{transition-delay:var(--d,0s)}
.animating .cell::after{background:var(--rule)!important}
.animating .fan path{stroke:var(--rule)!important}
.deb-given .dt{margin:0}
.pt + .your-expl{margin-top:16px}
@media (max-width:900px){.fan{height:18px}}
.col .cell:has(.slot-filled)::after{left:calc(50% - 23px)}

/* =================== version 2 additions =================== */
.tab-save{margin-left:auto;color:var(--slate);font-weight:600}
.sub-h{font-size:21px;margin:0 0 10px}
.small{font-size:14px}
.notice{background:var(--slate-wash);border-left:4px solid var(--slate);padding:10px 14px;margin:0 0 18px;max-width:52em}
textarea[readonly]{background:var(--paper);color:var(--ink-soft)}

/* stage stepper: the case's sequence */
.stepper{margin:0 0 18px;scroll-margin-top:64px}
.stepper ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0}
.stepper li{display:flex;align-items:center}
.stepper li:not(:last-child)::after{content:"";width:22px;height:3px;background:var(--rule);margin:0 2px}
.step{position:relative;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px 6px 4px;border-radius:20px;color:var(--ink-soft);font-size:15px}
.step .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--rule);font-family:var(--display);font-weight:600;font-size:15px;background:var(--surface)}
.step.open .sn{border-color:var(--red);color:var(--red)}
.step.done .sn{background:var(--red);border-color:var(--red);color:#fff}
.step.done .sn svg{width:15px;height:15px}
.step.current{color:var(--ink);font-weight:700;background:var(--surface);box-shadow:inset 0 0 0 2px var(--red)}
.step.locked{cursor:not-allowed;opacity:.7}
.step:not(:disabled):hover{color:var(--ink)}

.stage-panel{margin-top:6px}
.stage-title{font-size:28px;margin:0 0 6px}
.stage-lede{max-width:48em;margin:0 0 16px;color:var(--ink-soft)}
.stage-next{margin:28px 0 0;padding-top:18px;border-top:1px solid var(--rule)}
.vignette{margin-bottom:20px}

.count-big{font-size:18px;margin:0 0 6px}
.count-big b{font-family:var(--display);font-size:30px;color:var(--red);margin-right:2px}

/* radio options */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:15px;line-height:1.3}
.opt input{margin:0;accent-color:var(--slate);width:16px;height:16px;flex:0 0 16px}
.opt:hover{border-color:var(--ink-soft)}
.opt.on{border-color:var(--slate);box-shadow:inset 0 0 0 1px var(--slate);background:var(--slate-wash)}
.opt:has(input:disabled){cursor:default}
.opt.answer{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok);background:var(--ok-wash)}
.opt:has(input:focus-visible){outline:3px solid var(--slate);outline-offset:2px}
.opts.compact .opt{padding:6px 10px;font-size:14.5px}

/* what if */
.change-card{font-family:var(--display);font-size:22px;line-height:1.3;margin:4px 0 14px;padding:14px 18px;background:var(--ink);color:#fff;border-radius:6px;max-width:40em}
.wi-list{list-style:none;margin:0;padding:0;counter-reset:wi;display:grid;gap:12px;max-width:900px}
.wi-item{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:6px;padding:12px 16px}
.wi-item.right{border-left-color:var(--ok)}
.wi-item.wrong{border-left-color:var(--red)}
.wi-about{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.wi-ctx{font-weight:400}
.wi-q{display:block;font-size:17px;font-weight:600;margin-top:2px}
.wi-expl{margin:10px 0 0;font-size:15px}
.wi-expl .mark svg{vertical-align:-3px;margin-right:4px}
.mark.ok svg{color:var(--ok)}
.mark.no svg{color:var(--red)}
.score-line{font-size:18px;margin:16px 0 0}
.score-line b{font-family:var(--display);font-size:24px;color:var(--red)}

/* simulator */
.sim-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:28px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px}
.ctl{margin-bottom:14px}
.ctl legend{font-weight:600;font-size:15px}
.range-row{display:flex;align-items:center;gap:12px;margin-top:6px}
.range-row input{flex:1;accent-color:var(--red)}
.range-row output{font-variant-numeric:tabular-nums;min-width:110px;font-size:15px}
.sim-out{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.sim-out figure{margin:0}
.sim-out figcaption{font-size:14px;margin-top:6px;line-height:1.45}
.body{width:100%;max-width:150px;display:block}
.reg-full{fill:#2A8C8C}
.reg-part{fill:#9ACFCB}
.reg-dry{fill:#CFD4D9}
.lesion{stroke:var(--red);stroke-width:2;stroke-dasharray:4 3}
.lesion-t{font-size:11px;fill:var(--red-deep);font-family:var(--text);font-weight:700}
.sw-key{display:inline-block;width:11px;height:11px;border-radius:2px;flex:0 0 11px}
.sw-legend{list-style:none;margin:0 0 6px;padding:0}
.sw-legend li{display:flex;align-items:center;gap:6px}
.sw-key.full{background:#2A8C8C}.sw-key.part{background:#9ACFCB}.sw-key.dry{background:#CFD4D9}
.chart{width:100%;display:block}
.chart .strain{fill:var(--red-wash)}
.chart .strain-t{font-size:11px;fill:var(--red-deep);font-family:var(--text)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--ink-soft);font-family:var(--text)}
.chart .line{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .line.cur{stroke:var(--red)}
.chart .line.prev{stroke:#8A9199;stroke-width:2;stroke-dasharray:5 4}
.chart .line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
.chart .end{fill:var(--red)}
@keyframes draw{to{stroke-dashoffset:0}}
.chal-h{margin-top:26px}
.chals{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chal{background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--rule);border-radius:6px;padding:12px 14px}
.chal.done{border-top-color:var(--ok)}
.chal h4{font-family:var(--display);font-size:18px;margin:0 0 4px}
.chal p{margin:0 0 6px}
.chal .opts{flex-direction:column}
.goal-met{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.goal-met svg{color:var(--ok)}

/* intervene */
.iv-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.iv-targets{display:grid;gap:12px}
.iv-chain .iv-target:not(.iv-none){position:relative}
.iv-chain .iv-target:not(.iv-none):not(:nth-last-child(2))::after{content:"";position:absolute;left:24px;bottom:-12px;width:3px;height:12px;background:var(--red)}
.iv-target{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--red);border-radius:6px;padding:10px 14px}
.iv-target.iv-none{border-left-color:var(--ink-soft);border-style:dashed;border-left-style:solid;margin-top:10px;background:transparent}
.iv-target.drop-hover{outline:3px solid var(--red);outline-offset:2px}
.iv-head strong{display:block;font-size:14px;color:var(--ink-soft)}
.iv-head p{margin:0;font-weight:600;font-size:15px}
.iv-head p.iv-strand{font-weight:400;font-size:14px;color:var(--ink-soft)}
.iv-chips{display:grid;gap:8px;margin-top:10px}
.chip{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px}
.token{display:block;width:100%;text-align:left;background:#FFF9E8;border:1px solid #D9C48A;border-bottom-width:3px;border-radius:6px;padding:9px 12px;font-size:15px;line-height:1.35;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.token:hover{border-color:#A88C3A}
.token.selected{border-color:var(--red);border-width:2px 2px 3px;background:var(--red-wash)}
.iv-tray .bank .token{min-height:54px}
.chip.right,.chip.wrong{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 12px}
.chip.right{border-left:4px solid var(--ok)}
.chip.wrong{border-left:4px solid var(--red)}
.chip-t{display:flex;gap:8px;align-items:flex-start;margin:0;font-weight:600}
.chip.right .chip-t svg{color:var(--ok);flex:0 0 18px;margin-top:2px}
.chip.wrong .chip-t svg{color:var(--red);flex:0 0 18px;margin-top:2px}
.chip-x{margin:4px 0 0 26px;font-size:14.5px;color:var(--ink-soft)}
.chip-x b{color:var(--ink)}
.iv-place{margin-top:10px;width:100%;border:2px dashed var(--red);background:var(--red-wash);color:var(--red-deep);border-radius:6px;padding:8px 12px;text-align:left;font-size:15px}

/* debrief */
.deb-h{font-family:var(--display);font-size:20px;margin:0 0 8px}
.deb-compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;align-items:start}
.deb-compare > div:first-child .deb-h:not(:first-child){margin-top:22px}
.pred-quote{margin:0 0 12px;padding:12px 16px;background:var(--surface);border-left:4px solid var(--slate);white-space:pre-wrap}
.deb-compare .opts{flex-direction:column;align-items:stretch}
.deb-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start;margin-top:30px;padding-top:24px;border-top:1px solid var(--rule)}
.results{margin:0 0 20px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.results dt{font-weight:700}
.results dd{margin:0}
.revisit{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.revisit li{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--red);border-radius:0 6px 6px 0;padding:10px 14px}
.revisit q{display:block;font-weight:600;quotes:"\201C" "\201D"}
.revisit p{margin:4px 0 0;font-size:15px}
.revisit-all{border-left-color:var(--red)}
.deb-chain .dt,.deb-strand .dt,.deb-given .dt{font-weight:600;margin:0}

@media (max-width:1000px){
  .chals{grid-template-columns:1fr}
  .sim-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .iv-grid,.deb-compare,.deb-cols{grid-template-columns:1fr}
  .iv-tray{order:-1}
  .stepper li:not(:last-child)::after{width:10px}
  .step .sl{font-size:14px}
}
@media (max-width:560px){
  .sim-out{grid-template-columns:1fr}
  .sim-body{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
  .change-card{font-size:19px}
  .step{padding:4px 6px 4px 2px}
  .step:not(.current) .sl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}
@media print{
  .stepper,.tab-save{display:none!important}
}
@media (prefers-reduced-motion:reduce){
  .chart .line.draw{stroke-dasharray:none;stroke-dashoffset:0}
}

/* clinical connection: optional, secondary */
.deb-cols{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.clinical{margin-top:30px;padding:16px 18px;border:1px dashed var(--ink-soft);border-radius:8px;background:rgba(255,255,255,.5)}
.clinical-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.clinical-head .deb-h{margin:0}
.clinical-head p{margin:2px 0 0}
.clin-task{margin:16px 0 12px;max-width:48em}
.clinical .pt{margin-top:14px}
.clinical .iv-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:900px){.clinical .iv-grid{grid-template-columns:1fr}}
@media print{.clinical{display:none}}

/* readings beyond the handout */
.more-row{display:block;margin-top:6px}
.more-link{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--slate);font-size:14px;font-weight:600;text-decoration:none;line-height:1.3}
.more-link .more-t{text-decoration:underline;text-underline-offset:3px}
.more-link:hover .more-t{color:var(--ink)}
.more-link svg{flex:0 0 14px}
.more-tag{font-size:12px;font-weight:700;color:var(--slate);background:var(--slate-wash);border-radius:10px;padding:1px 8px}
.readings{margin-top:22px;max-width:52em}
.hint .readings{margin-top:10px}
.clinical .readings{margin-top:14px}
.readings-h{font-family:var(--display);font-size:18px;margin:0 0 4px}
.hint .readings-h{font-size:15px;color:var(--hint)}
.readings ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.readings li{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--slate);border-radius:0 6px 6px 0;padding:8px 12px}
.readings li a{display:inline-flex;gap:6px;align-items:baseline;font-weight:600;color:var(--slate);text-underline-offset:3px}
.readings li a svg{align-self:center;flex:0 0 14px}
.readings li a span{text-decoration:underline}
.readings-src{display:block;font-size:13px;color:var(--ink-soft)}
.readings-note{display:block;font-size:14.5px;margin-top:2px}
@media print{.more-tag{background:none;padding:0}}

/* =================== Normal to Wound additions =================== */
.sim-out{display:block}
.model-panel .sim-grid{grid-template-columns:minmax(0,.72fr) minmax(0,1.7fr)}
.fig.chart text,.fig.bars text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
@media (max-width:1000px){.model-panel .sim-grid{grid-template-columns:1fr}}
.placeholder{color:var(--ink-soft);border:2px dashed var(--rule);border-radius:8px;padding:28px;text-align:center;margin:0}
.model-panel{margin-top:24px}
.model-out.two{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.model-out figure{margin:0}
.fig{width:100%;display:block}
.fig.leg,.fig.vein,.fig.sole{max-width:190px}
.fig.section{max-width:220px}
.lock-note{font-weight:400;font-size:13px;color:var(--ink-soft);margin-left:4px}
.ctl.locked .opt{background:var(--paper)}
.opts.stack{flex-direction:column;align-items:stretch}
.q-legend{font-weight:600;font-size:16px;margin-bottom:2px}
.readout{margin:10px 0 0;display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:15px}
.readout dt{font-weight:700}
.readout dd{margin:0}
.loop{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;padding:8px 12px;border-radius:6px;font-size:15px}
.loop svg{flex:0 0 18px;margin-top:2px}
.loop.ok{background:var(--ok-wash);color:var(--ok)}
.loop.ok span{color:var(--ink)}
.loop.broken{background:var(--red-wash);color:var(--red)}
.loop.broken span{color:var(--ink)}

/* normal physiology cards */
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:4px 0 8px}
.point{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--ok);border-radius:6px;padding:12px 14px}
.point h4{font-family:var(--display);font-size:18px;margin:0 0 4px}
.point p{margin:0;font-size:15px}
.point .point-ref{margin-top:6px;font-size:13px;color:var(--ink-soft)}
.chals{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.chal .opts{flex-direction:column}

/* SVG vocabulary */
.svg-label{font:600 12px var(--text);fill:var(--ink)}
.svg-small{font:11px var(--text);fill:var(--ink-soft)}
.svg-alert{font:700 12px var(--text);fill:var(--red-deep)}
.svg-zone{font:11px var(--text);fill:var(--red-deep)}
.limb{fill:#F3EDE9;stroke:#C9BFB8;stroke-width:1.5}
.artery{fill:#C8102E}
.plaque{fill:#E9C46A}
.artery-line{fill:none;stroke:#C8102E;stroke-linecap:round}
.foot{stroke:#B9A9A0;stroke-width:1}
.ache{fill:rgba(200,16,46,.22);stroke:#C8102E;stroke-width:2;stroke-dasharray:4 3}
.ache-ring{fill:none;stroke:#C8102E;stroke-width:3}
.bar-ok{fill:var(--ok)}
.bar-bad{fill:var(--red)}
.bar-demand{fill:var(--slate)}
.demand-line{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.tick{stroke:var(--ink-soft)}
.zone-bad{fill:var(--red-wash)}
.marker-line{stroke:var(--ink-soft);stroke-dasharray:3 3}
.calf{fill:rgba(190,110,100,.3);stroke:#B07A70;stroke-width:1.5}
.calf.weak{fill:rgba(190,110,100,.12);stroke-dasharray:4 3}
.vein-tube{fill:#3F5F91}
.valve{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round}
.reflux{fill:none;stroke:#C8102E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filter-arrow{fill:none;stroke:#2B63A8;stroke-width:1.6;stroke-linecap:round}
.zone-deep{fill:rgba(106,74,152,.13)}
.zone-skin{fill:rgba(106,74,152,.22)}
.thresh{fill:none;stroke-width:2}
.thresh.deep{stroke:#6A4A98}
.thresh.skin{stroke:#3E2A5E;stroke-dasharray:6 3}
.thresh-h{stroke:var(--ink-soft);stroke-dasharray:4 3}
.cap-line{stroke:#2B63A8;stroke-width:1.5;stroke-dasharray:5 3}
.trace{stroke:var(--ink-soft);stroke-dasharray:2 3}
.pt-blanchable{fill:#E07B39;stroke:#fff;stroke-width:2}
.pt-deep{fill:#6A4A98;stroke:#fff;stroke-width:2}
.pt-full{fill:#3E1030;stroke:#fff;stroke-width:2}
.pt-callus{fill:#C9A66B;stroke:#fff;stroke-width:1.5}
.bone{fill:#D9D4CC;stroke:#B8B1A6}
.deep-tissue{fill:#D99A8E}
.fat{fill:#F2DB9A}
.x-skin{fill:#EDBFAE}
.dmg-deep{fill:rgba(92,52,130,.55)}
.dmg-skin-tint{fill:rgba(106,74,152,.45)}
.dmg-full{fill:rgba(62,16,48,.65)}
.crater{fill:#fff;stroke:#3E1030;stroke-width:1.5}
.hyperemia{fill:rgba(224,82,82,.45)}
.surface{stroke:var(--ink);stroke-width:3}
.load-arrow{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.toe{fill:#F1E3DA;stroke:#B9A9A0;stroke-width:1.5}
.claw{fill:none;stroke:#8C7B72;stroke-width:1.5}
.sole-outline{fill:#F1E3DA;stroke:#B9A9A0;stroke-width:1.5}
.fatpad{fill:rgba(233,196,106,.45);stroke:rgba(180,140,60,.5);stroke-dasharray:3 3}
.methead{stroke:#fff;stroke-width:2}
.callus{fill:none;stroke:#C9A66B;stroke-width:7;opacity:.9}
.bleed{fill:#7A1020}
.ulcer{fill:#4A0C18;stroke:#E9B949;stroke-width:2}
.fissure{fill:none;stroke:#8C5A4A;stroke-width:1.6;stroke-linecap:round}

/* debrief map */
.map{display:grid;gap:8px;margin:6px 0 10px}
.map-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.map-row span{padding:10px 14px;font-size:15px;position:relative}
.map-row span + span{border-left:1px solid var(--rule)}
.map-head{background:none;border:0}
.map-head span{font-family:var(--display);font-weight:600;font-size:16px;padding:0 14px 2px;border:0!important}
.m-normal{border-top:4px solid var(--ok)}
.m-break{border-top:4px solid var(--red)}
.m-see{border-top:4px solid var(--slate)}
.map-head span:nth-child(1){color:var(--ok)}
.map-head span:nth-child(2){color:var(--red-deep)}
.map-head span:nth-child(3){color:var(--slate)}

/* compare */
.tray-wrap{margin-bottom:16px}
.sort-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sort-col{background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--slate);border-radius:6px;padding:10px 12px;min-height:140px}
.sort-col h4{font-family:var(--display);font-size:17px;margin:0 0 8px}
.sort-col.drop-hover{outline:3px solid var(--red);outline-offset:2px}
.sort-col .token{font-size:14px}
.mystery .myst-text{margin:0 0 10px;font-size:16px}
.sum-list{margin:4px 0 0;padding-left:1.2em}
.sum-list li{margin-bottom:3px}

@media (max-width:1000px){
  .sort-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .model-out.two{grid-template-columns:150px minmax(0,1fr)}
}
@media (max-width:640px){
  .model-out.two{grid-template-columns:1fr}
  .fig.leg,.fig.vein,.fig.sole,.fig.section{margin:0 auto;max-width:180px}
  .map-row{grid-template-columns:1fr}
  .map-row span + span{border-left:0;border-top:1px solid var(--rule)}
  .map-head{display:none}
  .m-normal::before{content:"Normal: ";font-weight:700;color:var(--ok)}
  .m-break::before{content:"Breaks: ";font-weight:700;color:var(--red-deep)}
  .m-see::before{content:"You see: ";font-weight:700;color:var(--slate)}
  .sort-cols{grid-template-columns:1fr}
  .readout{grid-template-columns:1fr}
  .readout dd{margin-bottom:4px}
}
@media print{.model-panel,.chals,.sim-grid{display:none!important}}

/* =================== UI polish =================== */
.lock-banner{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;padding:8px 12px;background:var(--slate-wash);border-radius:6px;font-size:14px;color:var(--slate)}
.lock-banner svg{flex:0 0 14px;margin-top:3px}
.lock-tag{display:inline-flex;vertical-align:-2px;color:var(--ink-soft);margin-left:2px}
.ctl.locked legend{color:var(--ink-soft)}
.ctl.locked .opt.on{background:var(--paper);box-shadow:none;border-color:var(--rule);font-weight:600}
.muted-ctl legend{color:var(--ink-soft)}
.live-note{font-size:13.5px;color:var(--ink-soft);margin:4px 0 0}
/* segmented controls for short options */
.opts.seg{display:grid;gap:0;margin-top:6px}
.opts.seg .opt{justify-content:center;text-align:center;border-radius:0;margin-left:-1px;padding:7px 6px;font-size:14.5px}
.opts.seg .opt:first-child{border-radius:6px 0 0 6px;margin-left:0}
.opts.seg .opt:last-child{border-radius:0 6px 6px 0}
.opts.seg .opt input{position:absolute;opacity:0;pointer-events:none}
.opts.seg .opt.on{background:var(--slate);border-color:var(--slate);color:#fff;box-shadow:none;z-index:1;font-weight:600}
.ctl.locked .opts.seg .opt.on{background:var(--slate-wash);color:var(--slate);border-color:var(--slate)}
.opts.seg .opt:has(input:disabled):not(.on){color:#9AA1A8}
.opts.stack .opt{padding:7px 12px}
.sim-controls .ctl{margin-bottom:12px}
.opts.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
/* challenge feedback */
.chal .wi-expl.fb{background:var(--paper);border-radius:6px;padding:10px 12px;margin-top:10px}
.chal .wi-expl.fb p{margin:0 0 6px}
.chal .wi-expl.fb p:last-of-type{margin-bottom:0}
.see-model{margin-top:6px;font-size:14px}
.wi-expl.fb:focus{outline:none}
.wi-expl.fb:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.model-panel{scroll-margin-top:64px}
.model-panel:focus{outline:none}
.stage-progress{margin:24px 0 0;padding:12px 16px;border-top:1px solid var(--rule);color:var(--ink-soft)}
/* collapsible vignette */
div.vignette p{margin:0}
.vignette.clamped p{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.vig-toggle{font-size:14px;margin-top:4px}
/* sort board */
.sort-board{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,2fr);gap:18px;align-items:start}
.sort-board.submitted{grid-template-columns:1fr}
.sort-board .tray-wrap{position:sticky;top:64px;margin:0}
.sort-board .bank.wide{grid-template-columns:1fr;gap:8px}
.sort-board .bank .token{padding:7px 10px;font-size:14px;min-height:0}
.sort-board:not(.submitted) .sort-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){
  .sort-board{grid-template-columns:1fr}
  .sort-board .tray-wrap{position:static}
  .sort-board .bank.wide{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .opts.grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .sort-board:not(.submitted) .sort-cols{grid-template-columns:1fr}
}

.model-out.two{grid-template-columns:210px minmax(0,1fr)}
.fig.bars{max-width:430px}
.model-out .fig.chart{max-width:540px}
.fig.leg,.fig.vein,.fig.sole{max-width:210px}
.sort-board .tray-wrap .panel-title{margin-top:0}
@media (max-width:900px){.model-out.two{grid-template-columns:160px minmax(0,1fr)}}
@media (max-width:640px){.model-out.two{grid-template-columns:1fr}}
.opts .opt:has(input:disabled):hover{border-color:var(--rule)}
.opts.seg .opt:has(input:disabled){cursor:not-allowed}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>North Central College</b> Doctor of Physical Therapy</div>
    <h1 id="app-title">Mechanism Chain Builder</h1>
  </div>
</header>
<nav class="tabs" aria-label="Activity sections"><div class="tabs-inner" id="tabs"></div></nav>
<main id="app"></main>
<input type="file" id="loadfile" accept=".json,application/json" hidden>
<div class="toast" id="toast"><span>Feature selected. Choose a column to place it.</span><button type="button" data-action="cancel-select">Cancel</button></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  var A = window.ACTIVITY;
  var CASES = A.cases;
  var CMP = A.compare;
  var SAVE_APP = 'normal-to-wound';
  var SAVE_VERSION = 1;

  /* ---------------- helpers ---------------- */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function plural(n, word, pl) { return n === 1 ? word : (pl || word + 's'); }
  function words(t) { return String(t || '').trim().split(/\s+/).filter(Boolean).length; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function fmt(n, d) { return Number(n).toFixed(d == null ? 0 : d); }
  var CHECK_SVG = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CROSS_SVG = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
  var EXT_SVG = '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><path d="M11 3h6v6M17 3l-8 8M15 12v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ---------------- readings ---------------- */
  function reading(ci, key) { return (key && CASES[ci] && CASES[ci].readings && CASES[ci].readings[key]) || null; }
  function moreLink(ci, key) {
    var r = reading(ci, key);
    if (!r) return '';
    return '<span class="more-row"><a class="more-link" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="more-tag">Beyond the handout</span>' + EXT_SVG + '<span class="more-t">' + esc(r.title) + '</span><span class="sr-only"> (opens in a new tab)</span></a></span>';
  }
  function readingList(ci, heading, intro) {
    var rd = CASES[ci].readings || {}, keys = Object.keys(rd);
    if (!keys.length) return '';
    return '<div class="readings"><h4 class="readings-h">' + esc(heading) + '</h4>' + (intro ? '<p class="small muted">' + esc(intro) + '</p>' : '') + '<ul>' +
      keys.map(function (k) {
        var r = rd[k];
        return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + EXT_SVG + '<span>' + esc(r.title) + '</span><span class="sr-only"> (opens in a new tab)</span></a>' +
          '<span class="readings-src">' + esc(r.source) + '</span>' + (r.note ? '<span class="readings-note">' + esc(r.note) + '</span>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  /* =====================================================================
     PHYSIOLOGY MODELS
     Each model: controls, compute(ctrl) -> { cats, ... }, render(run, prev, animate)
     All numbers are simplified teaching values, not clinical thresholds.
     ===================================================================== */
  function opt(value, label) { return { value: String(value), label: label }; }
  function optLabel(ctl, value) {
    var o = (ctl.options || []).filter(function (x) { return x.value === String(value); })[0];
    return o ? o.label : String(value);
  }
  function svgText(x, y, text, cls, anchor) {
    return '<text x="' + x + '" y="' + y + '" class="' + (cls || 'svg-label') + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + esc(text) + '</text>';
  }

  var MODELS = {};

  /* ---------- Arterial: supply versus demand ---------- */
  MODELS.arterial = {
    note: 'Simplified teaching model. Flow is shown in relative units, where 1 equals the tissue\'s resting demand.',
    controls: [
      { id: 'stenosis', label: 'Artery narrowing', kind: 'radio', role: 'break', normal: '0',
        options: [opt(0, 'None'), opt(50, '50%'), opt(75, '75%'), opt(90, '90%')] },
      { id: 'activity', label: 'Activity', kind: 'radio', role: 'context', def: 'rest',
        options: [opt('rest', 'Resting'), opt('walk', 'Walking')] },
      { id: 'position', label: 'Leg position at rest', kind: 'radio', role: 'context', def: 'flat',
        options: [opt('elevated', 'Raised'), opt('flat', 'Lying flat'), opt('dependent', 'Hanging down')],
        disabledWhen: function (c) { return c.activity === 'walk'; }, disabledNote: 'Upright while walking' }
    ],
    compute: function (c) {
      var st = parseInt(c.stenosis, 10) || 0;
      var capacity = { 0: 4.0, 50: 3.4, 75: 1.6, 90: 0.8 }[st];
      var walking = c.activity === 'walk';
      var pos = walking ? 'upright' : c.position;
      var adj = { elevated: -0.35, flat: 0, dependent: 0.3, upright: 0.3 }[pos];
      var supply = Math.max(0.05, capacity + adj);
      var demand = walking ? 3.0 : 1.0;
      var ratio = supply / demand;
      var symptom = ratio >= 1 ? 'none' : (walking ? 'claudication' : 'rest-pain');
      var color = 'pink';
      if (!walking && c.position === 'dependent' && st >= 90) color = 'rubor';
      else if (!walking && ratio < 1) color = 'pale';
      else if (!walking && c.position === 'elevated' && st >= 75) color = 'pale';
      return {
        st: st, supply: supply, demand: demand, ratio: ratio, walking: walking, pos: pos,
        reserve: capacity >= 2 ? 'ample' : capacity >= 1.2 ? 'reduced' : 'insufficient',
        pulses: { 0: 'Strong', 50: 'Present', 75: 'Weak', 90: 'Weak or absent' }[st],
        temp: st >= 75 ? 'Cool' : 'Warm',
        cats: { symptom: symptom, color: color }
      };
    },
    labels: {
      symptom: { none: 'No ischemic pain', claudication: 'Calf pain while walking (claudication)', 'rest-pain': 'Pain in the forefoot and toes at rest' },
      color: { pink: 'Pink', pale: 'Pale (pallor)', rubor: 'Dusky red (dependent rubor)' }
    },
    render: function (r) {
      var L = this.labels;
      var foot = { pink: '#E9AFA5', pale: '#EFE6E0', rubor: '#A5465E' }[r.cats.color];
      var wn = 6 * (1 - 0.85 * r.st / 100);
      var leg = '<svg class="fig leg" viewBox="0 0 210 280" role="img" aria-label="' + esc('Leg diagram: artery ' + (r.st ? r.st + '% narrowed' : 'not narrowed') + '. ' + L.symptom[r.cats.symptom] + '. Foot color ' + L.color[r.cats.color] + '.') + '">' +
        svgText(100, 12, 'From the heart', 'svg-label', 'middle') +
        '<path d="M70 20 H130 V200 Q130 214 142 221 L188 239 Q199 246 191 257 H80 Q66 257 66 244 V200 Z" class="limb"/>' +
        (r.cats.symptom === 'claudication' ? '<ellipse cx="100" cy="150" rx="27" ry="38" class="ache"/>' + svgText(134, 150, 'Calf', 'svg-alert') : '') +
        '<rect x="94" y="20" width="12" height="70" class="artery"/>' +
        '<polygon points="94,90 ' + (100 - wn) + ',106 ' + (100 - wn) + ',114 94,130 106,130 ' + (100 + wn) + ',114 ' + (100 + wn) + ',106 106,90" class="artery"/>' +
        (r.st ? '<polygon points="94,90 ' + (100 - wn) + ',106 ' + (100 - wn) + ',114 94,130" class="plaque"/><polygon points="106,90 ' + (100 + wn) + ',106 ' + (100 + wn) + ',114 106,130" class="plaque"/>' + svgText(112, 112, r.st + '%', 'svg-small') : '') +
        '<rect x="94" y="130" width="12" height="80" class="artery" style="opacity:' + clamp(0.35 + r.ratio * 0.45, 0.35, 1) + '"/>' +
        '<path d="M80 222 L188 240 Q198 246 191 257 H80 Q67 257 67 244 Z" fill="' + foot + '" class="foot"/>' +
        '<path d="M100 210 Q112 232 176 246" class="artery-line" style="stroke-width:' + clamp(2 + r.ratio * 2.5, 2, 7) + '"/>' +
        (r.cats.symptom === 'rest-pain' ? '<circle cx="183" cy="249" r="11" class="ache-ring"/>' + svgText(150, 272, 'Toes', 'svg-alert', 'middle') : '') +
        '</svg>';
      var max = 4.5, W = 200, x0 = 112;
      function bw(v) { return Math.max(2, v / max * W); }
      var bars = '<svg class="fig bars" viewBox="0 0 350 140" role="img" aria-label="' + esc('Flow available ' + fmt(r.supply, 1) + ', tissue demand ' + fmt(r.demand, 1) + ' (relative units).') + '">' +
        svgText(0, 34, 'Flow available', 'svg-label') + '<rect x="' + x0 + '" y="20" height="22" width="' + bw(r.supply) + '" class="' + (r.ratio >= 1 ? 'bar-ok' : 'bar-bad') + '"/>' + svgText(x0 + bw(r.supply) + 6, 36, fmt(r.supply, 1), 'svg-small') +
        svgText(0, 82, 'Tissue demand', 'svg-label') + '<rect x="' + x0 + '" y="68" height="22" width="' + bw(r.demand) + '" class="bar-demand"/>' + svgText(x0 + bw(r.demand) + 6, 84, fmt(r.demand, 1), 'svg-small') +
        '<line x1="' + (x0 + bw(r.demand)) + '" x2="' + (x0 + bw(r.demand)) + '" y1="12" y2="98" class="demand-line"/>' +
        [0, 1, 2, 3, 4].map(function (v) { return '<line x1="' + (x0 + v / max * W) + '" x2="' + (x0 + v / max * W) + '" y1="100" y2="105" class="tick"/>' + svgText(x0 + v / max * W, 118, v, 'svg-small', 'middle'); }).join('') +
        svgText(x0, 136, '1 = resting demand', 'svg-small') + '</svg>';
      return '<div class="model-out two"><figure>' + leg + '</figure><div><figure>' + bars + '</figure>' +
        '<dl class="readout"><dt>Symptom</dt><dd>' + esc(L.symptom[r.cats.symptom]) + '</dd>' +
        '<dt>Skin</dt><dd>' + esc(L.color[r.cats.color]) + ', ' + esc(r.temp.toLowerCase()) + '</dd>' +
        '<dt>Pedal pulses</dt><dd>' + esc(r.pulses) + '</dd>' +
        '<dt>Reserve for healing</dt><dd>' + esc({ ample: 'Ample', reduced: 'Reduced', insufficient: 'Not enough even at rest' }[r.reserve]) + '</dd></dl></div></div>';
    }
  };

  /* ---------- Venous: ankle venous pressure ---------- */
  MODELS.venous = {

  /* =====================================================================

     ===================================================================== */

        (!CS.sortSubmitted && selected ? '<button type="button" class="iv-place" data-action="chip-target" data-target="' + col.id + '" data-key="ct-' + col.id + '">Place selected feature here</button>' : '') + '</div>';

        '<fieldset class="ctl"><legend class="q-legend">Which type of ulcer is this?</legend><div class="opts grid2">';
      CMP.typeOptions.forEach(function (o, k) {
        var on = CS.mType[i] === k, isAns = CS.mSubmitted && k === my.type;
        h += '<label class="opt' + (on ? ' on' : '') + (isAns ? ' answer' : '') + '"><input type="radio" name="mt-' + i + '" value="' + k + '" data-input="mtype" data-item="' + i + '" data-key="mt-' + i + '-' + k + '"' + (on ? ' checked' : '') + (CS.mSubmitted ? ' disabled' : '') + '><span>' + esc(o) + '</span></label>';
      });
      h += '</div></fieldset><fieldset class="ctl"><legend class="q-legend">' + esc(my.mechQuestion) + '</legend><div class="opts stack">';
      my.mechOptions.forEach(function (o, k) {
        var on = CS.mMech[i] === k, isAns = CS.mSubmitted && k === my.mechAnswer;
        h += '<label class="opt' + (on ? ' on' : '') + (isAns ? ' answer' : '') + '"><input type="radio" name="mm-' + i + '" value="' + k + '" data-input="mmech" data-item="' + i + '" data-key="mm-' + i + '-' + k + '"' + (on ? ' checked' : '') + (CS.mSubmitted ? ' disabled' : '') + '><span>' + esc(o) + '</span></label>';

          '<span class="mark ' + (mOk ? 'ok' : 'no') + '">' + (mOk ? CHECK_SVG + '<b>Mechanism correct.</b>' : CROSS_SVG + '<b>Mechanism:</b> ' + esc(my.mechOptions[my.mechAnswer]) + '.') + '</span> ' + esc(my.explanation) + '</p>';
      }
      h += '</li>';
    });
    h += '</ol>';
    if (!CS.mSubmitted) h += '<div class="actions"><button type="button" class="btn primary" data-action="mystery-submit" data-key="myst-submit"' + (allAnswered ? '' : ' disabled') + '>Submit answers</button><span class="status-line">Answer both questions for every patient.</span></div>';
    else {
      var ms = mysteryScores();
      h += '<p class="score-line" tabindex="-1" data-key="myst-score"><b>' + ms.type + ' of ' + CMP.mysteries.length + '</b> types and <b>' + ms.mech + ' of ' + CMP.mysteries.length + '</b> mechanisms correct.</p>';
    }
    h += '</section><div class="next-row"><button type="button" class="btn primary" data-action="nav" data-target="summary">View summary</button></div>';

  }
  function chipBtn(i) {

  /* =====================================================================
     SUMMARY
     ===================================================================== */
  function summaryHtml() {
    var today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    var done = CASES.filter(function (_, ci) { return caseStatus(ci) === 'complete'; }).length;

      '<p class="muted">' + done + ' of ' + CASES.length + ' cases complete. Compare ' + STATUS_TEXT[compareStatus()] + '. ' + esc(today) + '</p></div>' +

      '<p class="print-note">If no print dialog opens, press Ctrl+P on Windows or Cmd+P on a Mac.</p>';

      var n = scoreStage(ci, 'normal'), b = scoreStage(ci, 'break');
      h += '<p class="sum-meta">' + (st === 'complete' ? 'Complete.' : 'In progress.') + '</p><dl class="results">' +
        '<dt>Normal</dt><dd>' + n.right + ' of ' + n.total + ' correct' + (stageDone(ci, 'normal') ? '.' : ' so far.') + '</dd>' +
        '<dt>Break it</dt><dd>' + b.right + ' of ' + b.total + ' correct' + (stageDone(ci, 'break') ? '.' : ' so far.') + '</dd>' +
        (s.signs.submitted ? '<dt>Signs</dt><dd>' + signsScore(ci) + ' of ' + sc.signs.length + ' linked correctly.</dd>' : '') + '</dl>' +
        '<p class="sum-q">' + esc(sc.explainPrompt) + '</p><p class="sum-a">' + (s.explained ? esc(s.explanation) : '<span class="muted">No explanation saved.</span>') + '</p>';
      var rev = revisitCase(ci);
      if (rev.length) h += '<p class="sum-q">Worth revisiting</p><ul class="sum-list">' + rev.map(function (r) { return '<li><span class="muted">' + esc(r.kind) + ':</span> ' + esc(r.text) + '</li>'; }).join('') + '</ul>';
      h += '</section>';
    });
    h += '<section class="sum-case' + (compareStatus() === 'complete' ? ' done' : '') + '"><h3>Compare the ulcers</h3>';
    if (compareStatus() === 'none') h += '<p class="sum-meta">Not started.</p>';
    else {
      h += '<dl class="results">' + (CS.sortSubmitted ? '<dt>Sorting</dt><dd>' + sortScore() + ' of ' + CMP.chips.length + ' features correct.</dd>' : '<dt>Sorting</dt><dd>Not submitted.</dd>');
      if (CS.mSubmitted) { var ms = mysteryScores(); h += '<dt>Mystery patients</dt><dd>' + ms.type + ' of ' + CMP.mysteries.length + ' types and ' + ms.mech + ' of ' + CMP.mysteries.length + ' mechanisms correct.</dd>'; }
      else h += '<dt>Mystery patients</dt><dd>Not submitted.</dd>';
      h += '</dl>';
      var missed = [];
      if (CS.sortSubmitted) CMP.chips.forEach(function (c, i) { if (CS.placed['c' + i] !== c.column) missed.push('Feature: ' + c.text + ' (belongs with ' + columnLabel(c.column) + ')'); });
      if (CS.mSubmitted) CMP.mysteries.forEach(function (my, i) { if (CS.mType[i] !== my.type || CS.mMech[i] !== my.mechAnswer) missed.push('Patient ' + (i + 1) + ': ' + CMP.typeOptions[my.type]); });
      if (missed.length) h += '<p class="sum-q">Worth revisiting</p><ul class="sum-list">' + missed.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';

  /* =====================================================================
     RENDER LOOP
     ===================================================================== */
  function render() {
    elTabs.innerHTML = tabsHtml();
    elApp.innerHTML = view === 'intro' ? introHtml() : view === 'compare' ? compareHtml() : view === 'summary' ? summaryHtml() : caseHtml(view);
    animateRun = false;
    var showToast = selected !== null && view === 'compare';
    elToast.classList.toggle('show', showToast);
    if (showToast) elToast.querySelector('span').textContent = 'Feature selected. Choose a column to place it.';
    var curTab = elTabs.querySelector('[aria-current="page"]');
    if (curTab) {
      var l = curTab.offsetLeft, r = l + curTab.offsetWidth;
      if (l < elTabs.scrollLeft) elTabs.scrollLeft = l - 12;
      else if (r > elTabs.scrollLeft + elTabs.clientWidth) elTabs.scrollLeft = r - elTabs.clientWidth + 12;
    }
    if (focusKey) {
      var el = document.querySelector('[data-key="' + focusKey + '"]');
      if (el) el.focus();
      focusKey = null;
    }
  }
  function clearTransient() {
    selected = null; notice = '';
    S.forEach(function (s) { s.resetArmed = false; });
  }
  function go(target) {
    view = (target === 'intro' || target === 'summary' || target === 'compare') ? target : Number(target);
    clearTransient();
    focusKey = 'view-heading';
    render();
    window.scrollTo(0, 0);
  }
  function goStage(ci, st) {
    if (!stageUnlocked(ci, st)) return;
    var s = S[ci];
    s.stage = st;
    clearTransient();
    // entering Normal: show healthy settings; entering Break it: keep current settings
    if (st === 'normal') { s.run = null; s.prev = null; }
    focusKey = 'step-' + st;
    render();
    var stepper = document.querySelector('.stepper');
    if (stepper) stepper.scrollIntoView({ block: 'start' });
  }
  function runModel(ci) {
    var s = S[ci], m = modelOf(ci);
    var eff = effCtrl(ci, s.stage);
    var r = m.compute(eff);
    r.ctrl = eff;
    s.prev = s.run;
    s.run = r;
    animateRun = true;
    return r;
  }

  /* =====================================================================
     EVENTS
     ===================================================================== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;

    if (a === 'nav') return go(t.dataset.target);
    if (a === 'print') return window.print();
    if (a === 'save') return saveProgress();
    if (a === 'load') return document.getElementById('loadfile').click();
    if (a === 'cancel-select') { selected = null; announce('Selection canceled.'); return render(); }

    if (view === 'compare') return compareClick(a, t);
    if (typeof view !== 'number') return;
    var ci = view, s = S[ci], sc = CASES[ci];
    if (a !== 'reset') s.resetArmed = false;

    switch (a) {
      case 'stage': return goStage(ci, t.dataset.stage);
      case 'reset':
        if (!s.resetArmed) { s.resetArmed = true; focusKey = 'reset'; return render(); }
        S[ci] = freshCase(ci);
        announce('Case reset.');
        focusKey = 'view-heading';
        return render();
      case 'scroll-model': {
        var panel = document.querySelector('.model-panel');
        if (panel) { panel.scrollIntoView({ block: 'start', behavior: 'smooth' }); panel.focus({ preventScroll: true }); }
        return;
      }
      case 'vignette': {
        var vk = ci + '-' + s.stage;
        vigOpen[vk] = !vigOpen[vk];
        focusKey = 'vig-toggle';
        return render();
      }
      case 'challenge': {
        var i = Number(t.dataset.ch), ch = sc.challenges[i];
        if (!s.preds[i]) return;
        Object.keys(ch.preset).forEach(function (k) {
          var ctl = modelOf(ci).controls.filter(function (x) { return x.id === k; })[0];
          s.ctrl[k] = ctl && ctl.kind === 'range' ? Number(ch.preset[k]) : String(ch.preset[k]);
        });
        var res = runModel(ci);
        s.results[i] = { pred: s.preds[i], actual: res.cats[ch.measure] };
        announce((s.results[i].pred === s.results[i].actual ? 'Your prediction matched. ' : 'Not quite. ') + 'Model result and explanation shown below the challenge. The model above now shows these settings.');
        focusKey = 'fb-' + i;
        return render();
      }
      case 'question': {
        var qi = Number(t.dataset.ch);
        if (s.qAnswers[qi] === undefined) return;
        s.qDone[qi] = true;
        announce(s.qAnswers[qi] === sc.challenges[qi].answer ? 'Correct.' : 'Not quite. Explanation shown.');
        focusKey = 'fb-' + qi;
        return render();
      }
      case 'signs-submit':
        if (Object.keys(s.signs.answers).length < sc.signs.length) return;
        s.signs.submitted = true;
        announce(signsScore(ci) + ' of ' + sc.signs.length + ' findings linked correctly. Explanations shown. Now explain the wound in your own words.');
        focusKey = 'signs-score';
        return render();
      case 'explain-submit':
        if (words(s.explanation) < 5) { s.explainError = 'Write at least a sentence or two before saving.'; focusKey = 'expl'; return render(); }
        s.explainError = '';
        var first = !s.explained;
        s.explained = true;
        announce(first ? 'Explanation saved. The debrief is now open.' : 'Changes saved.');
        focusKey = first ? 'next-stage' : 'explain-submit';
        return render();
    }
  });

  function compareClick(a, t) {
    switch (a) {
      case 'chip': {
        if (CS.sortSubmitted) return;
        var id = t.dataset.chip;
        selected = selected === id ? null : id;
        announce(selected ? 'Selected: ' + CMP.chips[Number(id.slice(1))].text + '. Now choose a column.' : 'Feature deselected.');
        focusKey = (selected && window.innerWidth < 900) ? 'ct-' + CMP.columns[0].id : 'chip-' + id;
        return render();
      }
      case 'chip-target': {
        if (!selected) return;
        var chip = selected;
        CS.placed[chip] = t.dataset.target;
        selected = null;
        announce('Placed under ' + columnLabel(t.dataset.target) + '.');
        var nextChip = CMP.chips.map(function (_, i) { return 'c' + i; }).filter(function (x) { return !CS.placed[x]; })[0];
        focusKey = nextChip ? 'chip-' + nextChip : 'sort-submit';
        return render();
      }
      case 'chip-return':
        delete CS.placed[t.dataset.chip];
        if (selected === t.dataset.chip) selected = null;
        announce('Feature returned to the list.');
        focusKey = 'chip-' + t.dataset.chip;
        return render();
      case 'sort-submit':
        if (CMP.chips.some(function (_, i) { return !CS.placed['c' + i]; })) return;
        CS.sortSubmitted = true; selected = null;
        announce(sortScore() + ' of ' + CMP.chips.length + ' features sorted correctly. Reasoning shown on each feature.');
        focusKey = 'sort-score';
        return render();
      case 'mystery-submit':
        if (CMP.mysteries.some(function (_, i) { return CS.mType[i] === undefined || CS.mMech[i] === undefined; })) return;
        CS.mSubmitted = true;
        var ms = mysteryScores();
        announce(ms.type + ' types and ' + ms.mech + ' mechanisms correct. Explanations shown.');
        focusKey = 'myst-score';
        return render();
    }
  }

  document.addEventListener('change', function (e) {
    var t = e.target, d = t.dataset.input;
    if (!d) return;
    if (view === 'compare') {
      if (d === 'mtype') CS.mType[Number(t.dataset.item)] = Number(t.value);
      else if (d === 'mmech') CS.mMech[Number(t.dataset.item)] = Number(t.value);
      else return;
      focusKey = t.dataset.key;
      return render();
    }
    if (typeof view !== 'number') return;
    var s = S[view];
    if (d === 'ctl' || d === 'ctl-range') {
      s.ctrl[t.dataset.ctl] = d === 'ctl-range' ? Number(t.value) : t.value;
      var r = runModel(view), m = modelOf(view), lbl = [];
      Object.keys(r.cats).forEach(function (k) { if (m.labels[k] && m.labels[k][r.cats[k]]) lbl.push(m.labels[k][r.cats[k]]); });
      announce('Model updated. ' + lbl.join('. ') + '.');
    }
    else if (d === 'pred') s.preds[Number(t.dataset.ch)] = t.value;
    else if (d === 'q') s.qAnswers[Number(t.dataset.ch)] = Number(t.value);
    else if (d === 'sign') s.signs.answers[Number(t.dataset.item)] = Number(t.value);
    else return;
    focusKey = t.dataset.key;
    render();
  });

  document.addEventListener('input', function (e) {
    var t = e.target, d = t.dataset.input;
    if (!d) return;
    if (d === 'name') { studentName = t.value; return; }
    if (typeof view !== 'number') return;
    var s = S[view];
    if (d === 'explain') s.explanation = t.value;
    else if (d === 'ctl-range') {
      var ctl = modelOf(view).controls.filter(function (x) { return x.id === t.dataset.ctl; })[0];
      var out = document.getElementById('out-' + t.dataset.ctl);
      if (out) out.textContent = t.value + ' ' + ctl.unit;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && selected) {
      var id = selected; selected = null;
      announce('Selection canceled.');
      focusKey = 'chip-' + id;
      render();
    }
  });

  /* drag and drop on the compare board (tap-to-place covers touch and keyboard) */
  function clearHover() { var hs = document.querySelectorAll('.drop-hover'); for (var i = 0; i < hs.length; i++) hs[i].classList.remove('drop-hover'); }
  document.addEventListener('dragstart', function (e) {
    var t = e.target.closest && e.target.closest('[data-chip]');
    if (!t || view !== 'compare' || CS.sortSubmitted) return;
    dragChip = t.dataset.chip;
    try { e.dataTransfer.setData('text/plain', dragChip); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* ignore */ }
    t.classList.add('dragging');
  });
  document.addEventListener('dragover', function (e) {
    if (!dragChip) return;
    var t = e.target.closest && e.target.closest('[data-tdrop]');
    if (!t) return;
    e.preventDefault();
    if (!t.classList.contains('drop-hover')) { clearHover(); t.classList.add('drop-hover'); }
  });
  document.addEventListener('dragleave', function (e) {
    var t = e.target.closest && e.target.closest('[data-tdrop]');
    if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop-hover');
  });
  document.addEventListener('drop', function (e) {
    if (!dragChip) return;
    var t = e.target.closest && e.target.closest('[data-tdrop]');
    if (!t) return;
    e.preventDefault();
    if (t.dataset.tdrop === 'tray') delete CS.placed[dragChip];
    else { CS.placed[dragChip] = t.dataset.tdrop; announce('Placed under ' + columnLabel(t.dataset.tdrop) + '.'); }
    dragChip = null; selected = null;
    render();
  });
  document.addEventListener('dragend', function () {
    dragChip = null; clearHover();
    var d = document.querySelectorAll('.dragging'); for (var i = 0; i < d.length; i++) d[i].classList.remove('dragging');
  });

  /* =====================================================================
     SAVE AND LOAD
     ===================================================================== */
  function saveProgress() {
    var data = JSON.stringify({ app: SAVE_APP, v: SAVE_VERSION, saved: new Date().toISOString(), name: studentName, ids: CASES.map(function (c) { return c.id; }), cases: S, compare: CS });
    var fileName = 'normal-to-wound-progress' + (studentName.trim() ? '-' + studentName.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-') : '') + '.json';
    try {
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = fileName;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      notice = 'Progress file downloaded as ' + fileName + '. Use Load saved progress to pick up where you left off.';
    } catch (err) {
      notice = 'This browser blocked the download. Print your summary instead to keep a record.';
    }
    announce(notice);
    render();
  }
  document.getElementById('loadfile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (d.app !== SAVE_APP || d.v !== SAVE_VERSION || !Array.isArray(d.cases)) throw new Error('format');
        CASES.forEach(function (sc, ci) {
          var idx = (d.ids || []).indexOf(sc.id), st = idx > -1 ? d.cases[idx] : null;
          if (st && st.ctrl && st.signs) {
            st.resetArmed = false;
            if (st.run) st.run = null;
            st.prev = null;
            S[ci] = st;
          }
        });
        if (d.compare && d.compare.placed) CS = d.compare;
        studentName = d.name || studentName;
        notice = 'Progress loaded.';
      } catch (err) {
        notice = 'That file couldn\'t be loaded. Choose a progress file saved from this activity.';
      }
      e.target.value = '';
      selected = null;
      announce(notice);
      render();
    };
    reader.readAsText(file);
  });

  document.getElementById('app-title').textContent = A.title + ': ' + A.subtitle;
  document.title = A.title + ': ' + A.subtitle;
  render();
})();
</script>
</body>
</html>
