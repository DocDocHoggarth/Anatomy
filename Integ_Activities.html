class=\"hero\"><div class=\"wrap hero-grid\">\n  <div>\n    <h1>Skin is the organ you touch in every session.</h1>\n    <p class=\"lede\">Seven practice modules built from your guided learning handout. Work down through the tissue: structure first, then sensation, then what happens when the barrier breaks.</p>\n    <p class=\"meta\">Everything here runs in the browser. Nothing is saved or submitted, so guess freely — wrong answers come with the reasoning.</p>\n  </div>\n  <div>\n    <div class=\"section-fig\">\n      <div class=\"band b1\"><span>Stratum corneum</span><span>dead, keratinized</span></div>\n      <div class=\"band b2\"><span>Stratum lucidum</span><span>thick skin only</span></div>\n      <div class=\"band b3\"><span>Stratum granulosum</span></div>\n      <div class=\"band b4\"><span>Stratum spinosum</span></div>\n      <div class=\"band b5\"><span>Stratum basale</span><span>mitosis</span></div>\n      <div class=\"band b6\"><span>Papillary dermis</span></div>\n      <div class=\"band b7\"><span>Reticular dermis</span><span>~70% collagen</span></div>\n      <div class=\"band b8\"><span>Hypodermis</span><span>adipose</span></div>\n      <p class=\"fig-cap\"><b>Figure 1.</b> Relative depths of the layers of thin skin. Not to scale.</p>\n      <details class=\"figdesc\"><summary>Text description of Figure 1</summary><div class=\"body\"><p>Eight coloured horizontal bands stacked vertically, representing the layers of thin skin from the surface downward, each drawn to its approximate relative depth and labelled on the left.</p><p>From top to bottom: the stratum corneum, a pale tan band of moderate depth, marked dead and keratinized; the stratum lucidum, drawn as a very thin near-white sliver and marked thick skin only; the stratum granulosum, a narrow pink band; the stratum spinosum, a deeper pink band about twice as thick; and the stratum basale, a narrow dark pink band marked mitosis, with a heavy dark red rule beneath it marking the basement membrane.</p><p>Below that: the papillary dermis, a pale pink band; the reticular dermis, by far the deepest band in the figure and marked approximately 70 percent collagen; and the hypodermis, a yellow band drawn with pale circles representing adipose cells.</p><p>The proportions carry the message: the reticular dermis and hypodermis together account for most of the depth, while the entire living epidermis is a thin layer at the very top.</p></div></details>\n    </div>\n  </div>\n</div></header>\n\n<main class=\"modules\"><div class=\"wrap\">\n  <h2>Seven modules</h2>\n  <p class=\"sub\">Do them in order the first time. After that, jump to whatever you keep getting wrong.</p>\n\n  <ol class=\"mods\">\n    <li><a class=\"mod\" href=\"layers.html\">\n      <span class=\"depth\">1</span>\n      <span>\n        <h3>Cross-section explorer</h3>\n        <p>Click through all eight layers of a skin cross-section. Each one gives you its cells, its job, and why it matters at the bedside. Toggle between thin and thick skin to watch the stratum corneum and lucidum change.</p>\n        <span class=\"task\">Goal: name any layer from a description, and predict what a wound at that depth will do.</span>\n      </span>\n      <span class=\"mins\">10–15 min</span>\n    </a></li>\n\n    <li><a class=\"mod\" href=\"strata-order.html\">\n      <span class=\"depth\">2</span>\n      <span>\n        <h3>Build the epidermis</h3>\n        <p>Drag the five strata into order, superficial to deep, then drop keratinocytes, melanocytes, Langerhans cells and Merkel cells into the layer where each actually lives.</p>\n        <span class=\"task\">Goal: recall the strata cold, without the mnemonic.</span>\n      </span>\n      <span class=\"mins\">8–12 min</span>\n    </a></li>\n\n    <li><a class=\"mod\" href=\"sensation.html\">\n      <span class=\"depth\">3</span>\n      <span>\n        <h3>Receptors and depth</h3>\n        <p>Place each mechanoreceptor at its true depth, then match it to the modality it encodes. Ends with sensory testing scenarios: which receptor is your monofilament actually asking about?</p>\n        <span class=\"task\">Goal: connect receptor depth to the test you would choose in clinic.</span>\n      </span>\n      <span class=\"mins\">10–15 min</span>\n    </a></li>\n\n    <li><a class=\"mod\" href=\"appendages.html\">\n      <span class=\"depth\">4</span>\n      <span>\n        <h3>Nails, hair and glands</h3>\n        <p>Three short exercises: label the nail unit, sort eccrine against apocrine against sebaceous, and read nail and hair findings as signs of systemic disease.</p>\n        <span class=\"task\">Goal: use the appendages as a screening tool during your objective exam.</span>\n      </span>\n      <span class=\"mins\">10–15 min</span>\n    </a></li>\n\n    <li><a class=\"mod\" href=\"physiology.html\">\n      <span class=\"depth\">5</span>\n      <span>\n        <h3>What the skin does</h3>\n        <p>Drag a temperature slider from a cold room to heat stress and watch vasomotor tone, eccrine sweating and piloerection respond in a live diagram. Then the barrier, hydration, vitamin D, absorption and turnover — the functional half of the handout.</p>\n        <span class=\"task\">Goal: account for the skin when you write an exercise prescription.</span>\n      </span>\n      <span class=\"mins\">12&#8211;18 min</span>\n    </a></li>\n\n    <li><a class=\"mod\" href=\"healing.html\">\n      <span class=\"depth\">6</span>\n      <span>\n        <h3>Wound healing timeline</h3>\n        <p>Scrub through hemostasis, inflammation, proliferation and maturation. Watch the cells arrive and leave, see the tensile strength curve build toward its 80% ceiling, and check what you should and should not be loading at each point.</p>\n        <span class=\"task\">Goal: justify a loading decision using the phase the tissue is in.</span>\n      </span>\n      <span class=\"mins\">12–18 min</span>\n    </a></li>\n\n    <li><a class=\"mod\" href=\"clinical.html\">\n      <span class=\"depth\">7</span>\n      <span>\n        <h3>Clinical reasoning check</h3>\n        <p>Fifteen questions built around patients, not definitions. Every answer explains itself, including the wrong ones.</p>\n        <span class=\"task\">Goal: find out what you actually know before the exam does.</span>\n      </span>\n      <span class=\"mins\">15–20 min</span>\n    </a></li>\n  </ol>\n</div></main>\n\n<footer><div class=\"wrap\">\n  <p>Built from <i>Anatomy and Physiology of the Integumentary System</i>, DPTD 733 guided learning handout.</p><p>Anywhere a module goes past the handout — burn depth, pressure injury staging, the diabetic foot, scar loading, sensory testing — the claim carries a link to its source, and every module ends with a <b>Beyond the handout</b> list gathering those sources in one place. Sources are NIH StatPearls, NPIAP, ISTAP and the IWGDF guidelines. Check them against your course materials before relying on them.</p>\n  <p>Study aid only. Not a clinical reference.</p>\n</div></footer>\n\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "layers": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Cross-section of the skin — DPTD 733</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --card50:#E47082; --card-pale:#FBEAED;\n  --blue:#4599C7; --blue-dk:#256C93; --green:#1B5E20; --green-bg:#E8F1E9;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666;\n  --line:#D9D9D9; --bg:#F5F5F5;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--ink2);\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}\nh1,h2,h3{font-weight:700;margin:0}\na{color:var(--blue-dk)}\n:focus-visible{outline:3px solid var(--blue-dk);outline-offset:2px}\n.wrap{max-width:1140px;margin:0 auto;padding:0 24px}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.modbar{background:#fff;border-bottom:1px solid var(--line)}\n.modbar .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;\n  padding:11px 24px;font-size:14px;color:var(--muted)}\n.modbar b{color:var(--cardinal)}\nh1{font-size:30px;color:var(--cardinal);margin:30px 0 6px}\n.lede{max-width:66ch;margin:0 0 22px}\n.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}\n.seg{display:inline-flex;border:1px solid var(--line);background:#fff}\n.seg button{font:inherit;font-size:14px;border:0;background:#fff;color:var(--ink2);padding:8px 16px;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--cardinal);color:#fff;font-weight:700}\n.seg button+button{border-left:1px solid var(--line)}\n.hint{font-size:13px;color:var(--muted)}\n.stage{display:grid;grid-template-columns:minmax(340px,1.05fr) .95fr;gap:36px;align-items:start;padding-bottom:24px}\n.figbox{position:sticky 2px 14px;margin-top:16px}\n.clin b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--cardinal);margin-bottom:4px}\n.clin p{margin:0}\na.src{display:inline-block;margin-top:9px;font-size:12px;color:var(--blue-dk);text-decoration:none;\n  border-bottom:1px solid var(--blue)}\n.qbox{border:1px solid var(--line);background:#fff;padding:18px 20px}\n.qbox .count{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}\n.qbox .prompt{font-size:17px;margin:0 0 12px;max-width:52ch;color:var(--ink)}\n.verdict{padding:12px 14px;margin-top:14px;font-size:14.5px}\n.verdict.good{background:var(--green-bg);border-left:4px solid var(--green)}\n.verdict.bad{background:var(--card-pale);border-left:4px solid var(--cardinal)}\n.verdict b{display:block;margin-bottom:3px}\nbutton.act{font:inherit;font-size:15px;background:var(--cardinal);color:#fff;border:0;padding:10px 20px;\n  cursor:pointer;margin-top:16px;font-weight:700}\nbutton.act:hover{background:var(--cardinal-dk)}\n.score{font-size:14px;color:var(--muted);margin-top:14px}\n.beyond{border-top:4px solid var(--blue-dk);padding-top:16px;margin-top:48px}\n.beyond h2{font-size:20px;color:var(--blue-dk);margin-bottom:4px}\n.beyond .intro{font-size:14.5px;max-width:70ch;margin:0 0 16px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:11px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:14.5px;max-width:62ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}\nul.srcs a{font-size:13.5px}\nnav.pager{border-top:1px solid var(--line);padding:18px 0 56px;margin-top:36px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n@media (max-width:900px){.stage{grid-template-columns:1fr;gap:24px}.figbox{position:static}\n  .keylist{grid-template-columns:1fr}ul.srcs li{grid-template-columns:1fr;gap:6px}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\ndetails.figdesc{border-top:1px solid var(--line);background:#FCFCFC}\ndetails.figdesc summary{cursor:pointer;padding:9px 14px;font-size:12px;color:var(--blue-dk);list-style:none}\ndetails.figdesc summary::-webkit-details-marker{display:none}\ndetails.figdesc summary::before{content:\"\\25B8  \"}\ndetails.figdesc[open] summary::before{content:\"\\25BE  \"}\ndetails.figdesc .body{padding:0 14px 14px;font-size:13px;color:var(--ink2);max-width:72ch}\ndetails.figdesc .body p{margin:0 0 9px}\ndetails.figdesc .body p:last-child{margin:0}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>· Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 · Foundational Movement Science III</span>\n</div></div>\n<div class=\"modbar\"><div class=\"wrap\">\n  <span><b>Module 1</b> · Cross-section explorer</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>Work your way down</h1>\n  <p class=\"lede\">Select any layer in Figure 1, or any numbered cell in the key beneath it. Switch the skin type to see what actually changes between the sole of the foot and the back of the forearm — it is less than most people assume.</p>\n  <div class=\"controls\">\n    <div class=\"seg\" role=\"group\" aria-label=\"Skin type\">\n      <button id=\"thinBtn\" aria-pressed=\"true\">Thin skin</button>\n      <button id=\"thickBtn\" aria-pressed=\"false\">Thick skin</button>\n    </div>\n    <div class=\"seg\" role=\"group\" aria-label=\"Mode\">\n      <button id=\"exploreBtn\" aria-pressed=\"true\">Explore</button>\n      <button id=\"quizBtn\" aria-pressed=\"false\">Quiz me</button>\n    </div>\n    <span class=\"hint\" id=\"hint\">Forearm, trunk, most of the body. Hair follicles present.</span>\n  </div>\n</div>\n\n<main class=\"wrap stage\">\n  <div class=\"figbox\">\n    <figure>\n      <div class=\"figscroll\">\n        <svg id=\"fig\" viewBox=\"0 0 600 664\" role=\"img\"\n             aria-labelledby=\"figcap\" aria-describedby=\"figdesc1\">\n          <defs id=\"defs\"></defs>\n          <g id=\"gTissue\"></g><g id=\"gTexture\"></g><g id=\"gVessels\"></g><g id=\"gAdnexa\"></g>\n          <g id=\"gOutline\"></g><g id=\"gMarkers\"></g>\n          <g id=\"gLabels\" class=\"svgtxt\"></g><g id=\"gBrackets\" class=\"svgtxt\"></g>\n        </svg>\n      </div>\n      <figcaption id=\"figcap0\"><span class=\"num\">Figure 1.</span> <span id=\"figcap\"></span>\n        <span class=\"src\">Schematic; layer depths are relative and not to scale. Drawn for DPTD 733 after Hamm RL, <i>Text and Atlas of Wound Diagnosis and Treatment</i>, 3rd ed.</span>\n      </figcaption>\n      <details class=\"figdesc\"><summary>Text description of Figure 1</summary>\n        <div class=\"body\" id=\"figdesc1\"></div></details>\n    </figure>\n    <div class=\"keybox\">\n      <h3>Key to numbered cells and receptors</h3>\n      <ul class=\"keylist\" id=\"key\"></ul>\n    </div>\n  </div>\n  <div class=\"panel\" id=\"panel\"></div>\n</main>\n\n<section class=\"wrap beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">The layer descriptions come from your guided learning handout. The clinical notes attached to them do not — those are standard practice you will meet on placement. Each is linked to a source you can read in full.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">Pressure injury staging, deep tissue injury, and why surface appearance lags the damage<em>Behind the hypodermis note</em></span><a href=\"https://npiap.com/\" target=\"_blank\" rel=\"noopener\">NPIAP resources &#8599;</a></li>\n    <li><span class=\"claim\">Assessing early pressure damage in darker skin without relying on erythema<em>Behind the melanocyte note; the staging poster is a free download</em></span><a href=\"https://learn.npiap.com/products/npiap-staging-for-dark-skin-poster\" target=\"_blank\" rel=\"noopener\">NPIAP dark skin tone poster &#8599;</a></li>\n    <li><span class=\"claim\">Burn depth: why a superficial partial-thickness burn is agonising and a full-thickness burn is not<em>Behind the basale, spinosum and free nerve ending notes</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK430741/\" target=\"_blank\" rel=\"noopener\">Burn Evaluation and Management &#8599;</a></li>\n    <li><span class=\"claim\">Skin tears in aged skin, and the flattened dermal–epidermal junction behind them<em>Behind the papillary dermis note</em></span><a href=\"https://www.skintears.org/resources\" target=\"_blank\" rel=\"noopener\">ISTAP resources &#8599;</a></li>\n    <li><span class=\"claim\">Callus as a pressure point, offloading, and the diabetic foot<em>Behind the corneum and lucidum notes</em></span><a href=\"https://iwgdfguidelines.org/guidelines-2023/\" target=\"_blank\" rel=\"noopener\">IWGDF Guidelines 2023 &#8599;</a></li>\n    <li><span class=\"claim\">Receptor depth, adaptation rate and receptive field size<em>Behind the Merkel, Meissner, Ruffini and Pacinian notes</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK541068/\" target=\"_blank\" rel=\"noopener\">Physiology, Mechanoreceptors &#8599;</a></li>\n    <li><span class=\"claim\">The strata and epidermal cell types in full detail<em>Fills out everything in Figure 1</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470464/\" target=\"_blank\" rel=\"noopener\">Anatomy, Skin: Epidermis &#8599;</a></li>\n    <li><span class=\"claim\">Granulation tissue, myofibroblast contraction and scar formation<em>Behind the fibroblast and reticular dermis notes</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK554402/\" target=\"_blank\" rel=\"noopener\">Physiology, Granulation Tissue &#8599;</a></li>\n  </ul>\n</section>\n\n<nav class=\"wrap pager\">\n  <a href=\"index.html\">← All modules</a>\n  <a href=\"strata-order.html\">Next: Build the epidermis →</a>\n</nav>\n\n<script>\nconst X0=70,X1=360,Y0=46,P=58,LBLX=X1+26,TXTX=X1+42;\n\nconst LAYERS=[\n {id:'corneum',name:'Stratum corneum',thin:40,thick:110,fill:'#F3E4CE',kicker:'Epidermis · outermost',\n  what:['Dead, flattened keratinocytes packed with keratin','Intercellular lipids filling the gaps between them','Cells shed continuously and replaced from below'],\n  body:'This is the barrier layer. The keratin gives it mechanical toughness; the lipids between the cells are what actually limit water moving out and most substances moving in. Thick skin owes almost all of its extra thickness to this one layer.',\n  clin:'Friction and shear thicken it into callus. Over a bony prominence on an insensate foot, that callus stops being protective and becomes the pressure point — which is why callus debridement is part of offloading, not cosmetics. It also means topical medication only works if the molecule can cross here.',\n  src:['Callus and offloading — IWGDF 2023','https://iwgdfguidelines.org/guidelines-2023/']},\n {id:'lucidum',name:'Stratum lucidum',thin:0,thick:20,fill:'#FAF2E5',kicker:'Epidermis · thick skin only',\n  what:['A thin band of flat, clear, translucent cells','Present on palms and soles','Absent everywhere else'],\n  body:'The lucidum only exists in thick skin. It is the single most useful landmark on a histology slide: if you can see it, you are looking at palm or sole.',\n  clin:'Thick skin is hairless and has no sebaceous glands, so it depends entirely on eccrine sweat for surface moisture. That is why plantar skin cracks and fissures so readily in patients with autonomic neuropathy who no longer sweat there.',\n  src:['Diabetic foot guidelines — IWGDF 2023','https://iwgdfguidelines.org/guidelines-2023/']},\n {id:'granulosum',name:'Stratum granulosum',thin:26,thick:28,fill:'#EFCBD3',kicker:'Epidermis',\n  what:['Keratinocytes flattening and losing nuclei and organelles','Lamellar granules releasing waterproofing lipids','The living-to-dead transition zone'],\n  body:'Cells here are being actively dismantled. As they flatten they release lipids into the intercellular space, and that lipid mortar is what makes the corneum above it waterproof.',\n  clin:'Barrier lipids come from here. When they are depleted — xerosis, repeated washing, the dry cracking skin of a chronically edematous limb — transepidermal water loss climbs and the skin fissures. Emollients work by replacing what this layer is failing to supply.',\n  src:['Histology, Skin — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK537325/']},\n {id:'spinosum',name:'Stratum spinosum',thin:62,thick:66,fill:'#E7AFBD',kicker:'Epidermis',\n  what:['Maturing keratinocytes producing increasing keratin','Desmosomes binding neighbouring cells (the \"spines\")','Langerhans cells patrolling as antigen-presenting cells'],\n  body:'The bulk of the living epidermis. Desmosomes lock the keratinocytes to each other here, and that mechanical linkage is what lets the epidermis resist being dragged sideways.',\n  clin:'Shear separates cells at roughly this level. A friction blister, and the epidermal separation you see in a stage 2 pressure injury or a superficial partial-thickness burn, are failures of this bond. Two sheets sliding on a bed is a spinosum problem before it is a skin-breakdown problem.',\n  src:['Burn depth and epidermal separation — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK430741/']},\n {id:'basale',name:'Stratum basale',thin:26,thick:26,fill:'#D98CA0',kicker:'Epidermis · deepest',\n  what:['A single layer of mitotically active columnar keratinocytes','Melanocytes producing melanin','Merkel cells coupled to sensory nerve endings','Hemidesmosomes anchoring the epidermis to the basement membrane'],\n  body:'The regenerative reserve of the epidermis. Every keratinocyte above started here and takes roughly two weeks to reach the corneum and another two to be shed.',\n  clin:'Whether this layer survives decides how a wound closes. Spare the basale and the epidermal appendages below it, and the wound re-epithelializes from islands across its whole surface. Destroy it over a wide area — full-thickness burn, deep pressure injury — and closure has to come from the edges, slowly, or from a graft.',\n  src:['Burn depth and re-epithelialization — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK430741/']},\n {id:'papillary',name:'Papillary dermis',thin:78,thick:66,fill:'#F6D3DA',kicker:'Dermis · superficial',\n  what:['Thin, loosely arranged collagen and elastin','Dermal papillae interlocking with the epidermis','Capillary loops feeding the avascular epidermis',\"Meissner's corpuscles for light touch\"],\n  body:'A thin, vascular, sensory layer. The epidermis has no blood supply of its own, so everything it needs diffuses up out of these capillary loops.',\n  clin:'The papillary interlock is a mechanical anti-shear device, and it flattens with age — a large part of why older skin tears rather than stretches. These are also the vessels that empty when you press and refill when you let go, so blanching response and capillary refill are questions about this layer.',\n  src:['Skin tears in aged skin — ISTAP','https://www.skintears.org/resources']},\n {id:'reticular',name:'Reticular dermis',thin:168,thick:150,fill:'#EFB4C0',kicker:'Dermis · deep',\n  what:['Dense irregular connective tissue, thick collagen bundles','Collagen makes up roughly 70% of the dermis','Elastic fibers, fibroblasts, mast cells, macrophages','Hair follicles, sebaceous and sweat glands','Pacinian and Ruffini endings'],\n  body:'The structural layer. Strength, resilience and elastic recoil all come from here, and so does most of the tissue that remodels after injury.',\n  clin:'This is the layer you are treating when you mobilize a scar. Collagen laid down here during proliferation is disorganized; over weeks to years it realigns along lines of tension, and controlled loading is what supplies those lines. It is also where the appendages live, which is why a wound reaching partway into it can still re-epithelialize from follicle and gland linings.',\n  src:['Granulation tissue and scar — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK554402/']},\n {id:'hypodermis',name:'Hypodermis',thin:140,thick:118,fill:'#F8E8C2',kicker:'Subcutaneous · not technically skin',\n  what:['Adipose tissue and loose connective tissue','The cutaneous vascular plexus','Pacinian corpuscles','Binds skin to underlying fascia'],\n  body:'Insulation, energy store and shock absorber. It is discussed with the skin because it anchors it, but it is a separate layer.',\n  clin:'Where this padding is thin — sacrum, greater trochanter, ischial tuberosity, heel — pressure transmits straight to bone, and deep tissue injury starts at the bone–muscle interface and works outward before you ever see it at the surface. When a chronic wound undermines or tunnels, it is spreading through this plane.',\n  src:['Pressure injury staging — NPIAP','https://npiap.com/']}\n];\n\nconst CELLS={\n keratinocyte:{n:1,name:'Keratinocyte',layer:'spinosum',fx:.38,x:118,kicker:'Cell · epidermis',\n  what:['Most abundant cell in the epidermis','Produces keratin'],\n  body:'Born in the basale, matures upward, dies, and becomes the barrier. The whole epidermis is essentially a keratinocyte assembly line.',\n  clin:'Keratinocytes migrating across a wound bed is epithelialization — the visible edge advance you measure week to week. They need a moist, non-desiccated surface to migrate over, which is the entire rationale for moist wound healing.',\n  src:['Moist wound healing — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK470199/']},\n langerhans:{n:2,name:'Langerhans cell',layer:'spinosum',fx:.62,x:250,kicker:'Cell · stratum spinosum',\n  what:['Antigen-presenting immune cell','Detects pathogens and initiates the immune response'],\n  body:\"The skin's resident immune sentinel, communicating between the epidermis and the wider immune system.\",\n  clin:'Contact dermatitis under a dressing, tape or a brace liner is a Langerhans-driven response. If a patient reacts to a dressing adhesive, this is the mechanism.',\n  src:['Histology, Skin — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK537325/']},\n freenerve:{n:3,name:'Free nerve endings',layer:'granulosum',fx:.5,x:308,kicker:'Nerve · epidermis',\n  what:['Unencapsulated endings reaching into the epidermis','Pain and temperature'],\n  body:'Nociceptors and thermoreceptors. The only sensory endings that reach this superficially.',\n  clin:'A superficial partial-thickness burn is exquisitely painful precisely because these endings are exposed and intact. A painless full-thickness burn is the more ominous finding.',\n  src:['Burn depth and nociceptors — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK430741/']},\n melanocyte:{n:4,name:'Melanocyte',layer:'basale',fx:.5,x:150,kicker:'Cell · stratum basale',\n  what:['Produces melanin','Distributes pigment to surrounding keratinocytes'],\n  body:'Melanin absorbs UV radiation. Sun exposure increases production, which darkens the skin and increases protection.',\n  clin:'Post-inflammatory hyper- or hypopigmentation at a healed wound is melanocyte behaviour, and it is more visible and more distressing in darker skin. Erythema is also harder to see in darker skin, so early pressure damage is assessed by temperature, firmness and pain, not colour alone.',\n  src:['Staging in dark skin tones — NPIAP poster','https://learn.npiap.com/products/npiap-staging-for-dark-skin-poster']},\n merkel:{n:5,name:'Merkel cell',layer:'basale',fx:.5,x:266,kicker:'Cell · stratum basale',\n  what:['Sits at the base of the epidermis, coupled to a sensory nerve ending','Slowly adapting touch receptor'],\n  body:'Encodes sustained pressure, fine touch and texture — edges, points, shapes.',\n  clin:'Two-point discrimination and light-touch testing lean heavily on Merkel input. Sensory re-education after nerve injury is largely retraining the interpretation of these signals.',\n  src:['Physiology, Mechanoreceptors — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK541068/']},\n meissner:{n:6,name:\"Meissner's corpuscle\",layer:'papillary',fx:.22,x:212,kicker:'Receptor · papillary dermis',\n  what:['Encapsulated, sits inside a dermal papilla','Rapidly adapting; light touch and low-frequency flutter'],\n  body:'Densest in glabrous skin — fingertips, palms, soles.',\n  clin:'Light-touch and moving-touch testing in the hand is largely a Meissner question. Density here is why fingertip sensation matters so much for fine motor retraining.',\n  src:['Physiology, Mechanoreceptors — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK541068/']},\n fibroblast:{n:7,name:'Fibroblast',layer:'reticular',fx:.28,x:130,kicker:'Cell · dermis',\n  what:['Produces collagen, elastin and ground substance'],\n  body:'The construction crew of the dermis, and the dominant cell of the proliferative phase of healing.',\n  clin:'Fibroblasts differentiate into myofibroblasts that contract a wound closed. Useful when a wound needs to shrink; a problem when contraction crosses a joint and becomes a contracture. Positioning and stretch during proliferation are aimed squarely at this.',\n  src:['Wound contraction and contracture — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK554402/']},\n ruffini:{n:8,name:'Ruffini ending',layer:'reticular',fx:.24,x:268,kicker:'Receptor · dermis',\n  what:['Slowly adapting','Responds to skin stretch and sustained pressure'],\n  body:'Signals sustained deformation and the direction of skin stretch.',\n  clin:'Contributes to proprioception at joints by reading how the skin stretches over them. Part of why taping and compression garments change movement quality even without mechanical support.',\n  src:['Physiology, Mechanoreceptors — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK541068/']},\n mast:{n:9,name:'Mast cell',layer:'reticular',fx:.6,x:196,kicker:'Cell · dermis',\n  what:['Releases histamine and other inflammatory mediators','Involved in wound healing and defence'],\n  body:'An early responder in inflammation, driving vasodilation and vascular permeability.',\n  clin:'Mast cell activity is a large part of the redness, heat and swelling you see in a healing wound during the first days. Distinguishing that expected inflammation from infection is a judgement about trajectory, not about whether redness is present.',\n  src:['Physiology, Wound Healing — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK535406/']},\n pacinian:{n:10,name:'Pacinian corpuscle',layer:'hypodermis',fx:.3,x:250,kicker:'Receptor · deep dermis and hypodermis',\n  what:['Large, onion-layered capsule','Rapidly adapting; deep pressure and high-frequency vibration'],\n  body:'The deepest and largest cutaneous receptor. Responds to onset and offset of pressure rather than steady contact.',\n  clin:'Tuning fork vibration testing is a Pacinian test, and loss of vibration sense is often the earliest measurable deficit in diabetic peripheral neuropathy — earlier than monofilament loss.',\n  src:['Physiology, Vibratory Sense — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK542288/']}\n};\n\nconst QUIZ=[\n {a:'lucidum',q:'A slide shows a thin band of flat, clear cells directly beneath the stratum corneum. Which layer is it — and what does its presence tell you about where the sample came from?',\n  why:'The stratum lucidum exists only in thick skin, so this sample is from a palm or a sole.'},\n {a:'basale',q:'New keratinocytes are generated here, and this is also where melanocytes sit.',\n  why:'The stratum basale is the mitotically active layer, and it houses melanocytes and Merkel cells.'},\n {a:'granulosum',q:'Cells here flatten, lose their nuclei, and release the lipids that waterproof the skin.',\n  why:'The stratum granulosum is the transition from living to dead epidermis, and the source of barrier lipids.'},\n {a:'papillary',q:\"Capillary loops that nourish the avascular epidermis sit here, alongside Meissner's corpuscles.\",\n  why:'The papillary dermis carries the capillary loops and the dermal papillae that interlock with the epidermis.'},\n {a:'reticular',q:'Collagen laid down after an injury remodels here for weeks to years, realigning along lines of tension.',\n  why:'The reticular dermis holds the thick collagen bundles — roughly 70% of the dermis — and is where scar remodels.'},\n {a:'hypodermis',q:'Loss of padding in this layer over the sacrum and greater trochanter raises pressure injury risk.',\n  why:'The hypodermis is the adipose shock absorber. It is also the plane a chronic wound undermines through.'},\n {a:'spinosum',q:'Langerhans cells patrol this layer of maturing keratinocytes bound together by desmosomes.',\n  why:'The stratum spinosum is where keratinocytes mature and where the desmosomes that resist shear are found.'},\n {a:'corneum',q:'Dead keratinized cells in a lipid matrix. The main barrier against water loss.',\n  why:'The stratum corneum. Its lipid matrix, not the cells alone, is what limits transepidermal water loss.'}\n];\n\nlet thick=false,mode='explore',sel='corneum';\nlet qOrder=[],qIdx=0,qScore=0,qAnswered=false;\nlet th=LAYERS.map(L=>L.thin);\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\nconst NS='http://www.w3.org/2000/svg';\nfunction el(t,a){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;}\nfunction add(p,t,a){const n=el(t,a);p.appendChild(n);return n;}\nfunction txt(p,x,y,s,a){const n=add(p,'text',Object.assign({x:x,y:y},a||{}));n.textContent=s;return n;}\nfunction bAmp(i){return i<=5?3+11*Math.pow(i/5,1.6):(i===6?4:i===7?3:0);}\nfunction bounds(){const b=[Y0];for(let i=0;i<th.length;i++)b.push(b[i]+th[i]);return b;}\nfunction yAt(x,base,amp){return base+amp*Math.sin(2*Math.PI*(x-X0)/P);}\nfunction edge(i,B,rev){const base=B[i],amp=bAmp(i),p=[];\n  for(let x=X0;x<=X1;x+=4)p.push([x,yAt(x,base,amp)]);\n  if(p[p.length-1][0]!==X1)p.push([X1,yAt(X1,base,amp)]);\n  return rev?p.reverse():p;}\nfunction pstr(a){return a.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');}\nfunction layerPath(i,B){return 'M '+pstr(edge(i,B,false))+' L '+pstr(edge(i+1,B,true))+' Z';}\nfunction edgePath(i,B){return 'M '+pstr(edge(i,B,false));}\nfunction papillaXs(){const xs=[];for(let x=X0+P/4;x<X1-6;x+=P)xs.push(x);return xs;}\nconst idx=id=>LAYERS.findIndex(L=>L.id===id);\n\nfunction render(){\n  const B=bounds();\n  const gT=document.getElementById('gTissue'),gX=document.getElementById('gTexture'),\n        gO=document.getElementById('gOutline'),defs=document.getElementById('defs');\n  gT.innerHTML='';gX.innerHTML='';gO.innerHTML='';defs.innerHTML='';\n\n  LAYERS.forEach((L,i)=>{\n    if(th[i]<0.6)return;\n    const d=layerPath(i,B);\n    add(add(defs,'clipPath',{id:'clip-'+L.id}),'path',{d:d});\n    add(gT,'path',{d:d,fill:L.fill,'data-id':L.id,class:'lay',style:'cursor:pointer'});\n  });\n\n  const tex=(id,fn)=>{if(th[idx(id)]<4)return;\n    fn(add(gX,'g',{'clip-path':'url(#clip-'+id+')','pointer-events':'none'}));};\n\n  tex('corneum',g=>{\n    for(let y=B[0]+5;y<B[1];y+=7){\n      const f=(y-B[0])/Math.max(1,th[0]),a=bAmp(0)+f*(bAmp(1)-bAmp(0));\n      let d='M '+X0+' '+yAt(X0,y,a).toFixed(1);\n      for(let x=X0+4;x<=X1;x+=4)d+=' L '+x+' '+yAt(x,y,a).toFixed(1);\n      add(g,'path',{d:d,fill:'none',stroke:'#DFC7A6','stroke-width':1});\n    }\n    for(let x=X0+6;x<X1;x+=26)\n      add(g,'path',{d:'M '+x+' '+(B[0]-1)+' q 7 -5 15 0',fill:'none',stroke:'#C9AE8A','stroke-width':1.1});\n  });\n  tex('lucidum',g=>{for(let y=B[1]+6;y<B[2];y+=8)\n    add(g,'path',{d:'M '+X0+' '+y+' H '+X1,fill:'none',stroke:'#E8DAC2','stroke-width':1});});\n  tex('granulosum',g=>{\n    for(let y=B[2]+7;y<B[3];y+=10)for(let x=X0+9;x<X1;x+=17){\n      const f=(y-B[2])/Math.max(1,th[2]),yy=yAt(x,y,bAmp(2)+f*(bAmp(3)-bAmp(2)));\n      add(g,'ellipse',{cx:x,cy:yy,rx:7,ry:3.4,fill:'#E9BDC8',stroke:'#D89AA9','stroke-width g.addEventListener('click',e=>{e.stopPropagation();pick(key);});\n    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(key);}});\n  });\n\n  const gl=document.getElementById('gLabels');gl.innerHTML='';\n  const items=LAYERS.map((L,k)=>({L:L,k:k,y:B[k]+th[k]/2,an:B[k]+th[k]/2})).filter(o=>th[o.k]>0.6);\n  for(let k=1;k<items.length;k++)\n    if(items[k].y-items[k-1].y<21)items[k].y=items[k-1].y+21;\n  items.forEach(o=>{\n    const on=sel===o.L.id;\n    add(gl,'path',{d:'M '+(X1+2)+' '+o.an.toFixed(1)+' L '+LBLX+' '+o.y.toFixed(1)+' L '+(TXTX-6)+' '+o.y.toFixed(1),\n      fill:'none',stroke:on?'#1A1A1A':'#8A8A8A','stroke-width':on?1.8:1});\n    add(gl,'circle',{cx:X1+2,cy:o.an,r:2.4,fill:on?'#1A1A1A':'#8A8A8A'});\n    const t=txt(gl,TXTX,o.y+4,o.L.name,{'font-size':12.5,fill:on?'#1A1A1A':'#333333',\n      'font-weight':on?'700':'400',style:'cursor:pointer'});\n    t.setAttribute('data-id',o.L.id);\n    if(o.L.id==='lucidum')\n      txt(gl,TXTX,o.y+16,'(thick skin only)',{'font-size':10.5,fill:'#666666','pointer-events':'none'});\n  });\n\n  const gb=document.getElementById('gBrackets');gb.innerHTML='';\n  brack(gb,'Epidermis',B[0],B[5]);brack(gb,'Dermis',B[5],B[7]);brack(gb,'Hypodermis',B[7],B[8]);\n\n  gT.querySelectorAll('.lay').forEach(p=>p.addEventListener('click',()=>pick(p.getAttribute('data-id'))));\n  gl.querySelectorAll('[data-id]').forEach(t=>t.addEventListener('click',()=>pick(t.getAttribute('data-id'))));\n}\n\nfunction brack(p,label,yA,yB){\n  const x=52;\n  add(p,'path',{d:'M '+(x+9)+' '+yA.toFixed(1)+' H '+x+' V '+yB.toFixed(1)+' H '+(x+9),\n    fill:'none',stroke:'#8A8A8A','stroke-width':1.3});\n  txt(p,x-9,(yA+yB)/2,label,{'text-anchor':'middle','font-size':12,fill:'#333333',\n    transform:'rotate(-90 '+(x-9)+' '+((yA+yB)/2)+')'});\n}\n\nfunction glyph(k){\n  const B='#256C93',D='#5A3242',R='#C8102E',G='#1B5E20';\n  switch(k){\n   case 'keratinocyte':return '<polygon points=\"-8,-4.5 0,-9 8,-4.5 8,4.5 0,9 -8,4.5\" fill=\"#F0C9D5\" stroke=\"#A85971\" stroke-width=\"1.5\"/><circle r=\"2.6\" fill=\"#A85971\"/>';\n   case 'melanocyte':return '<g stroke=\"'+D+'\" stroke-width=\"1.8\" fill=\"none\"><circle r=\"5\" fill=\"'+D+'\"/><path d=\"M0 -5 L-4 -13 M4.5 -3 L12 -8 M4.5 3 L11 9 M-4.5 3 L-11 9 M-4.5 -3 L-12 -6\"/></g>';\n   case 'merkel':return '<g><circle r=\"5\" fill=\"'+B+'\"/><path d=\"M0 5 L0 15\" stroke=\"'+B+'\" stroke-width=\"2\"/><path d=\"M-5 15 L5 15\" stroke=\"'+B+'\" stroke-width=\"2\"/></g>';\n   case 'langerhans':return '<g stroke=\"'+G+'\" stroke-width=\"1.6\" fill=\"none\"><circle r=\"4.5\" fill=\"'+G+'\"/><path d=\"M0 -4.5 L0 -12 M4 -2 L11 -7 M4.5 2 L12 6 M-4 -2 L-11 -7 M-4.5 2 L-12 6 M0 4.5 L0 12\"/></g>';\n   case 'freenerve':return '<g stroke=\"'+B+'\" stroke-width=\"2\" fill=\"none\"><path d=\"M0 16 L0 -11\"/><path d=\"M0 -2 L-8 -10 M0 2 L8 -6 M0 -6 L7 -14\"/></g>';\n   case 'meissner':return '<g><ellipse rx=\"6\" ry=\"10\" fill=\"#DCEAF6\" stroke=\"'+B+'\" stroke-width=\"1.7\"/><path d=\"M-3.5 -6 q7 3.5 0 7 q-7 3.5 0 7\" fill=\"none\" stroke=\"'+B+'\" stroke-width=\"1.4\"/></g>';\n   case 'fibroblast':return '<g><polygon points=\"-15,0 0,-5.5 15,0 0,5.5\" fill=\"#C97F94\" stroke=\"#A85971\" stroke-width=\"1.1\"/><circle r=\"2\" fill=\"#7E3E53\"/></g>';\n   case 'ruffini':return '<g><ellipse rx=\"13\" ry=\"5\" fill=\"#DCEAF6\" stroke=\"'+B+'\" stroke-width=\"1.6\"/><path d=\"M-16 0 H16\" stroke=\"'+B+'\" stroke-width=\"1.6\"/></g>';\n   case 'mast':return '<g><circle r=\"7\" fill=\"#F5C3CE\" stroke=\"'+R+'\" stroke-width=\"1.5\"/><circle cx=\"-2.4\" cy=\"-2.4\" r=\"1.4\" fill=\"'+R+'\"/><circle cx=\"2.8\" cy=\"0\" r=\"1.4\" fill=\"'+R+'\"/><circle cx=\"-1\" cy=\"2.8\" r=\"1.4\" fill=\"'+R+'\"/></g>';\n   case 'pacinian':return '<g fill=\"none\" stroke=\"'+B+'\" stroke-width=\"1.5\"><ellipse rx=\"15\" ry=\"10\" fill=\"#E4EFF8\"/><ellipse rx=\"10\" ry=\"6.4\"/><ellipse rx=\"4.6\" ry=\"2.8\" fill=\"'+B+'\"/></g>';\n  }\n  return '';\n}\n\n\nconst DESC={\n common:'<p>A vertical cross-section of skin, surface at the top, drawn as a stack of coloured bands. Brackets on the left group them as epidermis, dermis and hypodermis; each band is named by a leader line to a label on the right.</p>'+\n  '<p>Each band carries its own histological texture. The stratum corneum is pale tan, crossed by fine horizontal lines representing stacked dead flattened cells, with small curled flakes lifting from the surface. The stratum granulosum holds rows of small flattened oval cells, each with two dark granules. The stratum spinosum holds six-sided polygonal cells with dark nuclei. The stratum basale is a single row of tall narrow columnar cells. Below the epidermis, the papillary dermis carries fine loose collagen strokes and the reticular dermis carries thicker, denser collagen bundles. The hypodermis is drawn as packed round adipocytes with a small nucleus at the edge of each.</p>'+\n  '<p>The boundary between the stratum basale and the papillary dermis is drawn as a heavy dark red wavy line: the basement membrane. Its waviness is the point — dermal papillae project upward into the epidermis and epidermal ridges project downward into the dermis, interlocking the two layers. All the boundaries above it follow the same wave with progressively less amplitude, so the surface itself is nearly flat.</p>'+\n  '<p>Two vascular plexuses run horizontally as paired red and blue wavy vessels, one at the junction of papillary and reticular dermis and one at the top of the hypodermis, joined by a connecting vessel. Small red capillary loops rise from the upper plexus into the crests of the dermal papillae, delivering nutrients to the avascular epidermis above.</p>'+\n  '<p>An eccrine sweat gland is drawn on the right as a coiled blue body deep in the dermis, with a spiral duct rising through all the layers to a pore at the surface.</p>'+\n  '<p>Ten cells and receptors are marked with small numbered red circles, matching the key printed beneath the figure. In order of depth: free nerve endings (3) as a bare branching fibre reaching into the epidermis; a keratinocyte (1) as a pale six-sided cell and a Langerhans cell (2) as a green star-shaped cell, both in the stratum spinosum; a melanocyte (4) as a dark star with radiating processes and a Merkel cell (5) as a blue disc with a nerve fibre, both in the stratum basale; a Meissner\\'s corpuscle (6) as a tall oval capsule in the papillary dermis; a fibroblast (7) as an elongated spindle, a Ruffini ending (8) as a wide flat spindle and a mast cell (9) as a stippled circle, all in the reticular dermis; and a Pacinian corpuscle (10) as a large oval of concentric rings in the hypodermis.</p>',\n thin:'<p>The figure currently shows <b>thin skin</b> — forearm, trunk, most of the body. The stratum corneum is a narrow band and no stratum lucidum is present. A hair follicle is drawn on the left running from the surface down into the reticular dermis, widening into a bulb at its base, with a lobulated yellow sebaceous gland opening into it and a thick pink arrector pili muscle running diagonally from the follicle up to the papillary dermis.</p>',\n thick:'<p>The figure currently shows <b>thick skin</b> — palm or sole. The stratum corneum is now by far the deepest band in the figure, several times its thickness in thin skin, and a narrow near-white stratum lucidum has appeared directly beneath it. There is no hair follicle, no sebaceous gland and no arrector pili muscle: thick skin has none. The eccrine sweat gland remains, and is the only appendage present.</p>'};\nfunction setDesc(){\n  const d=document.getElementById('figdesc1');\n  if(d) d.innerHTML=(thick?DESC.thick:DESC.thin)+DESC.common;\n}\n\nfunction buildKey(){\n  const ul=document.getElementById('key');ul.innerHTML='';\n  Object.keys(CELLS).sort((a,b)=>CELLS[a].n-CELLS[b].n).forEach(k=>{\n    const li=document.createElement('li'),b=document.createElement('button');\n    b.innerHTML='<b>'+CELLS[k].n+'</b><span>'+CELLS[k].name+'</span>';\n    b.setAttribute('aria-current',sel===k);\n    b.onclick=()=>pick(k);\n    li.appendChild(b);ul.appendChild(li);\n  });\n}\n\nfunction pick(id){if(mode==='quiz'){answer(id);return;}sel=id;render();buildKey();paint();}\n\nfunction paint(){\n  const p=document.getElementById('panel');\n  if(mode==='quiz'){paintQuiz();return;}\n  const L=LAYERS.find(l=>l.id===sel)||CELLS[sel];\n  const here=Object.keys(CELLS).filter(k=>CELLS[k].layer===sel);\n  p.innerHTML='<p class=\"kicker\">'+L.kicker+'</p>'+\n    '<h2>'+(CELLS[sel]?CELLS[sel].n+'. ':'')+L.name+'</h2>'+\n    '<p>'+L.body+'</p><h3>What\\'s here</h3><ul>'+L.what.map(w=>'<li>'+w+'</li>').join('')+'</ul>'+\n    (here.length?'<h3>Cells and receptors in this layer</h3><div class=\"chips\">'+\n      here.map(k=>'<button class=\"chip\" data-go=\"'+k+'\">'+CELLS[k].n+'. '+CELLS[k].name+'</button>').join('')+'</div>':'')+\n    '<div class=\"clin\"><b>In the clinic</b><p>'+L.clin+'</p>'+\n      '<a class=\"src\" href=\"'+L.src[1]+'\" target=\"_blank\" rel=\"noopener\">'+L.src[0]+' &#8599;</a></div>'+\n    (CELLS[sel]?'<div class=\"chips\" style=\"margin-top:16px\"><button class=\"chip\" data-go=\"'+CELLS[sel].layer+\n      '\">← Back to '+LAYERS.find(l=>l.id===CELLS[sel].layer).name+'</button></div>':'');\n  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>pick(b.getAttribute('data-go')));\n}\n\nfunction startQuiz(){qOrder=[...QUIZ.keys()].sort(()=>Math.random()-.5);qIdx=0;qScore=0;\n  qAnswered=false;sel=null;render();buildKey();paintQuiz();}\nfunction paintQuiz(){\n  const p=document.getElementById('panel');\n  if(qIdx>=qOrder.length){\n    p.innerHTML='<p class=\"kicker\">Complete</p><h2>'+qScore+' of '+qOrder.length+'</h2><p>'+\n      (qScore===qOrder.length?'Clean sweep. Move on to building the epidermis from scratch.':\n       qScore>=qOrder.length-2?'Solid. Re-read the ones you missed in Explore mode, then move on.':\n       'Worth another pass in Explore mode before you go further — the layers are the scaffold everything else hangs on.')+\n      '</p><button class=\"act\" id=\"again\">Run it again</button>'+\n      '<div class=\"chips\" style=\"margin-top:18px\"><button class=\"chip\" id=\"backExplore\">Back to Explore</button></div>';\n    document.getElementById('again').onclick=startQuiz;\n    document.getElementById('backExplore').onclick=()=>setMode('explore');\n    return;\n  }\n  const q=QUIZ[qOrder[qIdx]];\n  p.innerHTML='<div class=\"qbox\"><p class=\"count\">Question '+(qIdx+1)+' of '+qOrder.length+'</p>'+\n    '<p class=\"prompt\">'+q.q+'</p><p class=\"hint\">Select the layer in Figure 1.</p>'+\n    '<div id=\"verdictSlot\"></div></div><p class=\"score\">Score: '+qScore+'</p>';\n}\nfunction answer(id){\n  if(qAnswered||!LAYERS.some(l=>l.id===id))return;\n  qAnswered=true;\n  const q=QUIZ[qOrder[qIdx]],right=id===q.a;\n  if(right)qScore++;\n  sel=id;render();buildKey();\n  const nm=n=>LAYERS.find(l=>l.id===n).name;\n  document.getElementById('verdictSlot').innerHTML='<div class=\"verdict '+(right?'good':'bad')+'\"><b>'+\n    (right?'Correct — '+nm(q.a):'Not quite. That was the '+nm(id)+'.')+'</b>'+\n    (right?q.why:'The answer is the <b>'+nm(q.a)+'</b>. '+q.why)+'</div>'+\n    '<button class=\"act\" id=\"next\">'+(qIdx+1<qOrder.length?'Next question':'See your score')+'</button>';\n  document.getElementById('next').onclick=()=>{qIdx++;qAnswered=false;paintQuiz();};\n  document.querySelector('.score').textContent='Score: '+qScore;\n}\n\nfunction tweenTo(target){\n  if(reduce){th=target.slice();render();return;}\n  const from=th.slice(),t0=performance.now(),dur=460;\n  (function step(now){\n    const u=Math.min(1,(now-t0)/dur),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;\n    th=from.map((v,k)=>v+(target[k]-v)*e);\n    render();\n    if(u<1)requestAnimationFrame(step);\n  })(t0);\n}\nconst CAP={\n thin:'Cross-section of thin skin, showing the epidermal strata, the papillary and reticular dermis, and the hypodermis. Dermal papillae interdigitate with the epidermis at the dermal–epidermal junction (heavy line).',\n thick:'Cross-section of thick skin from the palm or sole. The stratum corneum is markedly thickened and a stratum lucidum is present; there are no hair follicles or sebaceous glands.'};\nfunction setSkin(t){\n  thick=t;\n  thinBtn.setAttribute('aria-pressed',!t);thickBtn.setAttribute('aria-pressed',t);\n  document.getElementById('hint').textContent=t\n    ?'Palms and soles. Hairless, no sebaceous glands, dense corneum, lucidum present.'\n    :'Forearm, trunk, most of the body. Hair follicles present.';\n  document.getElementById('figcap').textContent=t?CAP.thick:CAP.thin;\n  if(sel==='lucidum'&&!t)sel='corneum';\n  tweenTo(LAYERS.map(L=>t?L.thick:L.thin));\n  buildKey();paint();setDesc();\n}\nfunction setMode(m){\n  exploreBtn.setAttribute('aria-pressed',m==='explore');\n  quizBtn.setAttribute('aria-pressed',m==='quiz');\n  if(m==='quiz'){if(!thick)setSkin(true);mode=m;startQuiz();}\n  else{mode=m;sel=sel||'corneum';render();buildKey();paint();}\n}\nthinBtn.onclick=()=>setSkin(false);\nthickBtn.onclick=()=>setSkin(true);\nexploreBtn.onclick=()=>setMode('explore');\nquizBtn.onclick=()=>setMode('quiz');\n\ndocument.getElementById('figcap').textContent=CAP.thin;\nrender();buildKey();paint();setDesc();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "strata-order": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Build the epidermis — Integumentary System</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cardinal:#C8102E; --cardinal-dk:#8E0C21; --red032:#EF3340;\n  --slide:#F5F5F5; --slide2:#E9E9E9; --bg:#F5F5F5;\n  --ink:#1A1A1A; --ink2:#333333; --muted:#666666;\n  --hema:#256C93; --blue:#4599C7; --blue-dk:#256C93;\n  --eosin:#C8102E; --eosin-soft:#E47082; --eosin-pale:#FBEAED;\n  --keratin:#D9A441; --adipose:#F8E8C2; --line:#D9D9D9;\n  --ok:#1B5E20; --ok-bg:#E8F1E9; --no:#C8102E; --no-bg:#FBEAED;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--slide);color:var(--ink);\n  font-family:Karla,\"Helvetica Neue\",Arial,sans-serif;font-size:17px;line-height:1.6}\nh1,h2,h3{font-family:\"Instrument Serif\",Georgia,serif;font-weight:400}\na{color:var(--hema)}\n:focus-visible{outline:2px solid var(--hema);outline-offset:3px;border-radius:2px}\n.wrap{max-width:960px;margin:0 auto;padding:0 24px}\n.topbar{border-bottom:1px solid var(--line)}\n.topbar .wrap{display:flex;justify-content:space-between;align-items:baseline;\n  padding:14px 24px;font-size:14px;color:var(--ink2)}\n.topbar b{color:var(--ink)}\nh1{font-size:clamp(2rem,4.6vw,3rem);margin:34px 0 6px}\n.lede{color:var(--ink2);max-width:60ch;margin:0 0 40px}\n\nsection{padding-bottom:56px}\n.head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--ink);\n  padding-bottom:8px;margin-bottom:8px}\n.head h2{font-size:1.7rem;margin:0}\n.head span{font-size:13px;color:var(--eosin)}\n.task{color:var(--ink2);font-size:15.5px;max-width:62ch;margin:0 0 22px}\n\n/* --- part 1: ordering --- */\n.orderwrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}\n.axis{display:flex;flex-direction:column;justify-content:space-between;align-items:center;\n  align-self:stretch;font-size:12px;color:var(--ink2);padding:6px 0;min-height:330px}\n.axis .rule{flex:1;width:1px;background:var(--line);margin:8px 0}\nol.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}\nli.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;\n  background:#fff;border:1px solid var(--line);padding:12px 14px;cursor:grab;\n  transition:transform .12s,border-color .15s,background .15s}\nli.row:active{cursor:grabbing}\nli.row.drag{opacity:.4}\nli.row.over{border-color:var(--eosin);background:var(--eosin-pale)}\nli.row.good{background:var(--ok-bg);border-color:var(--ok)}\nli.row.bad{background:var(--no-bg);border-color:var(--no)}\n.grip{color:#B49BAF;font-size:15px;letter-spacing:2px;line-height:1}\n.rowname{font-size:1.02rem}\n.rowname em{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:2px}\n.nudge{display:flex;gap:4px}\n.nudge button{font:inherit;font-size:13px;width:30px;height:30px;border:1px solid var(--line);\n  background:#fff;cursor:pointer;color:var(--ink2);border-radius:2px}\n.nudge button:hover{border-color:var(--hema);color:var(--hema)}\n\n/* --- part 2: sorting --- */\n.bank{display:flex;flex-wrap:wrap;gap:8px;padding:16px;border:1px dashed var(--line);\n  background:#fff;min-height:70px;margin-bottom:26px}\n.bank:empty::after{content:\"All placed. Check your work.\";color:var(--ink2);font-size:14px}\n.tile{font:inherit;font-size:14px;background:#fff;border:1px solid var(--ink);color:var(--ink);\n  padding:7px 12px;cursor:pointer;border-radius:2px;text-align:left}\n.tile:hover{background:var(--eosin-pale)}\n.tile.picked{background:var(--ink);color:#fff}\n.tile.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}\n.tile.bad{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through}\n.zones{display:flex;flex-direction:column;gap:0;border:1px solid var(--line)}\n.zone{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:14px 16px;\n  border-bottom:1px solid var(--line);background:#fff;align-items:start;cursor:pointer}\n.zone:last-child{border-bottom:0}\n.zone.armed{background:var(--eosin-pale)}\n.zone .zname{font-size:15px}\n.zone .zname em{display:block;font-style:italic;font-size:12.5px;color:var(--ink2)}\n.zone .drops{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}\n.zone .drops:empty::after{content:\"drop here\";color:#B49BAF;font-size:13px}\n.z1{border-left:5px solid #E5CDA3}.z2{border-left:5px solid #F0E2CB}\n.z3{border-left:5px solid #EDD0DC}.z4{border-left:5px solid #E2AFC6}\n.z5{border-left:5px solid #B77CAB}\n\n.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}\nbutton.act{font:inherit;font-size:15px;background:var(--ink);color:#fff;border:0;\n  padding:10px 18px;cursor:pointer;border-radius:2px}\nbutton.act:hover{background:var(--hema)}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}\nbutton.ghost:hover{background:var(--eosin-pale);color:var(--ink)}\n.result{font-size:15px;color:var(--ink2)}\n\n.note{background:var(--eosin-pale);border-left:3px solid var(--eosin);padding:14px 16px;\n  margin-top:22px;font-size:15.5px;max-width:64ch}\n.note b{display:block;font-size:13px;color:var(--eosin);margin-bottom:4px}\n.note p{margin:0 0 10px}.note p:last-child{margin:0}\n[hidden]{display:none!important}\n\nnav.pager{border-top:1px solid var(--line);padding:20px 0 60px;font-size:15px;\n  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n@media (max-width:700px){\n  .zone{grid-template-columns:1fr;gap:8px}\n  .orderwrap{grid-template-columns:1fr}\n  .axis{flex-direction:row;min-height:0;justify-content:space-between;width:100%}\n  .axis .rule{height:1px;width:auto;margin:0 10px}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\n.beyond{border-top:2px solid var(--hema);padding-top:18px;margin-top:48px}\n.beyond h2{font-size:1.5rem;margin:0 0 4px}\n.beyond .intro{font-size:15px;color:var(--ink2);max-width:66ch;margin:0 0 18px}\nul.srcs{list-style:none;margin:0;padding:0}\nul.srcs li{border-bottom:1px solid var(--line);padding:13px 2px;display:grid;\n  grid-template-columns:1fr auto;gap:20px;align-items:baseline}\nul.srcs li:last-child{border-bottom:0}\nul.srcs .claim{font-size:15.5px;max-width:60ch}\nul.srcs .claim em{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:2px}\nul.srcs a{font-size:14px}\na.src{display:inline-block;margin-top:8px;font-size:13px;color:var(--hema);\n  text-decoration:none;border-bottom:1px solid var(--line)}\na.src:hover{border-bottom-color:var(--hema)}\n@media (max-width:640px){ul.srcs li{grid-template-columns:1fr;gap:6px}}\n\n/* ================= NCC DPT brand ================= */\nbody,h1,h2,h3,.clock,.score,.depth,.num,.mark,.qbox .prompt,.stem,.rowname,.zname{\n  font-family:Calibri,Carlito,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\nh1,h2,h3{font-weight:700;letter-spacing:0}\nh1{color:var(--cardinal);font-size:30px}\nh2{color:var(--cardinal)}\n.beyond h2{color:var(--blue-dk)}\n.beyond{border-top:4px solid var(--blue-dk)}\n.depth{color:var(--cardinal);font-weight:700}\n.score{font-weight:700;color:var(--cardinal)}\n.brandbar{background:var(--cardinal);color:#fff}\n.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;\n  padding:9px 24px;font-size:13px;flex-wrap:wrap;max-width:1140px}\n.brandbar .mark{font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.brandbar .mark span{font-weight:400;text-transform:none;letter-spacing:0;opacity:.92}\n.topbar{background:#fff;border-bottom:1px solid var(--line)}\n.topbar b{color:var(--cardinal)}\n.topbar a{color:var(--blue-dk)}\n.head{border-bottom:3px solid var(--cardinal)}\n.head span{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}\nbutton.act,a.act{background:var(--cardinal);font-weight:700;border-radius:0}\nbutton.act:hover,a.act:hover{background:var(--cardinal-dk);color:#fff}\nbutton.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}\nbutton.ghost:hover{background:var(--eosin-pale);color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{background:var(--cardinal);color:#fff;font-weight:700}\n.tile,.opt,.chip{border-radius:0}\n.note b.h,.note b{color:var(--cardinal)}\na.src{color:var(--blue-dk);border-bottom-color:var(--blue)}\n.panel h2,.card h3{letter-spacing:0}\n/* ---- figures ---- */\nfigure{margin:26px 0 0;background:#fff;border:1px solid var(--line)}\n.figscroll{overflow-x:auto}\n.figscroll svg{min-width:560px}\n\nfigure svg{display:block;width:100%;height:auto}\nfigcaption{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;\n  color:var(--ink2);line-height:1.45}\nfigcaption .num{color:var(--cardinal);font-weight:700}\nfigcaption .src{display:block;margin-top:4px;font-size:11px;color:var(--muted)}\n.svgtxt{font-family:Calibri,Carlito,\"Segoe UI\",Arial,sans-serif}\n.figlead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);\n  margin:34px 0 0;font-weight:700}\n\ndetails.figdesc{border-top:1px solid var(--line);background:#FCFCFC}\ndetails.figdesc summary{cursor:pointer;padding:9px 14px;font-size:12px;color:var(--blue-dk);list-style:none}\ndetails.figdesc summary::-webkit-details-marker{display:none}\ndetails.figdesc summary::before{content:\"\\25B8  \"}\ndetails.figdesc[open] summary::before{content:\"\\25BE  \"}\ndetails.figdesc .body{padding:0 14px 14px;font-size:13px;color:var(--ink2);max-width:72ch}\ndetails.figdesc .body p{margin:0 0 9px}\ndetails.figdesc .body p:last-child{margin:0}\n</style>\n</head>\n<body>\n\n<div class=\"brandbar\"><div class=\"wrap\">\n  <span class=\"mark\">North Central College <span>&#183; Doctor of Physical Therapy</span></span>\n  <span>DPTD 733 &#183; Foundational Movement Science III</span>\n</div></div>\n<div class=\"topbar\"><div class=\"wrap\">\n  <span><b>Module 2</b> · Build the epidermis</span>\n  <a href=\"index.html\">All modules</a>\n</div></div>\n\n<div class=\"wrap\">\n  <h1>Build the epidermis</h1>\n  <p class=\"lede\">Two exercises. Get the strata in order first, then work out what actually happens in each one. Thick skin is assumed throughout, so all five layers are in play.</p>\n</div>\n\n<main class=\"wrap\">\n\n<section>\n  <div class=\"head\"><h2>Order the strata</h2><span>Part one</span></div>\n  <p class=\"task\">Drag the layers into order, superficial at the top and deep at the bottom. On a phone or with a keyboard, use the arrow buttons instead.</p>\n\n  <div class=\"orderwrap\">\n    <div class=\"axis\"><span>Surface</span><span class=\"rule\"></span><span>Dermis</span></div>\n    <ol class=\"order\" id=\"orderList\"></ol>\n  </div>\n\n  <div class=\"actions\">\n    <button class=\"act\" id=\"checkOrder\">Check the order</button>\n    <button class=\"act ghost\" id=\"resetOrder\">Shuffle again</button>\n    <span class=\"result\" id=\"orderResult\"></span>\n  </div>\n\n  <div class=\"note\" id=\"orderNote\" hidden></div>\n</section>\n\n<section>\n  <div class=\"head\"><h2>Put the features where they belong</h2><span>Part two</span></div>\n  <p class=\"task\">Tap a feature, then tap the layer it belongs to. Tap a placed feature to send it back. Some layers take more than one.</p>\n\n  <div class=\"bank\" id=\"bank\"></div>\n\n  <div class=\"zones\" id=\"zones\">\n    <div class=\"zone z1\" data-z=\"corneum\"><div class=\"zname\">Stratum corneum<em>outermost</em></div><div class=\"drops\" data-drops=\"corneum\"></div></div>\n    <div class=\"zone z2\" data-z=\"lucidum\"><div class=\"zname\">Stratum lucidum<em>thick skin only</em></div><div class=\"drops\" data-drops=\"lucidum\"></div></div>\n    <div class=\"zone z3\" data-z=\"granulosum\"><div class=\"zname\">Stratum granulosum</div><div class=\"drops\" data-drops=\"granulosum\"></div></div>\n    <div class=\"zone z4\" data-z=\"spinosum\"><div class=\"zname\">Stratum spinosum</div><div class=\"drops\" data-drops=\"spinosum\"></div></div>\n    <div class=\"zone z5\" data-z=\"basale\"><div class=\"zname\">Stratum basale<em>deepest</em></div><div class=\"drops\" data-drops=\"basale\"></div></div>\n  </div>\n\n  <div class=\"actions\">\n    <button class=\"act\" id=\"checkSort\">Check my answers</button>\n    <button class=\"act ghost\" id=\"resetSort\">Start over</button>\n    <span class=\"result\" id=\"sortResult\"></span>\n  </div>\n\n  <div class=\"note\" id=\"sortNote\" hidden></div>\n</section>\n\n</main>\n\n\n\n<section class=\"wrap\">\n  <p class=\"figlead\">Reference figure</p>\n  <figure>\n    <div class=\"figscroll\">\n    <svg viewBox=\"0 0 660 330\" class=\"svgtxt\" role=\"img\" aria-describedby=\"figdesc1\"\n         aria-label=\"Labelled diagram of the five epidermal strata with their resident cells\">\n      <!-- bands -->\n      <rect x=\"70\" y=\"34\" width=\"320\" height=\"46\" fill=\"#F3E4CE\" stroke=\"#B07C8C\"/>\n      <rect x=\"70\" y=\"80\" width=\"320\" height=\"20\" fill=\"#FAF2E5\" stroke=\"#B07C8C\"/>\n      <rect x=\"70\" y=\"100\" width=\"320\" height=\"30\" fill=\"#EFCBD3\" stroke=\"#B07C8C\"/>\n      <rect x=\"70\" y=\"130\" width=\"320\" height=\"74\" fill=\"#E7AFBD\" stroke=\"#B07C8C\"/>\n      <rect x=\"70\" y=\"204\" width=\"320\" height=\"30\" fill=\"#D98CA0\" stroke=\"#B07C8C\"/>\n      <rect x=\"70\" y=\"234\" width=\"320\" height=\"70\" fill=\"#F6D3DA\" stroke=\"#B07C8C\"/>\n      <!-- corneum lamellae -->\n      <g stroke=\"#DFC7A6\" stroke-width=\"1\">\n        <path d=\"M70 43 H390\"/><path d=\"M70 52 H390\"/><path d=\"M70 61 H390\"/><path d=\"M70 70 H390\"/>\n      </g>\n      <!-- granular cells -->\n      <g>\n        <ellipse cx=\"100\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n        <ellipse cx=\"140\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n        <ellipse cx=\"180\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n        <ellipse cx=\"220\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n        <ellipse cx=\"260\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n        <ellipse cx=\"300\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n        <ellipse cx=\"340\" cy=\"115\" rx=\"8\" ry=\"4\" fill=\"#E9BDC8\" stroke=\"#D89AA9\"/>\n      </g>\n      <!-- prickle cells -->\n      <g fill=\"#E9B9C6\" stroke=\"#CE8DA0\" stroke-width=\".9\">\n        <polygon points=\"92,148 96,142 104,142 108,148 104,154 96,154\"/>\n        <polygon points=\"122,148 126,142 134,142 138,148 134,154 126,154\"/>\n        <polygon points=\"182,148 186,142 194,142 198,148 194,154 186,154\"/>\n        <polygon points=\"212,148 216,142 224,142 228,148 224,154 216,154\"/>\n        <polygon points=\"302,148 306,142 314,142 318,148 314,154 306,154\"/>\n        <polygon points=\"107,178 111,172 119,172 123,178 119,184 111,184\"/>\n        <polygon points=\"167,178 171,172 179,172 183,178 179,184 171,184\"/>\n        <polygon points=\"257,178 261,172 269,172 273,178 269,184 261,184\"/>\n        <polygon points=\"317,178 321,172 329,172 333,178 329,184 321,184\"/>\n      </g>\n      <!-- basal columnar cells -->\n      <g stroke=\"#C07188\" stroke-width=\".9\">\n        <path d=\"M82 204 V234\"/><path d=\"M94 204 V234\"/><path d=\"M106 204 V234\"/><path d=\"M118 204 V234\"/>\n        <path d=\"M130 204 V234\"/><path d=\"M142 204 V234\"/><path d=\"M154 204 V234\"/><path d=\"M166 204 V234\"/>\n        <path d=\"M178 204 V234\"/><path d=\"M190 204 V234\"/><path d=\"M202 204 V234\"/><path d=\"M214 204 V234\"/>\n        <path d=\"M226 204 V234\"/><path d=\"M238 204 V234\"/><path d=\"M250 204 V234\"/><path d=\"M262 204 V234\"/>\n        <path d=\"M274 204 V234\"/><path d=\"M286 204 V234\"/><path d=\"M298 204 V234\"/><path d=\"M310 204 V234\"/>\n        <path d=\"M322 204 V234\"/><path d=\"M334 204 V234\"/><path d=\"M346 204 V234\"/><path d=\"M358 204 V234\"/>\n        <path d=\"M370 204 V234\"/><path d=\"M382 204 V234\"/>\n      </g>\n      <!-- basement membrane -->\n      <path d=\"M70 234 H390\" stroke=\"#8E0C21\" stroke-width=\"2.4\" fill=\"none\"/>\n      <!-- collagen in dermis -->\n      <g stroke=\"#DE93A5\" stroke-width=\"1.4\" fill=\"none\" opacity=\".9\">\n        <path d=\"M84 252 q14 -6 30 0\"/><path d=\"M140 264 q14 6 30 0\"/><path d=\"M200 250 q14 -6 30 0\"/>\n        <path d=\"M254 272 q14 -6 30 0\"/><path d=\"M310 258 q14 6 30 0\"/><path d=\"M110 284 q14 -6 30 0\"/>\n        <path d=\"M232 288 q14 6 30 0\"/><path d=\"M330 286 q14 -6 30 0\"/>\n      </g>\n      <!-- resident cells -->\n      <g transform=\"translate(150,219)\">\n        <g stroke=\"#5A3242\" stroke-width=\"1.6\" fill=\"none\"><circle r=\"4.5\" fill=\"#5A3242\"/>\n        <path d=\"M0 -4.5 L-4 -12 M4 -3 L11 -7 M4 3 L10 8 M-4 3 L-10 8 M-4 -3 L-11 -6\"/></g></g>\n      <g transform=\"translate(268,219)\"><circle r=\"4.5\" fill=\"#256C93\"/>\n        <path d=\"M0 4.5 L0 13\" stroke=\"#256C93\" stroke-width=\"2\"/>\n        <path d=\"M-4 13 L4 13\" stroke=\"#256C93\" stroke-width=\"2\"/></g>\n      <g transform=\"translate(245,163)\" stroke=\"#1B5E20\" stroke-width=\"1.5\" fill=\"none\">\n        <circle r=\"4\" fill=\"#1B5E20\"/>\n        <path d=\"M0 -4 L0 -11 M3.6 -2 L10 -6 M4 2 L11 5 M-3.6 -2 L-10 -6 M-4 2 L-11 5 M0 4 L0 11\"/></g>\n      <!-- migration arrow -->\n      <path d=\"M40 300 V52\" stroke=\"#C8102E\" stroke-width=\"2\" fill=\"none\"/>\n      <polygon points=\"36,52 44,52 40,38\" fill=\"#C8102E\"/>\n      <text x=\"26\" y=\"176\" font-size=\"11.5\" fill=\"#C8102E\" text-anchor=\"middle\"\n            transform=\"rotate(-90 26 176)\">~14 days to the corneum</text>\n      <!-- bracket -->\n      <path d=\"M65 34 H56 V234 H65\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.3\"/>\n      <text x=\"49\" y=\"134\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\"\n            transform=\"rotate(-90 49 134)\">Epidermis</text>\n      <!-- labels -->\n      <g font-size=\"12.5\" fill=\"#333\">\n        <path d=\"M 392 57 L 414 50 L 424 50\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"57\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"54\">Stratum corneum</text>\n        <path d=\"M 392 90 L 414 84 L 424 84\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"90\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"88\">Stratum lucidum</text>\n        <text x=\"430\" y=\"101\" font-size=\"10.5\" fill=\"#666\">thick skin only</text>\n        <path d=\"M 392 115 L 414 118 L 424 118\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"115\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"122\">Stratum granulosum</text>\n        <path d=\"M 392 167 L 414 152 L 424 152\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"167\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"156\">Stratum spinosum</text>\n        <path d=\"M 392 219 L 414 186 L 424 186\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"219\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"190\">Stratum basale</text>\n        <path d=\"M 392 234 L 414 214 L 424 214\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"234\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"218\" fill=\"#8E0C21\">Basement membrane</text>\n        <path d=\"M 392 270 L 414 248 L 424 248\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"392\" cy=\"270\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"430\" y=\"252\">Papillary dermis</text>\n        <path d=\"M 154 219 L 300 320 L 320 320\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"154\" cy=\"219\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"326\" y=\"324\" font-size=\"11.5\">Melanocyte</text>\n        <path d=\"M 272 219 L 300 300 L 320 300\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"272\" cy=\"219\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"326\" y=\"304\" font-size=\"11.5\">Merkel cell</text>\n        <path d=\"M 249 163 L 300 280 L 320 280\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1\"/><circle cx=\"249\" cy=\"163\" r=\"2.3\" fill=\"#8A8A8A\"/><text x=\"326\" y=\"284\" font-size=\"11.5\">Langerhans cell</text>\n      </g>\n    </svg>\n    </div>\n    <figcaption><span class=\"num\">Figure 1.</span> The epidermal strata, superficial to deep, with their resident non-keratinocyte cells. Keratinocytes are generated in the stratum basale and migrate outward, flattening and losing their nuclei, before being shed from the stratum corneum.\n      <span class=\"src\">Schematic; not to scale. Prepared for DPTD 733.</span></figcaption>\n<details class=\"figdesc\"><summary>Text description of Figure 1</summary><div class=\"body\" id=\"figdesc1\"><p>A vertical cross-section of the epidermis, surface at the top, drawn as six stacked horizontal bands with a bracket on the left marking the top five as the epidermis.</p><p>From top to bottom the bands are: the stratum corneum, a pale tan band crossed by fine horizontal lines representing stacked flattened dead cells; the stratum lucidum, a very thin near-white band labelled thick skin only; the stratum granulosum, a narrow pink band containing a row of small flattened oval cells, each with two dark granules; the stratum spinosum, a wider mid-pink band containing scattered six-sided polygonal cells with dark central nuclei; and the stratum basale, a deep pink band drawn as a single row of tall narrow columnar cells with oval nuclei.</p><p>A heavy dark red horizontal line separates the stratum basale from the band below it and is labelled basement membrane. Beneath it is the papillary dermis, a pale pink band containing short curved strokes representing loose collagen fibres.</p><p>Three non-keratinocyte cells are marked and labelled with leader lines. A melanocyte, drawn as a dark star-shaped cell with radiating processes, sits in the stratum basale. A Merkel cell, a small blue disc with a short nerve fibre descending from it, also sits in the stratum basale. A Langerhans cell, a green star-shaped cell with processes radiating in all directions, sits higher up in the stratum spinosum.</p><p>On the far left, a red arrow runs from the basement membrane upward to the top of the stratum corneum, labelled approximately 14 days to the corneum. It shows the direction keratinocytes travel: they are generated at the bottom and move outward, flattening and losing their nuclei as they go, before being shed from the surface.</p></div></details>\n  </figure>\n</section>\n\n<section class=\"wrap beyond\">\n  <h2>Beyond the handout</h2>\n  <p class=\"intro\">Two claims in this module go past the handout. Both are worth reading properly, because the rest of wound care is built on them.</p>\n  <ul class=\"srcs\">\n    <li><span class=\"claim\">Roughly 14 days from basale to corneum, and another 14 in the corneum before shedding<em>The handout gives the diagram; this gives the timing and the mechanism</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470464/\" target=\"_blank\" rel=\"noopener\">Anatomy, Skin: Epidermis (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Barrier lipids, transepidermal water loss, and why emollients work<em>Behind the stratum granulosum explanation</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK537325/\" target=\"_blank\" rel=\"noopener\">Histology, Skin (StatPearls) &#8599;</a></li>\n    <li><span class=\"claim\">Why survival of the stratum basale decides how a wound closes<em>Behind the closing note on Part two</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK470443/\" target=\"_blank\" rel=\"noopener\">Wound Healing Phases (StatPearls) &#8599;</a></li>\n  </ul>\n</section>\n\n<nav class=\"wrap pager\">\n  <a href=\"layers.html\">← Cross-section explorer</a>\n  <a href=\"sensation.html\">Next: Receptors and depth →</a>\n</nav>\n\n<script>\n/* ============ Part 1 ============ */\nconst STRATA=[\n  {id:'corneum',name:'Stratum corneum',sub:'Dead, flattened, keratin-filled cells in a lipid matrix'},\n  {id:'lucidum',name:'Stratum lucidum',sub:'A thin band of flat, clear cells'},\n  {id:'granulosum',name:'Stratum granulosum',sub:'Cells flatten and release waterproofing lipids'},\n  {id:'spinosum',name:'Stratum spinosum',sub:'Maturing keratinocytes bound by desmosomes'},\n  {id:'basale',name:'Stratum basale',sub:'Mitosis, melanocytes, Merkel cells'}\n];\nconst CORRECT=STRATA.map(s=>s.id);\nlet order=[];\n\nfunction shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}\n\nfunction drawOrder(){\n  const ul=document.getElementById('orderList'); ul.innerHTML='';\n  order.forEach((id,i)=>{\n    const s=STRATA.find(x=>x.id===id);\n    const li=document.createElement('li');\n    li.className='row'; li.draggable=true; li.dataset.id=id;\n    li.innerHTML=`<span class=\"grip\" aria-hidden=\"true\">⣿</span>\n      <span class=\"rowname\">${s.name}<em>${s.sub}</em></span>\n      <span class=\"nudge\">\n        <button aria-label=\"Move ${s.name} up\"${i===0?' disabled':''} data-mv=\"-1\">↑</button>\n        <button aria-label=\"Move ${s.name} down\"${i===order.length-1?' disabled':''} data-mv=\"1\">↓</button>\n      </span>`;\n    li.querySelectorAll('[data-mv]').forEach(b=>b.onclick=e=>{\n      e.stopPropagation();\n      const d=+b.dataset.mv, j=i+d;\n      if(j<0||j>=order.length) return;\n      [order[i],order[j]]=[order[j],order[i]];\n      drawOrder(); clearOrderCheck();\n    });\n    li.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',id);li.classList.add('drag');});\n    li.addEventListener('dragend',()=>{li.classList.remove('drag');document.querySelectorAll('.row').forEach(r=>r.classList.remove('over'));});\n    li.addEventListener('dragover',e=>{e.preventDefault();li.classList.add('over');});\n    li.addEventListener('dragleave',()=>li.classList.remove('over'));\n    li.addEventListener('drop',e=>{\n      e.preventDefault(); li.classList.remove('over');\n      const from=order.indexOf(e.dataTransfer.getData('text/plain')), to=order.indexOf(id);\n      if(from<0||from===to) return;\n      order.splice(to,0,order.splice(from,1)[0]);\n      drawOrder(); clearOrderCheck();\n    });\n    ul.appendChild(li);\n  });\n}\nfunction clearOrderCheck(){\n  document.getElementById('orderResult').textContent='';\n  document.getElementById('orderNote').hidden=true;\n}\ndocument.getElementById('checkOrder').onclick=()=>{\n  let n=0;\n  document.querySelectorAll('#orderList .row').forEach((li,i)=>{\n    const right=order[i]===CORRECT[i];\n    li.classList.toggle('good',right); li.classList.toggle('bad',!right);\n    if(right) n++;\n  });\n  document.getElementById('orderResult').textContent=`${n} of 5 in the right position.`;\n  const note=document.getElementById('orderNote');\n  note.hidden=false;\n  note.innerHTML = n===5\n    ? `<b>Correct</b><p>Superficial to deep: corneum, lucidum, granulosum, spinosum, basale. Read it the other way and it becomes a story rather than a list — a cell is born in the <b>basale</b>, matures and builds keratin in the <b>spinosum</b>, dumps its lipids and gives up its nucleus in the <b>granulosum</b>, passes through the <b>lucidum</b> if it happens to be on a palm or sole, and spends its last two weeks as barrier in the <b>corneum</b> before it is shed.</p><p>Roughly 14 days basale to corneum, and another 14 in the corneum before shedding.</p>`\n    : `<b>Correct order, superficial to deep</b><p>Corneum → lucidum → granulosum → spinosum → basale.</p><p>If the mnemonics keep sliding away, use the cell's life story instead: born in the <b>basale</b>, builds keratin in the <b>spinosum</b>, releases lipids and loses its nucleus in the <b>granulosum</b>, passes through the <b>lucidum</b> only on palms and soles, and finishes as barrier in the <b>corneum</b>. Direction of travel is always outward.</p>`;\n};\ndocument.getElementById('resetOrder').onclick=()=>{\n  do { order=shuffle(CORRECT); } while(order.join()===CORRECT.join());\n  drawOrder(); clearOrderCheck();\n};\n\n/* ============ Part 2 ============ */\nconst FEATURES=[\n  {t:'Melanocytes produce melanin here',z:'basale'},\n  {t:'Merkel cells sit at this level',z:'basale'},\n  {t:'Mitosis — new keratinocytes are generated',z:'basale'},\n  {t:'Hemidesmosomes anchor to the basement membrane',z:'basale'},\n  {t:'Langerhans cells patrol here',z:'spinosum'},\n  {t:'Desmosomes bind neighbouring keratinocytes',z:'spinosum'},\n  {t:'Lipids are released to waterproof the skin',z:'granulosum'},\n  {t:'Cells flatten and lose nuclei and organelles',z:'granulosum'},\n  {t:'Found only on palms and soles',z:'lucidum'},\n  {t:'Dead cells shed and continuously replaced',z:'corneum'}\n];\nlet placed={}, picked=null, checked=false;\n\nfunction resetSort(){\n  placed={}; picked=null; checked=false;\n  FEATURES.forEach((f,i)=>placed[i]=null);\n  document.getElementById('sortResult').textContent='';\n  document.getElementById('sortNote').hidden=true;\n  drawSort();\n}\nfunction drawSort(){\n  const bank=document.getElementById('bank'); bank.innerHTML='';\n  document.querySelectorAll('[data-drops]').forEach(d=>d.innerHTML='');\n  FEATURES.forEach((f,i)=>{\n    const b=document.createElement('button');\n    b.className='tile'; b.textContent=f.t; b.dataset.i=i;\n    if(checked && placed[i]!==null) b.classList.add(placed[i]===f.z?'good':'bad');\n    if(picked===i) b.classList.add('picked');\n    b.onclick=e=>{\n      e.stopPropagation();\n      if(checked) return;\n      if(placed[i]!==null){ placed[i]=null; picked=null; }\n      else picked = picked===i ? null : i;\n      drawSort();\n    };\n    if(placed[i]===null) bank.appendChild(b);\n    else document.querySelector(`[data-drops=\"${placed[i]}\"]`).appendChild(b);\n  });\n  document.querySelectorAll('.zone').forEach(z=>{\n    z.classList.t
