span class=\"claim\">Vitamin D, sweat glands and skin physiology in general<em>Questions 5 and 14</em></span><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK441980/\" target=\"_blank\" rel=\"noopener\">Anatomy, Skin (StatPearls) &#8599;</a></li>\n  </ul>\n</section>\n\n<nav class=\"wrap pager\">\n  <a href=\"healing.html\">← Wound healing timeline</a>\n  <a href=\"index.html\">All modules</a>\n</nav>\n\n<script>\nconst Q=[\n{case:'An 86-year-old on your caseload sustains a skin tear on the forearm during a bed-to-chair transfer, despite reasonable technique.',\n q:'Which age-related structural change best explains why her skin tore rather than stretched?',\n opts:['Reduced melanocyte number in the stratum basale',\n       'Flattening of the dermal papillae at the dermal–epidermal junction',\n       'Thickening of the stratum corneum',\n       'Increased sebaceous gland activity'],\n a:1,\n why:'The dermal papillae interlock the papillary dermis with the epidermis, and that interlock is a mechanical anti-shear device. With age the junction flattens, so shear separates the two layers instead of being resisted by them. This is the anatomy behind skin tear prevention: minimise shear and friction during transfers, use sleeve protection, and avoid aggressive adhesive removal.',\n trap:'Melanocyte loss is real with age, but it changes pigmentation and UV protection, not mechanical integrity.'},\n\n{case:'A plantar heel wound in a patient with diabetes has not changed in size over six weeks. The bed carries adherent yellow slough, edges are rolled, and there is low-level erythema and drainage that is neither increasing nor decreasing.',\n q:'Which phase of healing is this wound most likely stuck in?',\n opts:['Hemostasis','Inflammation','Proliferation','Maturation'],\n a:1,\n why:'Chronic wounds characteristically stall in inflammation. Necrotic tissue and biofilm keep supplying an inflammatory stimulus, macrophages never give the signal to move on, fibroblasts are never properly recruited, and proliferation never starts. Debridement helps precisely because it removes the stimulus holding the wound in place.',\n trap:'A stalled wound is not a wound in maturation. Maturation happens after closure; a wound that is still open and unchanged has not reached it.'},\n\n{case:'A wound that measured 4 cm across three weeks ago now measures 2.5 cm, with healthy granulation and advancing edges.',\n q:'Which cell is most directly responsible for the reduction in wound size?',\n opts:['Keratinocyte','Macrophage','Myofibroblast','Neutrophil'],\n a:2,\n why:'Myofibroblasts are differentiated fibroblasts with contractile capability. They draw the wound edges inward, physically shrinking the defect during proliferation. Keratinocytes resurface the wound but do not pull the edges together.',\n trap:'Contraction is useful in an open wound and dangerous across a joint. The same cell that closes the wound produces the contracture you then have to treat, which is why positioning and stretch start during proliferation rather than after it.'},\n\n{case:'Five days after an elective knee arthroplasty, the incision is warm, pink at the margins, mildly swollen, and producing a small amount of serosanguinous drainage that has decreased since yesterday. The patient is afebrile.',\n q:'What is the most appropriate response?',\n opts:['Hold therapy and request an urgent infection workup',\n       'Recognise this as expected inflammation, continue the plan, and track the trajectory',\n       'Begin aggressive scar mobilization over the incision',\n       'Apply a dry dressing and leave the wound uncovered between sessions'],\n a:1,\n why:'Redness, heat and swelling are the defining features of a normal inflammatory phase, and at day five that is exactly where the tissue should be. The discriminator between expected inflammation and infection is direction: expected inflammation peaks then recedes, and drainage decreases. This one is decreasing.',\n trap:'Scar mobilization over a five-day-old incision is far too early. Wait for the tissue to have something to remodel.'},\n\n{case:'A patient who is largely housebound asks why her physician checked her vitamin D.',\n q:'What does the skin actually contribute to vitamin D status?',\n opts:['It absorbs dietary vitamin D through the stratum corneum',\n       'It synthesises vitamin D on exposure to UVB radiation',\n       'It stores vitamin D in the hypodermal adipose tissue for later release',\n       'It converts vitamin D to its active form in the sebaceous glands'],\n a:1,\n why:'UVB exposure drives cutaneous vitamin D synthesis, and that vitamin D supports calcium and phosphorus absorption in the gut. For a housebound patient, that pathway is largely switched off — which links skin physiology directly to bone density and fall-related fracture risk.',\n trap:'Adipose tissue does sequester vitamin D, but the question asks what the skin contributes. Synthesis is the answer.'},\n\n{case:'A patient with long-standing type 2 diabetes has dry, fissured plantar skin. He reports his feet \"never sweat any more.\"',\n q:'Why does the loss of sweating matter more on the sole than on the forearm?',\n opts:['The sole has no free nerve endings, so fissures go unnoticed',\n       'Thick skin has no sebaceous glands, so it depends entirely on eccrine sweat for surface moisture',\n       'The sole has a thinner stratum corneum and dries out faster',\n       'Apocrine glands on the sole are the main source of plantar moisture'],\n a:1,\n why:'Thick skin is hairless and has no pilosebaceous units, so there is no sebum to fall back on. When autonomic neuropathy takes out the eccrine glands, plantar skin has nothing maintaining its surface moisture, and it cracks. Those fissures are a common entry point for the infection that starts a diabetic foot ulcer.',\n trap:'Anhidrosis is an autonomic sign. Assume sensory involvement too, and screen for it.'},\n\n{case:'You are comparing two wounds of similar surface area: one is a superficial partial-thickness abrasion, the other a full-thickness pressure injury.',\n q:'Which structural difference best explains why the abrasion resurfaces so much faster?',\n opts:['The abrasion has a larger blood supply at its base',\n       'The abrasion spares the stratum basale and the epidermal appendages, so epithelium spreads from islands across the whole bed',\n       'Full-thickness wounds cannot form granulation tissue',\n       'The abrasion has fewer myofibroblasts and therefore contracts less'],\n a:1,\n why:'Hair follicles and gland ducts are epidermal downgrowths, so their linings hold keratinocytes. When the basale and those appendages survive, new epithelium spreads outward from dozens of islands simultaneously. Destroy them and resurfacing has to advance from the wound margins alone — slowly, or not without a graft.',\n trap:'Full-thickness wounds absolutely form granulation tissue. What they lack is the internal source of epithelium.'},\n\n{case:'You are assessing a patient with deeply pigmented skin for early pressure damage over the sacrum.',\n q:'What is the most reliable approach?',\n opts:['Rely on blanching erythema, which appears identically across skin tones',\n       'Assess for localised changes in temperature, tissue firmness and reported pain alongside any colour change',\n       'Assume pressure damage cannot be detected until the skin breaks',\n       'Use capillary refill at the fingertip as a proxy for sacral perfusion'],\n a:1,\n why:'Melanin in the stratum basale absorbs and scatters light, so erythema is far harder to see in darker skin and blanching response is unreliable. Standard practice is to add temperature change, boggy or firm tissue, and patient-reported pain to the assessment rather than depending on colour. Missing early damage in darker skin is a well documented and consequential disparity.',\n trap:'Deep tissue injury begins at the bone–muscle interface and works outward, so surface appearance lags the actual damage regardless of skin tone.'},\n\n{case:'A patient develops goosebumps when a cold draft reaches the treatment plinth.',\n q:'Which structure produced that, and under what innervation?',\n opts:['Arrector pili muscle, sympathetic innervation',\n       'Arrector pili muscle, parasympathetic innervation',\n       'Eccrine sweat gland, somatic innervation',\n       'Dermal papilla, sympathetic innervation'],\n a:0,\n why:'The arrector pili is smooth muscle running from the hair follicle to the papillary dermis, innervated by sympathetic fibres. It is a useful reminder that skin has a motor output as well as a sensory one, and that eccrine sweat glands share the same sympathetic supply.',\n trap:'Piloerection in response to emotion, not temperature, is the same pathway. It is a sympathetic readout you can sometimes observe.'},\n\n{case:'A chronic sacral wound probes 3 cm beyond the visible wound margin at the 3 o\\'clock position.',\n q:'Through which layer is that undermining tracking?',\n opts:['Stratum spinosum','Papillary dermis','Reticular dermis','Hypodermis'],\n a:3,\n why:'The hypodermis is loose connective tissue and adipose, which offers little resistance to a tracking wound. Undermining and tunnelling spread through this plane. It is also the layer whose padding, when lost over the sacrum, allowed the pressure injury in the first place.',\n trap:'Undermining changes the wound you are actually treating. Measure and document it, because surface area alone understates the defect.'},\n\n{case:'A patient one year out from a forearm laceration repair asks whether the scar is \"back to normal\".',\n q:'What is the most accurate answer regarding tensile strength?',\n opts:['It has returned to approximately 100% of original strength',\n       'It plateaus at approximately 80% of original strength',\n       'It plateaus at approximately 50% of original strength',\n       'It continues to increase indefinitely and will exceed original strength'],\n a:1,\n why:'Even at the peak of maturation, repaired tissue reaches only about 80% of the original skin\\'s tensile strength. Collagen realigns along lines of tension and gets substantially stronger, but the architecture is never fully restored.',\n trap:'Worth saying out loud to patients rather than letting them find out. Return-to-activity conversations should be built around a ceiling, not a full recovery.'},\n\n{case:'On examination you notice a transverse ridge crossing the fingernail roughly 6 mm distal to the cuticle. The patient has no memory of anything significant happening recently.',\n q:'Assuming fingernails grow around 3 mm per month, roughly when did the insult occur?',\n opts:['About two weeks ago','About two months ago','About six months ago','About a year ago'],\n a:1,\n why:'Beau\\'s lines are growth arrest lines laid down when nail matrix activity is interrupted — severe systemic illness, zinc deficiency, chemotherapy. At roughly 3 mm of growth per month, a ridge 6 mm from the cuticle dates the insult to about two months ago. That estimate is occasionally the detail that makes a vague history concrete.',\n trap:'Toenails grow far more slowly, around 1 to 2 mm a month, so the same arithmetic gives a very different date.'},\n\n{case:'You are setting up TENS for a patient with persistent post-surgical pain over the anterior knee.',\n q:'What is the anatomical basis for the modality working through the skin at all?',\n opts:['The stratum corneum conducts current directly to the spinal cord',\n       'The skin is densely innervated, and stimulating cutaneous afferents modulates the transmission of pain signals',\n       'Current is absorbed by sebaceous glands and released into the dermal circulation',\n       'Melanocytes act as electrical conductors within the epidermis'],\n a:1,\n why:'The skin carries a dense population of sensory endings, and TENS works by driving those cutaneous afferents to modulate pain transmission. Understanding what is under the electrode — receptor type, depth, dermatomal supply — is what turns electrode placement into a reasoned decision rather than a habit.',\n trap:'The stratum corneum is a barrier, including an electrical one. Skin preparation and coupling matter for exactly that reason.'},\n\n{case:'A patient training in the heat asks which glands are doing the work of keeping her cool.',\n q:'Which is correct?',\n opts:['Apocrine glands, because their secretion is richer and evaporates faster',\n       'Eccrine glands, distributed over almost the whole body and producing watery sweat that cools by evaporation',\n       'Sebaceous glands, which release sebum that carries heat away',\n       'Both apocrine and sebaceous glands contribute equally'],\n a:1,\n why:'Eccrine glands are the thermoregulatory system. They are found almost everywhere, open directly onto the surface through pores, and produce a watery sweat that cools by evaporation. Apocrine glands are confined largely to axilla and groin and produce a thick secretion whose bacterial breakdown makes body odour.',\n trap:'Vasodilation of the dermal vessels works alongside sweating. Sweat carries heat away by evaporation, and increased cutaneous blood flow delivers the heat to the surface in the first place.'},\n\n{case:'Four weeks after a surgical incision, the scar is red, slightly raised, and firmly adherent to the tissue beneath. The wound is fully closed.',\n q:'What is the most appropriate intervention at this point?',\n opts:['Wait a further three months before touching the scar',\n       'Begin scar mobilization and progressive controlled loading, with education on continuing for months',\n       'Apply sustained aggressive cross-friction until the scar blanches',\n       'Avoid loading the tissue entirely until the redness resolves'],\n a:1,\n why:'At four weeks the wound is closed and in maturation. Collagen is being replaced and realigned along lines of tension, and controlled loading is what supplies those lines. This is the window where intervention shapes the final tissue — but the window stays open for a year or more, and the patient will be discharged long before it closes. The education is the durable part of the treatment.',\n trap:'Waiting for the redness to resolve wastes the most responsive period of remodeling. Redness in a closed scar at four weeks is expected, not a reason to hold off.'}\n];\n\n\n/* Source for each item that goes beyond the DPTD 733 handout */\nconst QSRC={\n 0:['Skin tears in aged skin — ISTAP','https://www.skintears.org/resources'],\n 1:['Chronic wounds and debridement — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK576385/'],\n 2:['Wound contraction and contracture — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK554402/'],\n 3:['Physiology, Wound Healing — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK535406/'],\n 4:['Anatomy, Skin — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK441980/'],\n 5:['Diabetic foot: anhidrosis and fissures — IWGDF 2023','https://iwgdfguidelines.org/guidelines-2023/'],\n 6:['Burn depth and re-epithelialization — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK430741/'],\n 7:['Staging in dark skin tones — NPIAP poster','https://learn.npiap.com/products/npiap-staging-for-dark-skin-poster'],\n 8:['Histology, Skin Appendages — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK482237/'],\n 9:['Pressure injury staging and undermining — NPIAP','https://npiap.com/'],\n 10:['Wound healing phases and tensile strength — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK470443/'],\n 11:['Nail anatomy and growth — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK534769/'],\n 12:['TENS: mechanism and parameters — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK537188/'],\n 13:['Anatomy, Skin — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK441980/'],\n 14:['Wound healing phases and remodeling — StatPearls','https://www.ncbi.nlm.nih.gov/books/NBK470443/']\n};\nfunction qsrcLink(i){\n  const r=QSRC[i];\n  return r?`<a class=\"src\" href=\"${r[1]}\" target=\"_blank\" rel=\"noopener\">${r[0]} &#8599;</a>`:'';\n}\n\nlet i=0, answers=[], picked=null;\nconst stage=document.getElementById('stageArea');\nconst K=['A','B','C','D'];\n\nfunction pips(){\n  const p=document.getElementById('pips'); p.innerHTML='';\n  Q.forEach((q,n)=>{\n    const d=document.createElement('span'); d.className='pip';\n    if(answers[n]!==undefined) d.classList.add(answers[n]===q.a?'good':'bad');\n    p.appendChild(d);\n  });\n  const done=answers.filter(a=>a!==undefined).length;\n  const right=Q.filter((q,n)=>answers[n]===q.a).length;\n  document.getElementById('pcount').textContent = done\n    ? `${done} of ${Q.length} answered · ${right} correct`\n    : `${Q.length} questions. No time limit, no score kept anywhere.`;\n}\n\nfunction render(){\n  pips();\n  if(i>=Q.length) return results();\n  const q=Q[i];\n  const answered = answers[i]!==undefined;\n  stage.innerHTML=`<div class=\"card\">\n      <p class=\"stem\"><span class=\"case\">${q.case}</span>${q.q}</p>\n      <div class=\"opts\" id=\"opts\"></div>\n      <div id=\"whySlot\"></div>\n    </div>\n    <div class=\"nav\">\n      <button class=\"act ghost\" id=\"prev\" ${i===0?'disabled':''}>← Previous</button>\n      <button class=\"act\" id=\"next\" ${answered?'':'disabled'}>\n        ${i===Q.length-1?'See results':'Next question →'}</button>\n    </div>`;\n  const box=document.getElementById('opts');\n  q.opts.forEach((o,j)=>{\n    const b=document.createElement('button');\n    b.className='opt'; b.innerHTML=`<span class=\"k\">${K[j]}</span><span>${o}</span>`;\n    if(answered){\n      b.disabled=true;\n      if(j===q.a) b.classList.add('good');\n      else if(j===answers[i]) b.classList.add('bad');\n    }\n    b.onclick=()=>{ if(answers[i]!==undefined) return; answers[i]=j; render(); };\n    box.appendChild(b);\n  });\n  if(answered){\n    const right=answers[i]===q.a;\n    document.getElementById('whySlot').innerHTML=`<div class=\"why\">\n        <p class=\"verdict ${right?'y':'n'}\">${right?'Correct.':'Not this time — the answer is '+K[q.a]+'.'}</p>\n        <p>${q.why}</p>\n        <div class=\"trap\"><b>Worth noticing</b>${q.trap}${qsrcLink(i)}</div>\n      </div>`;\n  }\n  document.getElementById('prev').onclick=()=>{ if(i>0){i--;render();} };\n  document.getElementById('next').onclick=()=>{ i++; render(); window.scrollTo({top:0,behavior:'smooth'}); };\n}\n\nfunction results(){\n  const right=Q.filter((q,n)=>answers[n]===q.a).length;\n  const pct=right/Q.length;\n  const verdict = pct===1 ? 'Nothing left to find here. Go help somebody else study.'\n    : pct>=.8 ? 'Strong. Read through the ones you missed below, then leave it — you know this material.'\n    : pct>=.6 ? 'Reasonable base, with specific holes rather than a general one. The review below will show you which module to go back to.'\n    : 'Go back through modules one and six before you sit an exam on this. Most of the misses below come from those two, and the rest of the content hangs on them.';\n  stage.innerHTML=`<div class=\"card\">\n      <p class=\"score\">${right}<small> / ${Q.length}</small></p>\n      <p class=\"verdicttext\">${verdict}</p>\n      <div class=\"review\" id=\"review\"></div>\n      <div class=\"nav\" style=\"margin-top:26px\">\n        <button class=\"act ghost\" id=\"restart\">Start over</button>\n        <a class=\"act\" href=\"index.html\" style=\"text-decoration:none\">Back to all modules</a>\n      </div>\n    </div>`;\n  const rev=document.getElementById('review');\n  Q.forEach((q,n)=>{\n    const right=answers[n]===q.a;\n    const d=document.createElement('details'); d.className='rev'; d.open=!right;\n    d.innerHTML=`<summary><span class=\"mark ${right?'y':'n'}\">${right?'✓':'✕'}</span>\n        <span>${q.q}</span></summary>\n      <div class=\"body\"><p><b>Correct answer:</b> ${q.opts[q.a]}</p><p>${q.why}</p>${qsrcLink(n)}</div>`;\n    rev.appendChild(d);\n  });\n  document.getElementById('restart').onclick=()=>{ i=0; answers=[]; render(); window.scrollTo({top:0}); };\n}\n\nrender();\n<\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target;\n    var a = (t && t.closest) ? t.closest('a[href]') : null;\n    if(!a) return;\n    var h = a.getAttribute('href') || '';\n    if(/^[a-z0-9-]+\\.html$/i.test(h)){\n      e.preventDefault();\n      if(window.parent && window.parent !== window && window.parent.__nav){\n        window.parent.__nav(h.replace(/\\.html$/i,''));\n      }\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n"};
var ORDER = ["index", "layers", "strata-order", "sensation", "appendages", "physiology", "healing", "clinical"];

function load(name){
  if(!MODULES[name]) name = 'index';
  var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
  if(!doc){ document.getElementById('fallback').style.display='block'; return; }
  doc.open();
  doc.write(MODULES[name]);
  doc.close();
  try{ history.replaceState(null, '', '#' + name); }catch(e){}
  document.title = (name === 'index' ? 'Integumentary System' : name.replace(/-/g,' ')) +
                   ' — DPTD 733';
}
window.__nav = function(name){ load(name); };

window.addEventListener('hashchange', function(){
  var n = (location.hash || '').replace('#','');

});

var start = (location.hash || '').replace('#','');
try{

}catch(e){

}
