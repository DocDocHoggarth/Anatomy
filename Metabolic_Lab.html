<style>
  :root{
    --paper:#F1F0EA;
    --paper-raised:#FBFAF6;
    --ink:#221F1B;
    --ink-soft:#5B564E;
    --line:#D8D4C8;
    --crimson:#A6192E;
    --crimson-deep:#7E1223;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .hub{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  .hub-bar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    height:52px;
    border-bottom:2px solid var(--ink);
    background:var(--paper);
  }

  .hub-brand{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    white-space:nowrap;
    flex:0 0 auto;
  }

  .tab-strip{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    gap:8px;
    height:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tab-strip::-webkit-scrollbar{ display:none; }

  .tab-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    transition:border-color .15s, color .15s, background .15s;
  }
  .tab-btn .tab-num{ font-size:10.5px; font-weight:700; opacity:0.6; }
  .tab-btn:hover, .tab-btn:active{ border-color:var(--ink-soft); color:var(--ink); }
  .tab-btn.active{ border-color:var(--crimson); background:var(--crimson); color:#fff; }
  .tab-btn.active .tab-num{ opacity:0.85; }

  .iframe-wrap{
    flex:1 1 auto;
    min-height:0;
    background:var(--paper);
    -webkit-overflow-scrolling:touch;
  }
  #activityFrame{
    width:100%; height:100%; border:none; display:block;
  }
</style>
</head>

  function decodeB64Utf8(b64){
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function loadActivity(id){
    const act = activities.find(a => a.id === id);
    if(!act) return;
    document.getElementById('activityFrame').srcdoc = decodeB64Utf8(act.b64);
    document.querySelectorAll('.tab-btn').forEach(t => {
      t.classList.toggle('active', t.dataset.id === id);
    });
  }

  function renderTabs(){
    const strip = document.getElementById('tabStrip');
    strip.innerHTML = activities.map((a, i) => `
      <button class="tab-btn" data-id="${a.id}" title="${a.desc}">
        <span class="tab-num">0${i + 1}</span>
        <span>${a.short}</span>
      </button>
    `).join('');
    strip.querySelectorAll('.tab-btn').forEach(t => {
      t.addEventListener('click', () => loadActivity(t.dataset.id));
    });
  }

  renderTabs();
  loadActivity(activities[0].id);
</script>

</html>
