<!doctype html>
<html lang="en">
<head>
<!-- LL:SHELL-HEAD START v1.7 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lab Lockdown</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
  <style id="ll-shell-css">
:root {
  --ncc-cardinal:     #C8102E;
  --ncc-red-032:      #EF3340;
  --ncc-light-blue:   #6DCFF6;
  --ncc-medium-blue:  #4599C7;
  --ncc-cardinal-75:  #D24057;
  --ncc-cardinal-50:  #E47082;
  --ncc-near-black:   #1A1A1A;
  --ncc-charcoal:     #333333;
  --ncc-slate:        #4A4A4A;
  --ncc-medium-gray:  #666666;
  --ncc-light-gray:   #D9D9D9;
  --ncc-off-white:    #F5F5F5;
  --ncc-white:        #FFFFFF;
  --ncc-lab-green:    #1B5E20;
  --ll-dropzone-tint: rgba(109, 207, 246, 0.12);
  --ll-dropzone-hover: rgba(109, 207, 246, 0.35);
  --ll-shadow-card: 0 2px 8px rgba(26, 26, 26, 0.12);
  --ll-shadow-lift: 0 10px 24px rgba(26, 26, 26, 0.28);
  --ll-font: "Carlito", Calibri, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ll-chip-font: 18px;
  --ll-chip-pad: 12px 16px;
}
/* Small iPad viewports (about 1024 x 690 with Safari toolbars): chips step down to 16px so every workspace fits without scrolling. */
@media (max-height: 760px), (max-width: 1100px) {
  :root { --ll-chip-font: 16px; --ll-chip-pad: 8px 12px; }
}
* { box-sizing: border-box; }
html, body { position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: var(--ll-font); font-size: 18px; color: var(--ncc-charcoal);
  background: var(--ncc-off-white);
  display: grid; grid-template-rows: 60px minmax(0, 1fr) 32px;
  height: 100vh; height: 100dvh;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; touch-action: manipulation; }
.ll-tap { touch-action: manipulation; }

/* Header */
#ll-header {
  background: var(--ncc-cardinal); color: var(--ncc-white); font-weight: 700;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 16px; min-width: 0;
}
.ll-h-left { font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ll-h-right { display: flex; align-items: center; gap: 18px; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ll-h-score { display: inline-block; }
.ll-h-score.is-pulse { animation: ll-pulse 300ms ease-out; }
.ll-h-timer { padding: 2px 10px; border-radius: 8px; }
.ll-h-timer.is-over { background: var(--ncc-white); color: var(--ncc-cardinal); animation: ll-outline 1.6s ease-in-out infinite; }
.ll-h-digits { display: flex; gap: 6px; }
.ll-digit {
  width: 32px; height: 40px; border: 1px solid var(--ncc-white); border-radius: 4px;
  display: grid; place-items: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.ll-digit.is-set { background: var(--ncc-white); color: var(--ncc-cardinal); }
.ll-digit.is-flash { animation: ll-flash 1.2s ease-out; }
@keyframes ll-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes ll-outline { 0%, 100% { box-shadow: 0 0 0 2px rgba(255,255,255,0.4); } 50% { box-shadow: 0 0 0 4px rgba(255,255,255,1); } }
@keyframes ll-flash { 0%, 60% { background: var(--ncc-lab-green); color: var(--ncc-white); border-color: var(--ncc-white); } 100% { background: var(--ncc-white); color: var(--ncc-cardinal); } }

/* Footer */
#ll-footer {
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--ncc-medium-gray); background: var(--ncc-off-white);
  white-space: nowrap; overflow: hidden;
}
body.ll-dark #ll-footer { background: var(--ncc-near-black); color: var(--ncc-light-gray); }
body.ll-green #ll-footer { background: var(--ncc-lab-green); color: var(--ncc-white); }

/* Screens */
#ll-app { position: relative; overflow: hidden; min-height: 0; }
.ll-screen { position: absolute; inset: 0; display: none; overflow: hidden; }
.ll-screen.is-active { display: flex; }

/* Buttons */
.ll-btn {
  min-height: 48px; padding: 0 18px; border-radius: 8px; border: 2px solid transparent;
  font-size: 18px; font-weight: 700; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.ll-btn-primary { background: var(--ncc-cardinal); color: var(--ncc-white); border-color: var(--ncc-cardinal); }
.ll-btn-primary:active { background: var(--ncc-red-032); border-color: var(--ncc-red-032); }
.ll-btn-secondary { background: var(--ncc-white); color: var(--ncc-cardinal); border-color: var(--ncc-cardinal); }
.ll-btn-secondary:active { background: var(--ncc-off-white); }
.ll-btn:disabled, .ll-btn.is-disabled { background: var(--ncc-white); color: var(--ncc-medium-gray); border-color: var(--ncc-light-gray); cursor: default; }
.ll-btn-green { background: var(--ncc-white); color: var(--ncc-lab-green); border-color: var(--ncc-white); }
.ll-btn-big { min-height: 56px; font-size: 20px; padding: 0 28px; }

/* Dark screens and story */
.ll-dark-screen { background: var(--ncc-near-black); color: var(--ncc-white); }
.ll-story { align-items: center; justify-content: center; padding: 16px; }
.ll-story::after {
  content: ""; position: absolute; inset: 6px; border: 2px solid var(--ncc-cardinal); border-radius: 8px;
  pointer-events: none; animation: ll-alarm 1.6s ease-in-out infinite;
}
@keyframes ll-alarm { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.ll-story-card {
  position: relative; z-index: 1; width: 720px; max-width: 100%; max-height: 100%; overflow: hidden;
  background: var(--ncc-charcoal); color: var(--ncc-white); border-left: 6px solid var(--ncc-cardinal);
  border-radius: 8px; padding: 24px 28px; box-shadow: var(--ll-shadow-lift);
}
.ll-story-card h1 { margin: 0 0 12px; font-size: 36px; display: flex; align-items: center; gap: 12px; }
.ll-story-card p { margin: 0 0 12px; font-size: 18px; line-height: 1.4; }
.ll-story-card .ll-story-kicker { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ncc-light-gray); margin-bottom: 4px; }
.ll-story-card .ll-story-last { font-weight: 700; }
.ll-story-card .ll-btn { margin-top: 8px; }
.ll-light { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: 0 0 auto; background: var(--ncc-cardinal); }
.ll-light.is-blink { animation: ll-alarm 1.6s ease-in-out infinite; }
.ll-light-blue { background: var(--ncc-medium-blue); }
.ll-light-green { background: #2E7D32; box-shadow: 0 0 0 2px var(--ncc-white); }

/* Start screen */
#ll-start { flex-direction: column; background: var(--ncc-slate); color: var(--ncc-white); }
#ll-start::before { content: ""; position: absolute; inset: 0; background: rgba(26,26,26,0.35); pointer-events: none; }
.ll-start-main { position: relative; flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 24px 48px; min-height: 0; }
.ll-start-left h1 { font-size: 40px; margin: 0 0 6px; }
.ll-start-left .ll-start-sub { font-size: 18px; margin: 0 0 2px; }
.ll-start-actions { margin-top: 28px; display: flex; gap: 12px; align-items: center; }
.ll-start-note { font-size: 14px; color: var(--ncc-light-gray); margin-top: 10px; }
.ll-logo { text-align: right; color: var(--ncc-white); line-height: 1.1; flex: 0 0 auto; }
.ll-logo .ll-logo-top { font-size: 24px; font-weight: 700; letter-spacing: 0.06em; }
.ll-logo .ll-logo-mid { font-size: 20px; margin-top: 6px; }
.ll-logo .ll-logo-bot { font-size: 30px; font-weight: 700; }
.ll-start-bar { position: relative; background: var(--ncc-cardinal); color: var(--ncc-white); text-align: center; font-size: 18px; font-weight: 700; padding: 12px 16px; }

/* Hub */
#ll-hub { flex-direction: column; background: var(--ncc-charcoal); color: var(--ncc-white); padding: 16px 16px 8px; gap: 12px; }
.ll-hub-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.ll-hub-top h1 { font-size: 36px; margin: 0; }
.ll-hub-warn { background: var(--ncc-near-black); border: 2px solid var(--ncc-red-032); border-radius: 8px; padding: 8px 12px; font-size: 16px; }
.ll-hub-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 220px; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ll-hub-grid > .ll-card-lock { grid-column: 4; grid-row: 1 / span 2; }
.ll-card {
  background: var(--ncc-near-black); color: var(--ncc-white); border: 2px solid var(--ncc-slate); border-radius: 8px;
  padding: 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 0;
  box-shadow: var(--ll-shadow-card); font-family: inherit;
}
.ll-card:active { border-color: var(--ncc-white); }
.ll-card-kicker { font-size: 14px; color: var(--ncc-light-gray); text-transform: uppercase; letter-spacing: 0.06em; }
.ll-card-name { font-size: 28px; font-weight: 700; line-height: 1.1; }
.ll-card-sys { font-size: 18px; color: var(--ncc-light-gray); }
.ll-card-status { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
.ll-card-digit { flex: 0 0 auto; min-width: 32px; height: 40px; padding: 0 6px; border-radius: 6px; background: var(--ncc-white); color: var(--ncc-cardinal); font-size: 24px; font-weight: 700; line-height: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.ll-card-pts { font-size: 16px; color: var(--ncc-light-gray); white-space: nowrap; }
.ll-card-lock { border-color: var(--ncc-cardinal); border-width: 3px; }
.ll-card.is-secured { border-color: #2E7D32; }
.ll-instructor {
  background: transparent; border: 1px solid var(--ncc-slate); color: var(--ncc-light-gray); font-size: 14px;
  border-radius: 8px; min-height: 48px; min-width: 120px; padding: 0 14px; cursor: pointer; font-family: inherit;
}

/* Room screen */
#ll-room { flex-direction: column; background: var(--ncc-off-white); padding: 8px 16px 0; gap: 8px; }
.ll-titlebar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; min-height: 48px; }
.ll-titlebar h2 { margin: 0; font-size: 28px; font-weight: 700; color: var(--ncc-cardinal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ll-level { font-size: 14px; color: var(--ncc-medium-gray); white-space: nowrap; border: 1px solid var(--ncc-light-gray); border-radius: 12px; padding: 2px 10px; background: var(--ncc-white); }
.ll-tb-spacer { flex: 1; }
.ll-progress { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--ncc-charcoal); white-space: nowrap; }
.ll-progress-bar { width: 64px; height: 8px; border-radius: 4px; background: var(--ncc-light-gray); overflow: hidden; }
.ll-progress-bar i { display: block; height: 100%; background: var(--ncc-cardinal); }
.ll-meter { font-size: 18px; font-weight: 700; white-space: nowrap; background: var(--ncc-white); border: 2px solid var(--ncc-cardinal); color: var(--ncc-cardinal); border-radius: 8px; padding: 6px 12px; }
.ll-meter.is-earned { border-color: var(--ncc-lab-green); color: var(--ncc-lab-green); }
.ll-instr-row { flex: 0 0 auto; display: flex; gap: 8px; align-items: stretch; }
.ll-instr {
  flex: 1; min-width: 0; background: var(--ncc-white); border-left: 6px solid var(--ncc-cardinal); border-radius: 8px;
  box-shadow: var(--ll-shadow-card); padding: 10px 14px; font-size: 18px; line-height: 1.3; display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.ll-instr .ll-physio { font-size: 15px; line-height: 1.3; color: var(--ncc-slate); }
.ll-instr .ll-physio b, .ll-story-card .ll-story-physio b { color: var(--ncc-medium-blue); font-weight: 700; }
.ll-story-card .ll-story-physio { font-size: 16px; color: var(--ncc-light-gray); border-left: 3px solid var(--ncc-medium-blue); padding-left: 12px; }
.ll-banner {
  flex: 0 0 auto; max-width: 46%; border-radius: 8px; border: 3px solid; background: var(--ncc-white);
  padding: 8px 14px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; line-height: 1.2;
}
.ll-banner .ll-icon { font-size: 22px; }
.ll-banner.is-good { border-color: var(--ncc-lab-green); color: var(--ncc-lab-green); }
.ll-banner.is-bad { border-color: var(--ncc-red-032); color: var(--ncc-near-black); }
.ll-banner.is-bad .ll-icon { color: var(--ncc-red-032); }
.ll-banner.is-info { border-color: var(--ncc-medium-blue); color: var(--ncc-charcoal); }
.ll-banner.is-info .ll-icon { color: var(--ncc-medium-blue); }
.ll-shake { animation: ll-shake 300ms linear; }
@keyframes ll-shake { 0%, 100% { transform: translateX(0); } 16% { transform: translateX(-8px); } 33% { transform: translateX(8px); } 50% { transform: translateX(-8px); } 66% { transform: translateX(8px); } 83% { transform: translateX(-8px); } }
.ll-workspace { flex: 1 1 auto; min-height: 0; position: relative; touch-action: none; display: flex; }
.ll-actionbar { flex: 0 0 64px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--ncc-light-gray); }
.ll-actionbar .ll-ab-spacer { flex: 1; }

/* Chips, zones, bank */
.ll-chip {
  background: var(--ncc-white); border: 2px solid var(--ncc-medium-blue); color: var(--ncc-charcoal);
  font-size: var(--ll-chip-font); font-weight: 700; line-height: 1.2; min-height: 48px; padding: var(--ll-chip-pad);
  border-radius: 8px; max-width: var(--ll-chip-max, 260px); display: flex; align-items: center; cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  box-shadow: var(--ll-shadow-card); position: relative; overflow-wrap: break-word;
}
.ll-chip.is-selected { outline: 3px solid var(--ncc-medium-blue); outline-offset: 2px; transform: translateY(-2px); box-shadow: var(--ll-shadow-lift); }
.ll-chip.is-placeholder { opacity: 0.35; border-style: dashed; box-shadow: none; }
.ll-chip.is-locked { border-color: var(--ncc-lab-green); cursor: default; padding-left: 30px; }
.ll-chip.is-locked::before { content: "\2713"; position: absolute; left: 9px; color: var(--ncc-lab-green); font-weight: 700; }
.ll-chip.is-revealed { background: rgba(69, 153, 199, 0.15); border-color: var(--ncc-medium-blue); padding-left: 30px; }
.ll-chip.is-revealed::before { content: "i"; position: absolute; left: 11px; color: var(--ncc-medium-blue); font-weight: 700; font-style: italic; font-family: Georgia, serif; }
.ll-ghost { position: fixed !important; left: 0; top: 0; margin: 0; pointer-events: none; z-index: 1000; box-shadow: var(--ll-shadow-lift); will-change: transform; }
.ll-zone {
  border: 2px dashed var(--ncc-light-blue); background: var(--ll-dropzone-tint); border-radius: 8px; min-height: 48px; min-width: 48px;
}
.ll-zone.is-over { background: var(--ll-dropzone-hover); border-style: solid; }
.ll-zone.is-selecting { border-color: var(--ncc-medium-blue); }
.ll-slot { display: flex; align-items: stretch; }
.ll-slot > .ll-chip { flex: 1; max-width: none; }
.ll-bank {
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; align-items: flex-start;
  background: var(--ncc-white); border: 2px dashed var(--ncc-light-gray); border-radius: 8px; padding: 8px; min-height: 64px;
}
.ll-bank.is-over { background: var(--ll-dropzone-tint); border-color: var(--ncc-light-blue); }
.ll-bank.is-nowrap > .ll-chip { white-space: nowrap; }
.ll-bank-label { width: 100%; font-size: 14px; color: var(--ncc-medium-gray); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: -2px; }

/* Layout: sort */
.ll-ws-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.ll-ws-col > .ll-bank { flex: 0 1 auto; min-height: 56px; overflow-y: auto; }
.ll-cats { flex: 1 1 0; min-height: 110px; display: grid; gap: 8px; }
.ll-cat { display: flex; flex-direction: column; min-height: 0; background: var(--ncc-white); border-radius: 8px; box-shadow: var(--ll-shadow-card); overflow: hidden; }
.ll-cat-head { flex: 0 0 auto; padding: 6px 12px; font-size: 20px; font-weight: 700; color: var(--ncc-white); background: var(--ncc-charcoal); border-bottom: 3px solid var(--ncc-cardinal); }
.ll-cat-sub { display: block; font-size: 14px; font-weight: 400; color: var(--ncc-light-gray); }
.ll-cat-body { flex: 1; min-height: 48px; margin: 4px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; align-items: flex-start; padding: 4px; overflow-y: auto; }

/* Layout: match */
.ll-match-grid { flex: 0 0 auto; display: grid; gap: 6px 8px; align-content: start; }
.ll-mrow { display: flex; gap: 8px; align-items: stretch; background: var(--ncc-white); border-radius: 8px; box-shadow: var(--ll-shadow-card); padding: 4px 4px 4px 10px; }
.ll-mterm { flex: 1; min-width: 0; font-size: 16px; line-height: 1.2; display: flex; align-items: center; }
.ll-mrow > .ll-zone { flex: 0 0 auto; }

/* Layout: grouped match (rows shown as cards, e.g. two slots per structure) */
.ll-mgroups { flex: 0 0 auto; display: grid; gap: 8px; }
.ll-mgroup { background: var(--ncc-white); border-radius: 8px; box-shadow: var(--ll-shadow-card); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ll-mgroup-head { padding: 6px 12px; font-size: 20px; font-weight: 700; color: var(--ncc-white); background: var(--ncc-charcoal); border-bottom: 3px solid var(--ncc-cardinal); }
.ll-mgroup-body { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.ll-cat-rowcap { margin: 2px 8px 0; font-size: 14px; }
.ll-mcap { font-size: 14px; font-weight: 700; color: var(--ncc-medium-gray); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.ll-mgroup-body > .ll-zone { min-height: var(--ll-mslot-h, 64px); }

/* Layout: graph (bank column on the left, graph on the right) */
.ll-ws-row { flex: 1; min-width: 0; display: flex; gap: 8px; }
.ll-ws-row > .ll-bank { flex: 0 0 var(--ll-gbank-w, 250px); flex-direction: column; flex-wrap: nowrap; align-items: stretch; overflow-y: auto; }
.ll-ws-row > .ll-bank > .ll-chip { max-width: none; }
.ll-ws-row > .ll-bank.is-cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }

/* Layout: label / graph / hotspot */
.ll-stage { flex: 1 1 0; min-height: 0; position: relative; }
.ll-stage-inner { position: absolute; }
.ll-stage-inner > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ll-ozone { position: absolute; display: flex; align-items: stretch; }
.ll-ozone > .ll-chip { flex: 1; max-width: none; min-height: 0; padding: 2px 8px; line-height: 1.1; justify-content: center; text-align: center; box-shadow: none; }
.ll-ozone > .ll-chip.is-locked, .ll-ozone > .ll-chip.is-revealed { padding-left: 20px; padding-right: 4px; }
.ll-ozone > .ll-chip.is-locked::before { left: 5px; }
.ll-ozone > .ll-chip.is-revealed::before { left: 7px; }
.ll-hot { position: absolute; border: 2px dashed transparent; border-radius: 8px; background: transparent; cursor: pointer; padding: 0; font-family: inherit; }
.ll-hot.is-round { border-radius: 50%; }
.ll-hot.is-found { border: 3px solid var(--ncc-lab-green); background: rgba(27, 94, 32, 0.08); }
.ll-hot.is-shown { border: 3px solid var(--ncc-medium-blue); background: rgba(69, 153, 199, 0.12); }
.ll-hot.is-wrong { border: 3px solid var(--ncc-red-032); }
.ll-hot-tag { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; background: var(--ncc-white); border: 2px solid var(--ncc-lab-green); border-radius: 6px; padding: 2px 8px; font-size: 14px; font-weight: 700; color: var(--ncc-charcoal); pointer-events: none; }
.ll-hot.is-shown .ll-hot-tag { border-color: var(--ncc-medium-blue); }
.ll-prompt { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ncc-white); border: 2px solid var(--ncc-medium-blue); border-radius: 8px; padding: 8px 14px; font-size: 20px; font-weight: 700; }
.ll-prompt small { font-size: 14px; color: var(--ncc-medium-gray); font-weight: 400; }

/* Layout: loop */
.ll-loop { flex: 1; min-width: 0; display: grid; grid-template-columns: 34px 1fr 34px 1fr 34px 1fr 34px; grid-template-rows: auto minmax(0, 1fr) auto; gap: 2px 0; }
.ll-loop-cell { display: flex; flex-direction: column; min-width: 0; position: relative; padding-top: 9px; }
.ll-loop-cap { position: absolute; top: 0; left: 10px; z-index: 2; line-height: 18px; padding: 0 6px; background: var(--ncc-off-white); font-size: 16px; font-weight: 700; color: var(--ncc-charcoal); pointer-events: none; }
.ll-loop-cell > .ll-zone { flex: 1; min-height: 60px; }
.ll-loop-cell.is-bottom { padding-top: 0; padding-bottom: 9px; }
.ll-loop-cell.is-bottom .ll-loop-cap { top: auto; bottom: 0; }
.ll-harrow.is-bottom { align-self: start; }

.ll-varrow { display: flex; justify-content: center; position: relative; }
.ll-varrow::before { content: ""; position: absolute; top: 6px; bottom: 6px; left: 50%; border-left: 3px solid var(--ncc-medium-blue); transform: translateX(-50%); }

.ll-varrow.is-down::after { bottom: 0; border-top: 12px solid var(--ncc-medium-blue); }

.ll-loop-mid { grid-column: 2 / 7; display: flex; flex-direction: column; min-height: 0; padding: 8px 4px 0; position: relative; }

/* Layout: sequence */
.ll-seq { flex: 1; min-width: 0; display: flex; gap: 12px; }
.ll-seq > .ll-bank { flex: 0 0 44%; flex-direction: column; flex-wrap: nowrap; align-items: stretch; overflow-y: auto; }

  position: absolute; left: 16px; right: 16px; bottom: 72px; max-height: 40%; z-index: 50;

}
@keyframes ll-slideup { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.ll-hint-head { background: var(--ncc-medium-blue); color: var(--ncc-white); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding-left: 16px; }
.ll-hint-close { width: 48px; height: 48px; border: 0; background: transparent; color: var(--ncc-white); font-size: 28px; cursor: pointer; }
.ll-hint-body { padding: 14px 16px 18px; font-size: 18px; line-height: 1.4; color: var(--ncc-charcoal); overflow-y: auto; }
.ll-hint-body p { margin: 0 0 8px; }
.ll-sheet-back { position: fixed; inset: 0; z-index: 2000; background: rgba(26,26,26,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.ll-sheet { background: var(--ncc-white); color: var(--ncc-charcoal); border-radius: 8px; border-left: 6px solid var(--ncc-cardinal); box-shadow: var(--ll-shadow-lift); width: 520px; max-width: 100%; padding: 22px 24px; }

/* Secured */

.ll-sec-stats { font-size: 18px; line-height: 1.5; }

.ll-lock-msg.is-bad { border: 3px solid var(--ncc-red-032); background: var(--ncc-near-black); }
.ll-lock-msg.is-bad .ll-icon { color: var(--ncc-red-032); }
.ll-lock-actions { display: flex; gap: 12px; }
